<style>
:root{
  --bg:#EEF2EC; --panel:#FFFFFF; --ink:#18231C; --muted:#6C7A70; --line:#DCE4DA;
  --brand:#4F8A52; --brand-dk:#356B41; --brand-soft:#E4EFE1;
  --accent:#E4532B; --accent-soft:#FBE5DD;
  --gold:#C79A2E;
  --f-org:#E2E2E2; --f-ass:#F4DE9A; --f-pro:#D9CFEA; --f-con:#B9D6EE; --f-inst:#BFE0B4; --f-rec:#F1B0B0;
  --shadow:0 1px 2px rgba(24,35,28,.06),0 8px 24px rgba(24,35,28,.05);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:14px;line-height:1.45}
.mono{font-variant-numeric:tabular-nums}
h1,h2,h3,.disp{font-family:'Space Grotesk',Inter,sans-serif;letter-spacing:-.01em}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px}
a{color:var(--brand-dk)}
.app{display:flex;min-height:100vh}
/* sidebar */
.side{width:230px;flex:0 0 230px;background:var(--brand-dk);color:#EAF3E8;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:20px 20px 14px;display:flex;align-items:center;gap:11px;border-bottom:1px solid rgba(255,255,255,.12)}
.sun{width:30px;height:30px;flex:0 0 30px;border-radius:50%;background:radial-gradient(circle at 50% 45%,#F6B24A,var(--accent));position:relative;box-shadow:0 0 0 3px rgba(228,83,43,.18)}
.brand b{font-family:'Space Grotesk';font-size:16px;letter-spacing:.02em;display:block;line-height:1.1}
.brand span{font-size:10px;letter-spacing:.28em;color:#B9D3B4;text-transform:uppercase}
.nav{padding:10px 10px;flex:1;overflow:auto}
.nav button{width:100%;text-align:left;background:none;border:0;color:#CFE3CB;padding:10px 12px;border-radius:9px;display:flex;align-items:center;gap:10px;font-weight:500;font-size:13.5px;margin-bottom:2px}
.nav button:hover{background:rgba(255,255,255,.08);color:#fff}
.nav button.on{background:#EEF2EC;color:var(--brand-dk);font-weight:600}
.nav .ic{width:18px;text-align:center;font-size:15px}
.side .foot{padding:12px 16px;border-top:1px solid rgba(255,255,255,.12);font-size:11px;color:#9FBE9A}
/* main */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{background:var(--panel);border-bottom:1px solid var(--line);padding:16px 26px;display:flex;align-items:center;justify-content:space-between;gap:16px;position:sticky;top:0;z-index:5}
.top h1{margin:0;font-size:20px}
.top .sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.wrap{padding:22px 26px;max-width:1500px;width:100%}
.btn{background:var(--brand);color:#fff;border:0;padding:9px 16px;border-radius:9px;font-weight:600;font-size:13.5px;display:inline-flex;align-items:center;gap:7px}
.btn:hover{background:var(--brand-dk)}
.btn.acc{background:var(--accent)} .btn.acc:hover{background:#c8431f}
.btn.gh{background:#fff;color:var(--ink);border:1px solid var(--line)} .btn.gh:hover{border-color:var(--brand);color:var(--brand-dk)}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:8px}
.btn.link{background:none;color:var(--muted);padding:5px 8px} .btn.link:hover{color:var(--accent)}
/* cards */
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px 16px;box-shadow:var(--shadow)}
.kpi .lab{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.kpi .val{font-family:'Space Grotesk';font-size:27px;font-weight:700;margin-top:5px}
.kpi.euro .val{color:var(--brand-dk)} .kpi.warn .val{color:var(--accent)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.card h3{margin:0;padding:14px 18px;border-bottom:1px solid var(--line);font-size:14.5px;display:flex;justify-content:space-between;align-items:center}
.card .bd{padding:14px 18px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:900px){.two{grid-template-columns:1fr}}
/* table */
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px;background:var(--panel);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:9px 11px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:#F6F9F5;color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;position:sticky;top:0;z-index:1}
tr:last-child td{border-bottom:0}
tr:hover td{background:#F9FBF8}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.eur{font-variant-numeric:tabular-nums;font-weight:600}
/* phase pill */
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}
.ph-Daassegnare{background:var(--f-org)} .ph-Assegnato{background:var(--f-ass)} .ph-Prontoconsegna{background:var(--f-pro)}
.ph-Consegnato{background:var(--f-con)} .ph-Installato{background:var(--f-inst)} .ph-RECESSO{background:var(--f-rec)}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;background:var(--brand-soft);color:var(--brand-dk);font-size:11.5px;font-weight:600}
.tag.warm{background:var(--accent-soft);color:#b8431f}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
.flag{display:inline-block;padding:2px 8px;border-radius:6px;background:#FFF3D6;color:#7a5c00;font-size:11px;font-weight:700}
/* filters */
.filters{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:14px;align-items:center}
.filters input,.filters select{padding:8px 11px;border:1px solid var(--line);border-radius:9px;background:#fff;min-width:130px}
.filters input:focus,.filters select:focus{outline:2px solid var(--brand-soft);border-color:var(--brand)}
/* modal */
.ovl{position:fixed;inset:0;background:rgba(24,35,28,.45);display:flex;justify-content:center;align-items:flex-start;padding:30px 16px;z-index:40;overflow:auto}
.modal{background:var(--panel);border-radius:16px;width:100%;max-width:960px;box-shadow:0 30px 80px rgba(0,0,0,.3);animation:pop .18s ease}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.modal .hd{padding:16px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#fff;border-radius:16px 16px 0 0}
.modal .hd h2{margin:0;font-size:18px}
.modal .bd{padding:20px 22px}
.modal .ft{padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center;position:sticky;bottom:0;background:#fff;border-radius:0 0 16px 16px}
.x{background:none;border:0;font-size:22px;color:var(--muted);line-height:1;padding:2px 6px}
.x:hover{color:var(--accent)}
/* form */
.form{display:grid;grid-template-columns:repeat(2,1fr);gap:13px 16px}
.form .full{grid-column:1/-1}
.fld{display:flex;flex-direction:column;gap:5px}
.fld label{font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.fld input,.fld select,.fld textarea{padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:#fff}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:2px solid var(--brand-soft);border-color:var(--brand)}
.sec{grid-column:1/-1;font-family:'Space Grotesk';font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brand-dk);border-bottom:2px solid var(--brand-soft);padding-bottom:5px;margin-top:6px}
.slotrow{display:grid;grid-template-columns:1fr 70px;gap:8px;align-items:end}
/* live compenso panel */
.calc{grid-column:1/-1;background:var(--brand-soft);border:1px solid #CFE2CA;border-radius:12px;padding:14px 16px;display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:space-between}
.calc .row{display:flex;gap:20px;flex-wrap:wrap}
.calc .it .k{font-size:11px;color:var(--brand-dk);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.calc .it .v{font-family:'Space Grotesk';font-size:20px;font-weight:700}
.calc .big .v{font-size:26px;color:var(--brand-dk)}
/* pipeline signature */
.pipe{display:flex;gap:3px;margin-top:3px}
.pipe .st{height:7px;border-radius:3px;flex:1;background:#E3E9E1}
.empty{padding:40px;text-align:center;color:var(--muted)}
.empty .big{font-size:15px;color:var(--ink);font-weight:600;margin-bottom:4px}
.hint{font-size:12px;color:var(--muted)}
.rowbtns{display:flex;gap:4px}
.miss{color:var(--accent);font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 20px;border-radius:10px;box-shadow:var(--shadow);z-index:60;font-weight:500;animation:pop .2s}
.split{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}
.att{width:96px;position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.att img{width:96px;height:72px;object-fit:cover;display:block;cursor:pointer}
.attv{width:96px;height:72px;display:flex;align-items:center;justify-content:center;font-size:30px;background:#F3F6F1;cursor:pointer}
.attname{font-size:10px;padding:3px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.attx{position:absolute;top:3px;right:3px;width:20px;height:20px;border:0;border-radius:50%;background:rgba(24,35,28,.7);color:#fff;font-size:12px;line-height:1;cursor:pointer}
.attx:hover{background:var(--accent)}
@media(max-width:1000px){
  .split{grid-template-columns:1fr}.form{grid-template-columns:1fr}.two{grid-template-columns:1fr}
  .app{flex-direction:column}
  .side{width:100%;flex:none;height:auto;position:sticky;top:0;z-index:20}
  .brand{padding:11px 16px}
  .nav{display:flex;overflow-x:auto;padding:8px;gap:6px;-webkit-overflow-scrolling:touch}
  .nav button{width:auto;white-space:nowrap;margin:0;flex:0 0 auto;font-size:13px;padding:8px 12px}
  .side .foot{display:none}
  .top{padding:12px 16px}.top h1{font-size:17px}.wrap{padding:14px}
}
.barrow{display:flex;align-items:center;gap:10px;margin-bottom:7px}
.barrow .nm{width:40px;font-size:12px;color:var(--muted);font-weight:600}
.bar{flex:1;height:16px;background:#EEF2EC;border-radius:6px;overflow:hidden;display:flex}
.bar .fill{background:var(--brand);height:100%}
.bar .fill.b{background:var(--gold)}
.barrow .vv{width:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
</style>
</head>

function migrate(d){
  if(!d||typeof d!=="object")return d;
  if(d.zoneMap){const m={};Object.entries(d.zoneMap).forEach(([k,v])=>{m[k]=Array.isArray(v)?v.filter(Boolean):(v?[v]:[]);});d.zoneMap=m;}
  return d;
}
function load(){

}

const cloudOn=c=>!!(c&&c.url&&c.key);
async function cloudPushData(cfg,data){
  const h={apikey:cfg.key,Authorization:"Bearer "+cfg.key,"Content-Type":"application/json",Prefer:"resolution=merge-duplicates,return=minimal"};
  const r=await fetch(cfg.url.replace(/\/+$/,"")+"/rest/v1/app_state",{method:"POST",headers:h,body:JSON.stringify([{id:1,data:data,updated_at:new Date().toISOString()}])});
  if(!r.ok)throw new Error("HTTP "+r.status+" — "+(await r.text()).slice(0,140));
}
async function cloudPullData(cfg){
  const h={apikey:cfg.key,Authorization:"Bearer "+cfg.key};
  const r=await fetch(cfg.url.replace(/\/+$/,"")+"/rest/v1/app_state?id=eq.1&select=data,updated_at",{headers:h});
  if(!r.ok)throw new Error("HTTP "+r.status);
  const j=await r.json();return (j&&j[0])?j[0]:null;
}

/* ---------- file allegati (IndexedDB) ---------- */
const IDB="arquati_files",STORE="files";
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open(IDB,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(STORE))r.result.createObjectStore(STORE);};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function filePut(id,blob){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction(STORE,"readwrite");t.objectStore(STORE).put(blob,id);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);});}
async function fileGet(id){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction(STORE,"readonly");const q=t.objectStore(STORE).get(id);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});}
async function fileDel(id){const d=await idb();return new Promise((res)=>{const t=d.transaction(STORE,"readwrite");t.objectStore(STORE).delete(id);t.oncomplete=()=>res();t.onerror=()=>res();});}

/* ---------- calcolo pose ---------- */
function compute(p,db){
  const cli=db.clienti.find(c=>c.id===p.clienteId);
  const provincia=cli?cli.provincia:"";
  const zval=db.zoneMap[provincia];
  const consigliati=Array.isArray(zval)?zval.filter(Boolean):(zval?[zval]:[]);
  const consigliato=consigliati[0]||"";        // primo suggerito dalla zona
  const effInst=p.installatore||"";               // installatore scelto (auto-compilato dalla zona)
  const climaList=[p.clima1,p.clima2,p.clima3,p.clima4].filter(Boolean);
  const ambito=climaList.length?"Climatizzatore":(p.termico?"Termico":"");
  const compClima=climaList.reduce((s,cf)=>{const t=db.tariffe.clima.find(x=>x.config===cf);return s+(t?+t.compenso:0);},0);
  const tt=db.tariffe.termico.find(x=>x.prodotto===p.termico);
  const compensoStd=compClima+(tt?+tt.compenso:0);
  const slots=[[p.ex1,p.q1],[p.ex2,p.q2],[p.ex3,p.q3]];
  let extraTot=slots.reduce((s,[v,q])=>{
    if(!v)return s;const e=db.tariffe.extra.find(x=>x.voce===v);if(!e)return s;
    const pr=ambito==="Termico"?(e.termico||0):(e.clima||0);
    return s+(Number(q)||1)*pr;
  },0)+(Number(p.altriExtra)||0);
  const recesso=p.recesso==="Recesso";
  const compensoInst=recesso?0:compensoStd+extraTot;
  const scadRecesso=p.dataVendita?addDays(p.dataVendita,15):"";
  let fase="";
  if(!p.clienteId&&!p.nContratto)fase="";
  else if(recesso)fase="RECESSO";
  else if(p.dataInstallazione)fase="Installato";
  else if(!effInst)fase="Da assegnare";
  else if(p.dataConsegna)fase="Consegnato";
  else if(p.preparazione==="Pronto consegna")fase="Pronto consegna";
  else fase="Assegnato";
  const daPian=!p.dataInstallazione&&!p.dataPrevista&&["Assegnato","Pronto consegna","Consegnato"].includes(fase);
  return {provincia,consigliato,consigliati,effInst,ambito,climaList,compensoStd,extraTot,compensoInst,scadRecesso,fase,daPian,cliente:cli?cli.nome:"",termProd:tt};
}
const FASE_IDX={"Da assegnare":1,"Assegnato":2,"Pronto consegna":3,"Consegnato":4,"Installato":5,"RECESSO":0};

/* ---------- Cruscotto ---------- */
function Dash({comp,db}){
  const rows=comp.map(x=>x.c);
  const attive=rows.filter(c=>c.fase&&c.fase!=="RECESSO");
  const installate=rows.filter(c=>c.fase==="Installato");
  const recessi=rows.filter(c=>c.fase==="RECESSO");
  const previsto=rows.reduce((s,c)=>s+c.compensoInst,0);
  const daLiq=installate.reduce((s,c)=>s+c.compensoInst,0);
  const vendTot=comp.reduce((s,{p,c})=>s+(c.fase?(+p.importoVendita||0):0),0);
  const vendNet=comp.reduce((s,{p,c})=>s+((c.fase&&c.fase!=="RECESSO")?(+p.importoVendita||0):0),0);
  const perFase=FASI.map(f=>[f,rows.filter(c=>c.fase===f).length]);
  const daAssegnare=rows.filter(c=>c.fase==="Da assegnare").length;
  const daPian=rows.filter(c=>c.daPian).length;
  const t=today();
  const prossimi=comp.filter(({p,c})=>p.dataPrevista&&!p.dataInstallazione&&p.dataPrevista>=t&&diffDays(p.dataPrevista,t)<=7).length;
  const recAperto=comp.filter(({p,c})=>c.scadRecesso&&!p.dataInstallazione&&c.fase!=="RECESSO"&&c.scadRecesso>=t).length;
  const saldati=comp.filter(({p,c})=>p.saldato==="Sì"&&!p.dataInstallazione&&c.fase!=="RECESSO").length;
  // mesi
  const mesi=Array.from({length:12},(_,m)=>{
    const ym=`2026-${String(m+1).padStart(2,"0")}`;
    const vend=comp.filter(({p})=>p.dataVendita&&p.dataVendita.slice(0,7)===ym);
    const inst=comp.filter(({p})=>p.dataInstallazione&&p.dataInstallazione.slice(0,7)===ym);
    return {m:["Gen","Feb","Mar","Apr","Mag","Giu","Lug","Ago","Set","Ott","Nov","Dic"][m],
      pv:vend.length,vend:vend.reduce((s,{p})=>s+(+p.importoVendita||0),0),
      ni:inst.length,ci:inst.reduce((s,{c})=>s+c.compensoInst,0)};
  });
  const maxCi=Math.max(1,...mesi.map(x=>x.ci));
  const KPI=(l,v,cl)=>(<div className={"kpi "+(cl||"")}><div className="lab">{l}</div><div className="val mono">{v}</div></div>);
  return (<>
    <div className="grid kpis" style={{marginBottom:16}}>
      {KPI("Pose totali",rows.filter(c=>c.fase).length)}
      {KPI("Pose attive",attive.length)}
      {KPI("Installate",installate.length)}
      {KPI("Recessi",recessi.length,"warn")}
      {KPI("Compenso installatori previsto",eur(previsto),"euro")}
      {KPI("Da liquidare (installati)",eur(daLiq),"euro")}
      {KPI("Venduto totale",eur(vendTot),"euro")}
      {KPI("Venduto netto (no recessi)",eur(vendNet),"euro")}
    </div>
    <div className="two" style={{marginBottom:16}}>
      <div className="card"><h3>Pose per fase</h3><div className="bd">
        {perFase.map(([f,n])=>(<div key={f} style={{display:"flex",alignItems:"center",gap:10,padding:"6px 0"}}>
          <span className={"pill "+FCLASS(f)}>{f}</span><div style={{flex:1}}/><b className="mono" style={{fontSize:16}}>{n}</b></div>))}
      </div></div>
      <div className="card"><h3>Programmazione interventi</h3><div className="bd">
        {[["Da assegnare (serve installatore)",daAssegnare,"#E2E2E2"],["Da programmare (assegnate, senza data)",daPian,"#FFF3D6"],["Pose previste nei prossimi 7 gg",prossimi,"#DCEBD4"],["Recesso ancora aperto",recAperto,"#FCE9CC"],["Saldati, da installare",saldati,"#E1E9F5"]].map(([l,v,bg])=>(
          <div key={l} style={{display:"flex",alignItems:"center",gap:10,padding:"7px 0"}}>
            <span style={{width:12,height:12,borderRadius:4,background:bg,display:"inline-block"}}/><span>{l}</span><div style={{flex:1}}/><b className="mono" style={{fontSize:18}}>{v}</b></div>))}
      </div></div>
    </div>
    <div className="card"><h3>Andamento 2026 <span className="hint">vendite · installazioni · compenso installato</span></h3><div className="bd">
      <div className="tbl-wrap" style={{boxShadow:"none",border:0}}><table>
        <thead><tr><th>Mese</th><th className="num">Pose vendute</th><th className="num">Venduto</th><th className="num">Installate</th><th className="num">Compenso installato</th><th style={{width:160}}></th></tr></thead>
        <tbody>{mesi.map(x=>(<tr key={x.m}><td>{x.m}</td><td className="num">{x.pv||""}</td><td className="num eur">{x.vend?eur(x.vend):""}</td><td className="num">{x.ni||""}</td><td className="num eur">{x.ci?eur(x.ci):""}</td>
          <td><div className="bar"><div className="fill" style={{width:(x.ci/maxCi*100)+"%"}}/></div></td></tr>))}
          <tr style={{fontWeight:700}}><td>Totale</td><td className="num">{mesi.reduce((s,x)=>s+x.pv,0)}</td><td className="num eur">{eur(mesi.reduce((s,x)=>s+x.vend,0))}</td><td className="num">{mesi.reduce((s,x)=>s+x.ni,0)}</td><td className="num eur">{eur(mesi.reduce((s,x)=>s+x.ci,0))}</td><td></td></tr>
        </tbody></table></div>
    </div></div>
  </>);
}

/* ---------- Agenda ---------- */
function Agenda({comp,openPose}){
  const t=today();
  const daAssegnare=comp.filter(({c})=>c.fase==="Da assegnare");
  const daPian=comp.filter(({c})=>c.daPian);
  const prog=comp.filter(({p,c})=>p.dataPrevista&&!p.dataInstallazione&&c.fase!=="RECESSO"&&c.effInst).sort((a,b)=>a.p.dataPrevista.localeCompare(b.p.dataPrevista));
  const eseguite=comp.filter(({c})=>c.fase==="Installato").sort((a,b)=>(b.p.dataInstallazione||"").localeCompare(a.p.dataInstallazione||""));
  const recessi=comp.filter(({c})=>c.fase==="RECESSO");
  const Card=({title,items,dateGet,dateHdr})=>(
    <div className="card"><h3>{title} <span className="tag">{items.length}</span></h3>
      <div className="tbl-wrap" style={{boxShadow:"none",border:0}}>
      {items.length===0?<div className="empty"><div className="hint">Niente qui per ora.</div></div>:
      <table><thead><tr><th>Contratto</th><th>Cliente</th><th>Prov.</th><th>Installatore</th><th>Prodotti</th>{dateGet&&<th>{dateHdr}</th>}<th>Fase</th></tr></thead>
      <tbody>{items.map(({p,c})=>{
        const prods=[...c.climaList,p.termico].filter(Boolean).join(" · ");
        const dv=dateGet?dateGet(p):"";
        const imm=dateHdr==="Data prevista"&&dv&&dv>=t&&diffDays(dv,t)<=7;
        return(<tr key={p.id} onClick={()=>openPose(structuredClone(p))} style={{cursor:"pointer"}}><td><b>{p.nContratto}</b></td><td>{c.cliente}</td><td>{c.provincia}</td>
          <td>{c.effInst||<span className="miss">— da assegnare</span>}</td><td className="hint">{prods}</td>
          {dateGet&&<td className="mono">{fmtD(dv)} {imm&&<span className="flag">tra {diffDays(dv,t)}g</span>}</td>}
          <td><span className={"pill "+FCLASS(c.fase)}>{c.fase}</span></td></tr>);
      })}</tbody></table>}
      </div></div>
  );
  return (<div className="grid" style={{gap:16}}>
    <div className="hint" style={{marginTop:-4}}>Tocca una riga per aprire la pratica.</div>
    <Card title="Da assegnare — serve scegliere l'installatore" items={daAssegnare}/>
    <Card title="Da programmare — assegnate, senza data" items={daPian}/>
    <Card title="Programmate — per data prevista" items={prog} dateGet={p=>p.dataPrevista} dateHdr="Data prevista"/>
    <Card title="Posa eseguita — installate" items={eseguite} dateGet={p=>p.dataInstallazione} dateHdr="Data installazione"/>
    <Card title="Recessi" items={recessi}/>
  </div>);
}

/* ---------- POSE ---------- */
const emptyPose=()=>({id:uid(),nContratto:"",clienteId:"",consulente:"",dataApp:"",clima1:"",clima2:"",clima3:"",clima4:"",termico:"",importoVendita:"",installatore:"",dataVendita:"",recesso:"",preparazione:"",modalitaConsegna:"",dataConsegna:"",dataPrevista:"",dataInstallazione:"",ex1:"",q1:"",ex2:"",q2:"",ex3:"",q3:"",altriExtra:"",saldato:"",note:"",link:""});
function Pose({comp,db,up,flash,openPose}){
  const [q,setQ]=useState("");const [ff,setFf]=useState("");const [fi,setFi]=useState("");
  const totByContr=useMemo(()=>{const m={};comp.forEach(({p,c})=>{m[p.nContratto]=(m[p.nContratto]||0)+c.compensoInst;});return m;},[comp]);
  let rows=comp;
  if(q){const s=q.toLowerCase();rows=rows.filter(({p,c})=>(p.nContratto+" "+c.cliente+" "+c.effInst).toLowerCase().includes(s));}
  if(ff)rows=rows.filter(({c})=>c.fase===ff);
  if(fi)rows=rows.filter(({c})=>c.effInst===fi);
  const del=id=>{if(confirm("Eliminare questa pratica?")){const pz=comp.find(x=>x.p.id===id);if(pz)(pz.p.files||[]).forEach(f=>{try{fileDel(f.id);}catch(e){}});up(d=>{d.pose=d.pose.filter(x=>x.id!==id);return d;});flash("Pratica eliminata");}};
  return(<>
    <div className="filters">
      <input placeholder="Cerca contratto, cliente, installatore…" value={q} onChange={e=>setQ(e.target.value)} style={{minWidth:260}}/>
      <select value={ff} onChange={e=>setFf(e.target.value)}><option value="">Tutte le fasi</option>{FASI.map(f=>(<option key={f}>{f}</option>))}</select>
      <select value={fi} onChange={e=>setFi(e.target.value)}><option value="">Tutti gli installatori</option>{db.installatori.map(i=>(<option key={i.id}>{i.nome}</option>))}</select>
      <div style={{flex:1}}/><span className="hint">{rows.length} pratiche</span>
    </div>
    <div className="tbl-wrap">
      {rows.length===0?<div className="empty"><div className="big">Nessuna pratica</div><div className="hint">Premi “Nuova pratica” per iniziare.</div></div>:
      <table><thead><tr><th>Contratto</th><th>Cliente</th><th>Prov.</th><th>Prodotti</th><th>Consulente</th><th>Installatore</th><th>Fase</th><th className="num">Compenso</th><th className="num">Tot. contratto</th><th>Da progr.</th><th></th></tr></thead>
      <tbody>{rows.map(({p,c})=>{
        const prods=[...c.climaList,p.termico].filter(Boolean);
        return(<tr key={p.id} onClick={()=>openPose(structuredClone(p))} style={{cursor:"pointer"}}>
          <td><b>{p.nContratto||"—"}</b>{p.files&&p.files.length>0&&<span title={p.files.length+" allegati"} style={{marginLeft:5}}>📎{p.files.length}</span>}</td><td>{c.cliente}</td><td>{c.provincia}</td>
          <td className="hint">{prods.length?prods.map((x,i)=>(<span key={i} className={"tag "+(c.ambito==="Termico"?"warm":"")} style={{marginRight:4}}>{x}</span>)):"—"}</td>
          <td>{p.consulente}</td><td>{c.effInst||<span className="miss">—</span>}</td>
          <td><span className={"pill "+FCLASS(c.fase)}>{c.fase||"—"}</span></td>
          <td className="num eur">{c.fase?eur(c.compensoInst):""}</td>
          <td className="num eur">{p.nContratto?eur(totByContr[p.nContratto]):""}</td>
          <td>{c.daPian&&<span className="flag">SÌ</span>}</td>
          <td onClick={e=>{e.stopPropagation();del(p.id);}}><button className="btn link">✕</button></td>
        </tr>);
      })}</tbody></table>}
    </div>
    <div className="legend">{FASI.map(f=>(<span key={f}><span className={"sw "+FCLASS(f)}/>{f}</span>))}</div>
  </>);
}

const SUN='<svg width="34" height="34" viewBox="0 0 34 34"><g stroke="#E4532B" stroke-width="1.4" stroke-linecap="round">'+Array.from({length:12},(_,i)=>{const a=i*Math.PI/6,c=17;return '<line x1="'+(c+Math.cos(a)*11)+'" y1="'+(c+Math.sin(a)*11)+'" x2="'+(c+Math.cos(a)*15)+'" y2="'+(c+Math.sin(a)*15)+'"/>';}).join('')+'</g><circle cx="17" cy="17" r="8" fill="#E4532B"/></svg>';
function printHTML(title,body){

  const w=window.open("","_blank");if(!w){alert("Consenti i popup per stampare.");return;}

function schedaIntervento(p,db,c){
  const cli=db.clienti.find(x=>x.id===p.clienteId)||{};
  const prods=[p.clima1,p.clima2,p.clima3,p.clima4,p.termico].filter(Boolean);
  const extras=[[p.ex1,p.q1],[p.ex2,p.q2],[p.ex3,p.q3]].filter(x=>x[0]).map(x=>x[0]+(x[1]?(" × "+x[1]):""));
  const tel=db.installatori.find(x=>x.nome===c.effInst);
  const row=(k,v)=>'<tr><th>'+k+'</th><td>'+(v||'<span class="muted">—</span>')+'</td></tr>';
  const body='<div class="sec">Pratica</div><table>'+
    row("N. contratto","<b>"+(p.nContratto||"")+"</b>")+row("Fase",c.fase)+row("Data appuntamento",fmtD(p.dataApp))+row("Consulente",p.consulente)+'</table>'+
    '<div class="sec">Cliente</div><table>'+row("Cliente","<b>"+(cli.nome||"")+"</b>")+row("Referente",cli.referente)+row("Telefono",cli.tel)+row("Indirizzo",(cli.indirizzo||"")+(cli.cap?(" — "+cli.cap):"")+(cli.provincia?(" ("+cli.provincia+")"):""))+'</table>'+
    '<div class="sec">Impianto</div><table>'+row("Prodotti",prods.join("<br>"))+row("Ambito",c.ambito)+row("Extra",extras.join("<br>"))+'</table>'+
    '<div class="sec">Installazione</div><table>'+row("Installatore","<b>"+(c.effInst||"da assegnare")+"</b>"+(tel&&tel.tel?(" — "+tel.tel):""))+row("Consegna",p.modalitaConsegna)+row("Data consegna",fmtD(p.dataConsegna))+row("Data posa prevista","<b>"+fmtD(p.dataPrevista)+"</b>")+row("Data installazione",fmtD(p.dataInstallazione))+'</table>'+
    '<div class="sec">Compenso installatore</div><table>'+row("Compenso posa",eur(c.compensoStd))+row("Extra",eur(c.extraTot))+row("Totale",("<b>"+ (c.fase==="RECESSO"?"€ 0 (recesso)":eur(c.compensoInst)) +"</b>"))+'</table>'+
    (p.note?('<div class="sec">Note</div><div>'+p.note.replace(/</g,"&lt;")+'</div>'):'')+
    '<div class="sign"><div>Firma installatore</div><div>Firma cliente</div></div>';

}
function schedaCliente(cli,db,comp){
  const mine=comp.filter(({p})=>p.clienteId===cli.id);
  const row=(k,v)=>'<tr><th>'+k+'</th><td>'+(v||'<span class="muted">—</span>')+'</td></tr>';
  let body='<div class="sec">Anagrafica</div><table>'+row("Cliente","<b>"+(cli.nome||"")+"</b>")+row("Referente",cli.referente)+row("Telefono",cli.tel)+row("Email",cli.email)+row("Indirizzo",(cli.indirizzo||"")+(cli.cap?(" — "+cli.cap):""))+row("Provincia",cli.provincia)+'</table>';
  body+='<div class="sec">Pratiche ('+mine.length+')</div>';
  if(mine.length){body+='<table><tr><th style="width:auto">Contratto</th><th style="width:auto">Prodotti</th><th style="width:auto">Fase</th><th style="width:auto">Installatore</th><th style="width:auto">Prevista</th></tr>'+

function Attachments({files,onAdd,onRemove}){
  const [urls,setUrls]=useState({});
  useEffect(()=>{let alive=true;(async()=>{const made={};for(const f of files){if(!urls[f.id]){try{const b=await fileGet(f.id);if(b)made[f.id]=URL.createObjectURL(b);}catch(e){}}}if(alive&&Object.keys(made).length)setUrls(u=>({...u,...made}));})();return()=>{alive=false;};},[files]);
  const pick=e=>{const fs=[...e.target.files];if(fs.length)onAdd(fs);e.target.value="";};
  return(<div>
    {files&&files.length>0&&<div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:9}}>
      {files.map(f=>{const u=urls[f.id];const img=(f.type||"").startsWith("image");const vid=(f.type||"").startsWith("video");
        return(<div key={f.id} className="att">
          {img&&u?<img src={u} onClick={()=>window.open(u,"_blank")}/>:<div className="attv" onClick={()=>u&&window.open(u,"_blank")}>{vid?"🎬":"📄"}</div>}
          <div className="attname" title={f.name}>{f.name}</div>
          <button type="button" className="attx" title="Rimuovi" onClick={()=>onRemove(f)}>✕</button>
        </div>);})}
    </div>}
    <label className="btn gh sm" style={{cursor:"pointer",display:"inline-flex"}}>+ Carica foto/video
      <input type="file" accept="image/*,video/*" multiple capture="environment" style={{display:"none"}} onChange={pick}/></label>
    <div className="hint" style={{marginTop:5}}>Salvati in questo dispositivo. Per la copia di sicurezza usa «Backup completo (ZIP)».</div>
  </div>);
}
function DateField({value,onChange}){

      <button type="button" className="btn gh sm" style={{opacity:value?1:.4}} onClick={()=>{onChange("");if(ref.current)ref.current.value="";}}>Svuota</button>
    </div>);
}

function Crud({title,items,cols,form,onSave,onDel,extra}){
  const [edit,setEdit]=useState(null);
  const [q,setQ]=useState("");
  const norm=it=>Object.entries(it).filter(([k])=>k!=="id"&&k!=="__new").map(([,v])=>Array.isArray(v)?v.join(" "):(typeof v==="string"?v:"")).join(" ").toLowerCase();
  const shown=q.trim()?items.filter(it=>norm(it).includes(q.trim().toLowerCase())):items;
  return(<>
    <div className="filters" style={{marginBottom:12}}>
      <input placeholder={"Cerca "+title.toLowerCase()+"…"} value={q} onChange={e=>setQ(e.target.value)} style={{minWidth:260}}/>
      <span className="hint">{shown.length}{q.trim()?(" di "+items.length):""}</span>
      <div style={{flex:1}}/>
      <button className="btn" onClick={()=>setEdit({id:uid(),__new:true})}>+ Aggiungi</button>
    </div>
    <div className="tbl-wrap"><table><thead><tr>{cols.map(c=>(<th key={c.k} className={c.num?"num":""}>{c.l}</th>))}<th></th></tr></thead>
      <tbody>{shown.length===0?<tr><td colSpan={cols.length+1}><div className="empty hint">{q.trim()?"Nessun risultato per «"+q+"».":"Nessun record."}</div></td></tr>:
      shown.map(it=>(<tr key={it.id} onClick={()=>setEdit(structuredClone(it))} style={{cursor:"pointer"}}>
        {cols.map(c=>(<td key={c.k} className={c.num?"num "+(c.eur?"eur":""):""}>{c.render?c.render(it):(it[c.k]||"")}</td>))}
        <td onClick={e=>{e.stopPropagation();onDel(it.id);}}><button className="btn link">✕</button></td></tr>))}
      </tbody></table></div>
    {extra}
    {edit&&<div className="ovl" onClick={e=>{if(e.target.classList.contains("ovl"))setEdit(null);}}>
      <div className="modal" style={{maxWidth:560}}><div className="hd"><h2>{edit.__new?"Nuovo":"Modifica"} · {title}</h2><button className="x" onClick={()=>setEdit(null)}>×</button></div>
      <div className="bd">{form(edit,(k,v)=>setEdit(s=>({...s,[k]:v})))}</div>
      <div className="ft"><span/><div style={{display:"flex",gap:10}}><button className="btn gh" onClick={()=>setEdit(null)}>Annulla</button><button className="btn" onClick={()=>{onSave(edit);setEdit(null);}}>Salva</button></div></div>
      </div></div>}
  </>);
}
const Fi=(edit,set,label,k,type="text",opts=null)=>(<div className="fld" key={k}><label>{label}</label>
  {opts?<select value={edit[k]||""} onChange={e=>set(k,e.target.value)}><option value=""></option>{opts.map(o=>(<option key={o}>{o}</option>))}</select>
  :<input type={type} value={edit[k]||""} onChange={e=>set(k,e.target.value)}/>}</div>);

    form={(e,s)=>(<div className="form">{Fi(e,s,"Installatore / Ragione sociale","nome")}{Fi(e,s,"Referente","referente")}{Fi(e,s,"Telefono","tel")}{Fi(e,s,"Email","email")}{Fi(e,s,"P.IVA / C.F.","piva")}{Fi(e,s,"PEC","pec")}<div className="fld full"><label>Sede (indirizzo, CAP, città)</label><input value={e.sede||""} onChange={ev=>s("sede",ev.target.value)}/></div><div className="fld full"><label>Regioni di competenza</label><RegionSelect value={e.regioni} onChange={v=>s("regioni",v)}/></div><div className="fld full"><label>Note (abilitazioni DM 37/2008, F-GAS, REA, scadenze…)</label><textarea rows="3" value={e.note||""} onChange={ev=>s("note",ev.target.value)}/></div></div>)}
    onSave={x=>{up(d=>{const i=d.installatori.findIndex(c=>c.id===x.id);delete x.__new;if(i>=0)d.installatori[i]=x;else d.installatori.push(x);return d;});flash("Installatore salvato");}}
    onDel={id=>{const nome=(db.installatori.find(i=>i.id===id)||{}).nome;const np=db.pose.filter(p=>p.installatore===nome).length;const nz=Object.values(db.zoneMap).filter(v=>Array.isArray(v)?v.includes(nome):v===nome).length;const msg=(np||nz)?("Questo installatore è usato in "+np+" pratiche e "+nz+" province. Eliminarlo lascerà quei riferimenti orfani. Eliminare comunque?"):"Eliminare l'installatore?";if(!confirm(msg))return;up(d=>{d.installatori=d.installatori.filter(c=>c.id!==id);Object.keys(d.zoneMap).forEach(k=>{const v=d.zoneMap[k];if(Array.isArray(v)){const nv=v.filter(x=>x!==nome);if(nv.length)d.zoneMap[k]=nv;else delete d.zoneMap[k];}else if(v===nome)delete d.zoneMap[k];});return d;});flash("Installatore eliminato");}}/>;
}
function Consulenti({db,comp,up,flash}){
  const stat=useMemo(()=>{const m={};db.consulenti.forEach(x=>m[x.nome]={n:0,v:0,nr:0,vr:0});comp.forEach(({p,c})=>{const k=p.consulente;if(k&&m[k]){m[k].n++;m[k].v+=(+p.importoVendita||0);if(c.fase==="RECESSO"){m[k].nr++;m[k].vr+=(+p.importoVendita||0);}}});return m;},[db,comp]);
  return <Crud title="Consulente"
    items={db.consulenti}
    cols={[{k:"nome",l:"Consulente"},{k:"ruolo",l:"Ruolo",render:i=>(<span className="tag">{i.ruolo}</span>)},{l:"Regioni",k:"_reg",render:i=>(i.regioni||[]).join(", ")},{l:"N. pose",num:true,k:"_n",render:i=>stat[i.nome]?.n||0},{l:"Venduto",num:true,eur:true,k:"_v",render:i=>eur(stat[i.nome]?.v||0)},{l:"Recessi",num:true,k:"_r",render:i=>stat[i.nome]?.nr||0},{l:"Venduto netto",num:true,eur:true,k:"_vn",render:i=>eur((stat[i.nome]?.v||0)-(stat[i.nome]?.vr||0))}]}
    form={(e,s)=>(<div className="form">{Fi(e,s,"Consulente","nome")}{Fi(e,s,"Ruolo","ruolo","text",RUOLI)}<div className="fld"><label>Capo area riferimento</label><select value={e.capoArea||""} onChange={ev=>s("capoArea",ev.target.value)}><option value=""></option>{db.consulenti.filter(x=>x.ruolo==="Capo Area").map(x=>(<option key={x.id}>{x.nome}</option>))}</select></div>{Fi(e,s,"Telefono","tel")}{Fi(e,s,"Email","email")}<div className="fld full"><label>Regioni di competenza</label><RegionSelect value={e.regioni} onChange={v=>s("regioni",v)}/></div></div>)}
    onSave={x=>{up(d=>{const i=d.consulenti.findIndex(c=>c.id===x.id);delete x.__new;if(i>=0)d.consulenti[i]=x;else d.consulenti.push(x);return d;});flash("Consulente salvato");}}
    onDel={id=>{const nome=(db.consulenti.find(i=>i.id===id)||{}).nome;const n=db.pose.filter(p=>p.consulente===nome).length;if(!confirm(n?("Questo consulente è usato in "+n+" pratiche. Eliminarlo lascerà quei riferimenti orfani. Eliminare comunque?"):"Eliminare il consulente?"))return;up(d=>{d.consulenti=d.consulenti.filter(c=>c.id!==id);return d;});flash("Consulente eliminato");}}/>;
}

/* ---------- Zone ---------- */
function Zone({db,up,flash}){
  const [q,setQ]=useState("");
  const listOf=prov=>{const v=db.zoneMap[prov];return Array.isArray(v)?v.filter(Boolean):(v?[v]:[]);};
  const add=(prov,nome)=>up(d=>{const cur=Array.isArray(d.zoneMap[prov])?d.zoneMap[prov]:(d.zoneMap[prov]?[d.zoneMap[prov]]:[]);if(nome&&!cur.includes(nome))cur.push(nome);d.zoneMap[prov]=cur;return d;});
  const rem=(prov,nome)=>up(d=>{const cur=(Array.isArray(d.zoneMap[prov])?d.zoneMap[prov]:(d.zoneMap[prov]?[d.zoneMap[prov]]:[])).filter(x=>x!==nome);if(cur.length)d.zoneMap[prov]=cur;else delete d.zoneMap[prov];return d;});
  const move=(prov,ix,dir)=>up(d=>{const v=d.zoneMap[prov];const cur=Array.isArray(v)?[...v]:(v?[v]:[]);const j=ix+dir;if(j<0||j>=cur.length)return d;const t=cur[ix];cur[ix]=cur[j];cur[j]=t;d.zoneMap[prov]=cur;return d;});
  const assigned=ALL_PROV.filter(p=>listOf(p).length>0).length;
  return(<>
    <div className="filters"><input placeholder="Cerca provincia…" value={q} onChange={e=>setQ(e.target.value)}/>
      <div style={{flex:1}}/><span className="tag">{assigned}/{ALL_PROV.length} coperte</span></div>
    <div className="hint" style={{marginBottom:10}}>Puoi assegnare <b>più installatori</b> alla stessa provincia. Il primo della lista (★) è quello proposto in automatico sulle nuove pratiche: usa le frecce ↑↓ per cambiare l’ordine.</div>
    <div className="grid" style={{gap:14}}>
    {PROV.map(([reg,ps])=>{
      const rows=ps.filter(([n])=>!q||n.toLowerCase().includes(q.toLowerCase()));
      if(!rows.length)return null;
      return(<div className="card" key={reg}><h3>{reg}</h3><div className="tbl-wrap" style={{border:0,boxShadow:"none"}}>
        <table><thead><tr><th style={{width:170}}>Provincia</th><th style={{width:60}}>Sigla</th><th>Installatori</th></tr></thead>
        <tbody>{rows.map(([n,s])=>{
          const cur=listOf(n);const avail=db.installatori.filter(i=>!cur.includes(i.nome));
          return(<tr key={n}><td>{n}</td><td className="hint">{s}</td>
          <td style={{whiteSpace:"normal"}}>
            {cur.length>0&&<div style={{display:"flex",gap:5,flexWrap:"wrap",marginBottom:5}}>
              {cur.map((nm,ix)=>(<span key={nm} className="tag" style={{display:"inline-flex",gap:6,alignItems:"center"}}>{ix===0&&<b title="proposto in automatico">★</b>}{nm}{cur.length>1&&<span onClick={()=>{if(ix>0)move(n,ix,-1);}} title="sposta su" style={{cursor:ix>0?"pointer":"default",opacity:ix>0?1:.25,fontWeight:700}}>↑</span>}{cur.length>1&&<span onClick={()=>{if(ix<cur.length-1)move(n,ix,1);}} title="sposta giù" style={{cursor:ix<cur.length-1?"pointer":"default",opacity:ix<cur.length-1?1:.25,fontWeight:700}}>↓</span>}<span onClick={()=>rem(n,nm)} title="rimuovi" style={{cursor:"pointer",fontWeight:700}}>✕</span></span>))}
            </div>}
            <select value="" onChange={e=>{if(e.target.value)add(n,e.target.value);}} style={{padding:"6px 8px",border:"1px solid var(--line)",borderRadius:7,background:cur.length?"#fff":"#FDF6E9"}}>
              <option value="">{cur.length?"+ aggiungi installatore…":"— da coprire —"}</option>
              {avail.map(i=>(<option key={i.id}>{i.nome}</option>))}
            </select>
          </td></tr>);})}</tbody></table>
      </div></div>);
    })}
    </div>
  </>);
}

/* ---------- Tariffe ---------- */
function Tariffe({db,up,flash}){
  const upd=(kind,i,field,val)=>up(d=>{d.tariffe[kind][i][field]=field==="voce"||field==="config"||field==="prodotto"||field==="tipo"?val:(val===""?null:+val);return d;});
  const num=v=>v==null?"":v;
  return(<div className="grid" style={{gap:16}}>
    <div className="two">
      <div className="card"><h3>Compensi posa — Clima</h3><div className="tbl-wrap" style={{border:0,boxShadow:"none"}}><table><thead><tr><th>Configurazione</th><th className="num">Compenso €</th></tr></thead>
        <tbody>{db.tariffe.clima.map((x,i)=>(<tr key={i}><td>{x.config}</td><td className="num"><input className="mono" style={{width:90,textAlign:"right",border:"1px solid var(--line)",borderRadius:6,padding:"4px 6px"}} type="number" value={num(x.compenso)} onChange={e=>upd("clima",i,"compenso",e.target.value)}/></td></tr>))}</tbody></table></div></div>
      <div className="card"><h3>Compensi posa — Termico <span className="hint">per categoria</span></h3><div className="tbl-wrap" style={{border:0,boxShadow:"none"}}><table><thead><tr><th>Prodotto</th><th>Tipo</th><th className="num">Compenso €</th></tr></thead>
        <tbody>{db.tariffe.termico.map((x,i)=>(<tr key={i}><td>{x.prodotto}</td><td className="hint">{x.tipo}</td><td className="num"><input className="mono" style={{width:90,textAlign:"right",border:"1px solid var(--line)",borderRadius:6,padding:"4px 6px"}} type="number" value={num(x.compenso)} onChange={e=>upd("termico",i,"compenso",e.target.value)}/></td></tr>))}</tbody></table></div></div>
    </div>
    <div className="card"><h3>Lavorazioni extra <span className="hint">prezzo per mondo — vuoto = non applicabile</span></h3><div className="tbl-wrap" style={{border:0,boxShadow:"none"}}><table><thead><tr><th>Lavorazione</th><th className="num">€ Clima</th><th className="num">€ Termico</th></tr></thead>
      <tbody>{db.tariffe.extra.map((x,i)=>(<tr key={i}><td>{x.voce}</td>
        <td className="num"><input className="mono" style={{width:80,textAlign:"right",border:"1px solid var(--line)",borderRadius:6,padding:"4px 6px"}} type="number" value={num(x.clima)} onChange={e=>upd("extra",i,"clima",e.target.value)}/></td>
        <td className="num"><input className="mono" style={{width:80,textAlign:"right",border:"1px solid var(--line)",borderRadius:6,padding:"4px 6px"}} type="number" value={num(x.termico)} onChange={e=>upd("extra",i,"termico",e.target.value)}/></td></tr>))}</tbody></table></div>
      <div className="bd hint">Nota: un extra vale solo dove ha un prezzo. Su una posa clima le voci solo-termiche restano a 0, e viceversa.</div>
    </div>
  </div>);
}

/* ---------- Backup ---------- */
function Backup({db,setDb,comp,flash,cloud,setCloud,pushNow,pullNow}){
  const fileRef=useRef();
  const expJSON=()=>{const blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="arquati_backup_"+today()+".json";a.click();flash("Backup JSON scaricato");};
  const impJSON=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=migrate(JSON.parse(r.result));setDb(d);flash("Dati importati");}catch(err){alert("File non valido");}};r.readAsText(f);};
  const expXLSX=()=>{
    const wb=XLSX.utils.book_new();
    const pose=comp.map(({p,c})=>({"N. contratto":p.nContratto,Cliente:c.cliente,Provincia:c.provincia,Consulente:p.consulente,"Data appuntamento":p.dataApp,"Clima 1":p.clima1,"Clima 2":p.clima2,"Clima 3":p.clima3,"Clima 4":p.clima4,"Prodotto Termico":p.termico,Ambito:c.ambito,"Importo vendita":+p.importoVendita||0,Installatore:c.effInst,"Data vendita":p.dataVendita,"Scad. recesso":c.scadRecesso,Recesso:p.recesso,Preparazione:p.preparazione,"Modalità consegna":p.modalitaConsegna,"Data consegna":p.dataConsegna,"Data prevista":p.dataPrevista,"Data installazione":p.dataInstallazione,FASE:c.fase,"Compenso posa":c.compensoStd,"Extra":c.extraTot,"Compenso installatore":c.compensoInst,"Cliente saldato":p.saldato,"Da programmare":c.daPian?"SÌ":"","Link foto/video":p.link,Note:p.note}));
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(pose),"Lavori Pose");
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(db.clienti.map(({id,...r})=>r)),"Clienti");
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(db.installatori.map(({id,...r})=>r)),"Installatori");
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(db.consulenti.map(({id,...r})=>r)),"Consulenti");
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(Object.entries(db.zoneMap).map(([Provincia,v])=>({Provincia,Installatori:Array.isArray(v)?v.join(", "):(v||"")}))),"Zone");
    XLSX.writeFile(wb,"Gestione_Pose_"+today()+".xlsx");
    flash("Excel esportato");
  };
  const reset=()=>{if(confirm("Cancellare TUTTI i dati e ripartire dagli esempi?")){localStorage.removeItem(KEY);setDb(JSON.parse(JSON.stringify(seed)));flash("Dati azzerati");}};
  const zipRef=useRef();
  const expZIP=async()=>{
    try{
      flash("Preparo il backup…");
      const zip=new JSZip();
      zip.file("data.json",JSON.stringify(db,null,2));
      const folder=zip.folder("files");
      for(const p of db.pose){for(const f of (p.files||[])){try{const b=await fileGet(f.id);if(b)folder.file(f.id+"__"+f.name,b);}catch(e){}}}
      const blob=await zip.generateAsync({type:"blob"});
      const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="arquati_backup_completo_"+today()+".zip";a.click();
      flash("Backup completo (ZIP) scaricato");
    }catch(e){alert("Errore nel backup ZIP: "+e.message);}
  };
  const impZIP=async e=>{
    const file=e.target.files[0];if(!file)return;
    try{
      const zip=await JSZip.loadAsync(file);
      const dj=zip.file("data.json");if(!dj){alert("ZIP non valido (manca data.json)");return;}
      const data=JSON.parse(await dj.async("string"));
      const entries=[];zip.folder("files").forEach((path,f)=>{if(!f.dir)entries.push(f);});
      for(const f of entries){const nm=f.name.replace(/^files\//,"");const id=nm.split("__")[0];const blob=await f.async("blob");try{await filePut(id,blob);}catch(er){}}
      setDb(migrate(data));flash("Backup completo importato");
    }catch(er){alert("ZIP non leggibile: "+er.message);}
    e.target.value="";
  };
  return(<div className="grid" style={{gap:16}}>
    <div className="card"><h3>Sincronizzazione cloud <span className="tag" style={{background:cloudOn(cloud)?"var(--brand-soft)":"#eee",color:cloudOn(cloud)?"var(--brand-dk)":"#999"}}>{cloudOn(cloud)?(cloud.auto?"attiva (auto)":"configurata"):"non attiva"}</span></h3><div className="bd">
      <p className="hint">Collega un database <b>Supabase</b> (gratuito) per lavorare sugli <b>stessi dati</b> da più dispositivi (tu e l'ufficio). Nota: foto/video restano sul dispositivo, non si sincronizzano.</p>
      <div className="form" style={{gridTemplateColumns:"1fr"}}>
        <div className="fld"><label>URL progetto Supabase</label><input value={cloud.url} onChange={e=>setCloud({...cloud,url:e.target.value})} placeholder="https://xxxxxxxx.supabase.co"/></div>
        <div className="fld"><label>Chiave «anon public»</label><input value={cloud.key} onChange={e=>setCloud({...cloud,key:e.target.value})} placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6..."/></div>
      </div>
      <label style={{display:"flex",gap:8,alignItems:"center",marginTop:10}}><input type="checkbox" checked={cloud.auto} onChange={e=>setCloud({...cloud,auto:e.target.checked})}/> <span>Sincronizza automaticamente (ogni ~15 secondi)</span></label>
      <div style={{display:"flex",gap:10,flexWrap:"wrap",marginTop:12}}>
        <button className="btn" onClick={async()=>{try{await pushNow();flash("Dati inviati al cloud");}catch(e){alert("Errore invio: "+e.message);}}}>⤴ Salva sul cloud</button>
        <button className="btn gh" onClick={async()=>{if(!confirm("Sovrascrivere i dati di questo dispositivo con quelli del cloud?"))return;try{const r=await pullNow();flash(r?"Dati caricati dal cloud":"Nessun dato ancora sul cloud");}catch(e){alert("Errore lettura: "+e.message);}}}>⤵ Carica dal cloud</button>
      </div>
      <p className="hint" style={{marginTop:10}}>Modello: l'ultima modifica salvata vince. Per un piccolo ufficio va bene; evitate di modificare la stessa pratica nello stesso momento.</p>
      <details style={{marginTop:8}}><summary style={{cursor:"pointer",fontWeight:600,color:"var(--brand-dk)"}}>Come si configura (una volta sola, ~5 min)</summary>
        <ol className="hint" style={{lineHeight:1.7,marginTop:8}}>
          <li>Vai su <b>supabase.com</b>, registrati (gratis) e crea un nuovo progetto.</li>
          <li>Menu <b>SQL Editor</b> → incolla ed esegui:<br/><code style={{display:"block",background:"#F3F6F1",padding:"8px",borderRadius:6,margin:"4px 0",whiteSpace:"pre-wrap"}}>create table app_state (id int primary key, data jsonb, updated_at timestamptz default now());{"\n"}insert into app_state (id, data) values (1, '{}');{"\n"}alter table app_state disable row level security;</code></li>
          <li>Menu <b>Project Settings → API</b>: copia <b>Project URL</b> e la chiave <b>anon public</b> e incollale qui sopra.</li>
          <li>Premi <b>Salva sul cloud</b> dal dispositivo che ha già i dati. Sugli altri dispositivi, inserisci gli stessi URL/chiave e premi <b>Carica dal cloud</b> (poi attiva l'auto).</li>
        </ol>
        <p className="hint">Tieni riservati URL e chiave: chi li ha può leggere/scrivere i dati.</p>
      </details>
    </div></div>
    <div className="two">
    <div className="card"><h3>Salvataggio & ripristino</h3><div className="bd">
      <p className="hint"><b>Backup completo (ZIP)</b>: contiene dati <u>e</u> foto/video. È quello da usare per la copia di sicurezza e per spostarti su un altro PC/telefono.</p>
      <div style={{display:"flex",gap:10,flexWrap:"wrap",marginTop:6}}>
        <button className="btn" onClick={expZIP}>⤓ Backup completo (ZIP, con file)</button>
        <button className="btn gh" onClick={()=>zipRef.current.click()}>⤒ Ripristina da ZIP</button>
        <input ref={zipRef} type="file" accept=".zip,application/zip" style={{display:"none"}} onChange={impZIP}/>
      </div>
      <p className="hint" style={{marginTop:16}}>Backup rapido <b>solo dati</b> (JSON, leggero, senza foto/video):</p>
      <div style={{display:"flex",gap:10,flexWrap:"wrap",marginTop:6}}>
        <button className="btn gh" onClick={expJSON}>⤓ Solo dati (JSON)</button>
        <button className="btn gh" onClick={()=>fileRef.current.click()}>⤒ Ripristina dati (JSON)</button>
        <input ref={fileRef} type="file" accept="application/json" style={{display:"none"}} onChange={impJSON}/>
      </div>
      <div style={{marginTop:18}}><button className="btn acc" onClick={reset}>Azzera tutto</button></div>
    </div></div>
    <div className="card"><h3>Esporta in Excel</h3><div className="bd">
      <p className="hint">Genera un file .xlsx con tutti i fogli (Pose calcolate, Clienti, Installatori, Consulenti, Zone) da archiviare o condividere col commercialista.</p>
      <button className="btn" style={{marginTop:10}} onClick={expXLSX}>▤ Esporta Excel (.xlsx)</button>
    </div></div>
    </div>
  </div>);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
<script>
/* PWA: icona generata + manifest + service worker (best effort) */
(function(){
  try{
    function icon(sz){var c=document.createElement("canvas");c.width=c.height=sz;var x=c.getContext("2d");
      x.fillStyle="#EEF2EC";x.fillRect(0,0,sz,sz);var r=sz*0.24,cx=sz/2,cy=sz/2;
      x.strokeStyle="#E4532B";x.lineWidth=sz*0.03;x.lineCap="round";
      for(var i=0;i<12;i++){var a=i*Math.PI/6;x.beginPath();x.moveTo(cx+Math.cos(a)*r*1.4,cy+Math.sin(a)*r*1.4);x.lineTo(cx+Math.cos(a)*r*1.78,cy+Math.sin(a)*r*1.78);x.stroke();}
      var g=x.createRadialGradient(cx,cy-r*0.25,r*0.15,cx,cy,r);g.addColorStop(0,"#F6B24A");g.addColorStop(1,"#E4532B");
      x.fillStyle=g;x.beginPath();x.arc(cx,cy,r,0,7);x.fill();return c.toDataURL("image/png");}
    var i192=icon(192),i512=icon(512);
    var ai=document.getElementById("appleIcon");if(ai)ai.href=i192;
    var manifest={name:"Gestione Pose · Arquati Eco Living",short_name:"Pose Arquati",start_url:".",scope:".",display:"standalone",orientation:"any",background_color:"#EEF2EC",theme_color:"#356B41",icons:[{src:i192,sizes:"192x192",type:"image/png",purpose:"any maskable"},{src:i512,sizes:"512x512",type:"image/png",purpose:"any maskable"}]};
    var ml=document.getElementById("manifestLink");if(ml)ml.href=URL.createObjectURL(new Blob([JSON.stringify(manifest)],{type:"application/manifest+json"}));
    if("serviceWorker" in navigator && location.protocol.indexOf("http")===0){
      var sw="self.addEventListener('install',function(e){self.skipWaiting();});self.addEventListener('activate',function(e){self.clients.claim();});self.addEventListener('fetch',function(e){e.respondWith(fetch(e.request).catch(function(){return caches.match(e.request);}));});";
      navigator.serviceWorker.register(URL.createObjectURL(new Blob([sw],{type:"text/javascript"}))).catch(function(){});
    }
  }catch(err){console.warn("PWA:",err);}
})();
</script>
