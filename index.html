<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestione Pose · Arquati Eco Living</title>
<meta name="theme-color" content="#356B41">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pose Arquati">
<link id="appleIcon" rel="apple-touch-icon" href="">
<link id="manifestLink" rel="manifest" href="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{
  --bg:#EEF2EC; --panel:#FFFFFF; --ink:#18231C; --muted:#6C7A70; --line:#DCE4DA;
  --brand:#4F8A52; --brand-dk:#356B41; --brand-soft:#E4EFE1;
  --accent:#E4532B; --accent-soft:#FBE5DD;
  --gold:#C79A2E;
  --f-org:#E2E2E2; --f-ass:#F4DE9A; --f-pro:#D9CFEA; --f-con:#B9D6EE; --f-inst:#BFE0B4; --f-rec:#F1B0B0;
  --shadow:0 1px 2px rgba(24,35,28,.06),0 8px 24px rgba(24,35,28,.05);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:14px;line-height:1.45}
.mono{font-variant-numeric:tabular-nums}
h1,h2,h3,.disp{font-family:'Space Grotesk',Inter,sans-serif;letter-spacing:-.01em}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px}
a{color:var(--brand-dk)}
.app{display:flex;min-height:100vh}
/* sidebar */
.side{width:230px;flex:0 0 230px;background:var(--brand-dk);color:#EAF3E8;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:20px 20px 14px;display:flex;align-items:center;gap:11px;border-bottom:1px solid rgba(255,255,255,.12)}
.sun{width:30px;height:30px;flex:0 0 30px;border-radius:50%;background:radial-gradient(circle at 50% 45%,#F6B24A,var(--accent));position:relative;box-shadow:0 0 0 3px rgba(228,83,43,.18)}
.brand b{font-family:'Space Grotesk';font-size:16px;letter-spacing:.02em;display:block;line-height:1.1}
.brand span{font-size:10px;letter-spacing:.28em;color:#B9D3B4;text-transform:uppercase}
.nav{padding:10px 10px;flex:1;overflow:auto}
.nav button{width:100%;text-align:left;background:none;border:0;color:#CFE3CB;padding:10px 12px;border-radius:9px;display:flex;align-items:center;gap:10px;font-weight:500;font-size:13.5px;margin-bottom:2px}
.nav button:hover{background:rgba(255,255,255,.08);color:#fff}
.nav button.on{background:#EEF2EC;color:var(--brand-dk);font-weight:600}
.nav .ic{width:18px;text-align:center;font-size:15px}
.side .foot{padding:12px 16px;border-top:1px solid rgba(255,255,255,.12);font-size:11px;color:#9FBE9A}
/* main */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{background:var(--panel);border-bottom:1px solid var(--line);padding:16px 26px;display:flex;align-items:center;justify-content:space-between;gap:16px;position:sticky;top:0;z-index:5}
.top h1{margin:0;font-size:20px}
.top .sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.wrap{padding:22px 26px;max-width:1500px;width:100%}
.btn{background:var(--brand);color:#fff;border:0;padding:9px 16px;border-radius:9px;font-weight:600;font-size:13.5px;display:inline-flex;align-items:center;gap:7px}
.btn:hover{background:var(--brand-dk)}
.btn.acc{background:var(--accent)} .btn.acc:hover{background:#c8431f}
.btn.gh{background:#fff;color:var(--ink);border:1px solid var(--line)} .btn.gh:hover{border-color:var(--brand);color:var(--brand-dk)}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:8px}
a.btn{display:inline-flex;align-items:center;text-decoration:none}
.btn.link{background:none;color:var(--muted);padding:5px 8px} .btn.link:hover{color:var(--accent)}
/* cards */
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px 16px;box-shadow:var(--shadow)}
.kpi .lab{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.kpi .val{font-family:'Space Grotesk';font-size:27px;font-weight:700;margin-top:5px}
.kpi.euro .val{color:var(--brand-dk)} .kpi.warn .val{color:var(--accent)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.card h3{margin:0;padding:14px 18px;border-bottom:1px solid var(--line);font-size:14.5px;display:flex;justify-content:space-between;align-items:center}
.card .bd{padding:14px 18px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
/* una tabella larga scorre dentro il suo riquadro invece di allargare tutta la pagina */
.grid>*,.two>*,.split>*{min-width:0}
@media(max-width:900px){.two{grid-template-columns:1fr}}
/* table */
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px;background:var(--panel);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:9px 11px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:#F6F9F5;color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;position:sticky;top:0;z-index:1}
tr:last-child td{border-bottom:0}
tr:hover td{background:#F9FBF8}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.eur{font-variant-numeric:tabular-nums;font-weight:600}
/* phase pill */
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}
.ph-Daassegnare{background:var(--f-org)} .ph-Assegnato{background:var(--f-ass)} .ph-Prontoconsegna{background:var(--f-pro)}
.ph-Consegnato{background:var(--f-con)} .ph-Installato{background:var(--f-inst)} .ph-RECESSO{background:var(--f-rec)}
.ph-InattesaOK{background:#B9722F}
/* semafori di avanzamento in agenda */
.sems{display:inline-flex;gap:3px;align-items:center}
.sem{width:22px;height:22px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;
  font-size:10.5px;font-weight:800;letter-spacing:.02em;border:1px solid transparent;cursor:default}
.sem-ok{background:#DCEBD6;color:#2F6134;border-color:#B8D6AC}
.sem-attesa{background:#FBEFD4;color:#8A6D1F;border-color:#E8D9A8}
.sem-ko{background:#F6D9D0;color:#A93A1B;border-color:#E9B3A4}
.sem-na{background:#F1F3F0;color:#B6BDB3;border-color:#E3E8E1}
.semleg{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.semleg b{color:var(--ink);font-weight:600}
.steps{display:flex;gap:0;align-items:stretch;flex-wrap:wrap}
.step{flex:1 1 150px;min-width:140px;padding:2px 10px 2px 0}
.stephd{display:flex;gap:7px;align-items:center}
.stephd b{font-size:12.5px}
.stepnum{display:flex;gap:5px;margin:7px 0 3px;flex-wrap:wrap}
.stepnum span{font-family:'Space Grotesk';font-weight:700;font-size:15px;padding:1px 9px;border-radius:7px;border:1px solid transparent}
.stepnum .sem-ok{background:#DCEBD6;color:#2F6134;border-color:#B8D6AC}
.stepnum .sem-attesa{background:#FBEFD4;color:#8A6D1F;border-color:#E8D9A8}
.stepnum .sem-ko{background:#F6D9D0;color:#A93A1B;border-color:#E9B3A4}
.stepnum .sem-na{background:#F1F3F0;color:#9AA79A;border-color:#E3E8E1}
.steparrow{align-self:center;color:#C9D3C6;font-size:20px;padding:0 4px;font-weight:700}
@media(max-width:900px){.steparrow{display:none}.step{flex:1 1 44%}}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;background:var(--brand-soft);color:var(--brand-dk);font-size:11.5px;font-weight:600}
.tag.warm{background:var(--accent-soft);color:#b8431f}
/* motivo recesso */
.mot{display:inline-block;padding:2px 8px;border-radius:6px;font-size:10.5px;font-weight:700;white-space:nowrap}
.mot-idea{background:#E4E9F5;color:#3B4E7A}
.mot-ko{background:#FBE0DC;color:#A93A1B}
.mot-alt{background:#EDEAE2;color:#6B6355}
.mot-na{background:#F1F1F1;color:#999}
/* finestra di posa concordata */
.win{display:inline-block;padding:2px 8px;border-radius:6px;font-size:10.5px;font-weight:700;white-space:nowrap}
.win-futura{background:#E4E9F5;color:#3B4E7A}
.win-aperta{background:#FFF3D6;color:#7a5c00}
.win-scaduta{background:#FBE0DC;color:#A93A1B}
.win-na{background:#F1F1F1;color:#999}
/* margine */
.mrg{display:inline-block;padding:2px 9px;border-radius:6px;font-size:11.5px;font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}
.mrg-ok{background:#DFF0DA;color:#2F6134}
.mrg-warn{background:#FFF3D6;color:#7a5c00}
.mrg-bad{background:#FBE0DC;color:#A93A1B}
.mrg-na{background:#F1F1F1;color:#8a8a8a}
/* posizionamento di prezzo */
.pz{display:inline-block;padding:2px 8px;border-radius:6px;font-size:10.5px;font-weight:700;white-space:nowrap}
.pz-sotto{background:#FBE0DC;color:#A93A1B}
.pz-base{background:#EDEAE2;color:#6B6355}
.pz-pieno{background:#DFF0DA;color:#2F6134}
/* riconciliazione extra installatore */
.ex{display:inline-block;padding:2px 8px;border-radius:6px;font-size:10.5px;font-weight:700;white-space:nowrap}
.ex-attesa{background:#EDEAE2;color:#6B6355}
.ex-ok{background:#DFF0DA;color:#2F6134}
.ex-sotto{background:#FBE0DC;color:#A93A1B}
.ex-sopra{background:#E4E9F5;color:#3B4E7A}
.alert{border:1px solid #E9B3A4;background:#FFF7F5;border-radius:10px;padding:11px 13px;margin-top:10px}
.alert b{color:#A93A1B;display:block;margin-bottom:5px;font-size:12.5px}
.alert ul{margin:0;padding-left:18px}
.alert li{font-size:12px;color:#6a4a42;line-height:1.6}
.costrow{display:grid;grid-template-columns:1fr auto;gap:4px;padding:4px 0;border-bottom:1px dashed #E7ECE5;font-size:12.5px}
.costrow.tot{border-bottom:0;border-top:2px solid var(--line);margin-top:5px;padding-top:8px;font-weight:800}
.costrow span:last-child{font-variant-numeric:tabular-nums;font-weight:600}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
.flag{display:inline-block;padding:2px 8px;border-radius:6px;background:#FFF3D6;color:#7a5c00;font-size:11px;font-weight:700}
/* anzianita' contratto */
.age{display:inline-block;padding:1px 7px;border-radius:6px;font-size:10.5px;font-weight:700;margin-left:5px;white-space:nowrap}
.age.ok{background:#DFF0DA;color:#2F6134}
.age.mid{background:#FFF3D6;color:#7a5c00}
.age.late{background:#FBE0DC;color:#A93A1B}
/* import da foto */
.imp table{width:100%;border-collapse:collapse}
.imp th{font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);text-align:left;padding:6px 7px;border-bottom:1px solid var(--line)}
.imp td{padding:4px 6px;border-bottom:1px solid #EFF3EE;vertical-align:middle}
.imp input{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:7px;background:#fff;font-size:12.5px}
.imp input:focus{outline:2px solid var(--brand-soft);border-color:var(--brand)}
.imp .dup input{border-color:#E9B3A4;background:#FFF7F5}
.thumbrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.thumbrow .th{width:84px;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#fff;position:relative}
.thumbrow .th img{width:84px;height:64px;object-fit:cover;display:block}
.thumbrow .th .pdfbox{width:84px;height:64px;display:flex;align-items:center;justify-content:center;font-size:24px;background:#F3F6F1}
.thumbrow .th .nm{font-size:9.5px;padding:2px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.thumbrow .th .rm{position:absolute;top:2px;right:2px;width:18px;height:18px;border:0;border-radius:50%;background:rgba(24,35,28,.7);color:#fff;font-size:11px;line-height:1;cursor:pointer}
/* filters */
.filters{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:14px;align-items:center}
.filters input,.filters select{padding:8px 11px;border:1px solid var(--line);border-radius:9px;background:#fff;min-width:130px}
.filters input:focus,.filters select:focus{outline:2px solid var(--brand-soft);border-color:var(--brand)}
/* modal */
.ovl{position:fixed;inset:0;background:rgba(24,35,28,.45);display:flex;justify-content:center;align-items:flex-start;padding:30px 16px 0;z-index:40;overflow:auto}
.modal{background:var(--panel);border-radius:16px;width:100%;max-width:960px;min-width:0;margin-bottom:30px;box-shadow:0 30px 80px rgba(0,0,0,.3);animation:pop .18s ease}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.modal .hd{padding:16px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;position:sticky;top:-30px;z-index:2;background:#fff;border-radius:16px 16px 0 0}
.modal .hd h2{margin:0;font-size:18px}
.modal .bd{padding:20px 22px}
.modal .ft{padding:14px 22px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:center;position:sticky;bottom:0;z-index:2;background:#fff;border-radius:0 0 16px 16px}
.modal .ft>div{flex-wrap:wrap}
.x{background:none;border:0;font-size:22px;color:var(--muted);line-height:1;padding:2px 6px}
.x:hover{color:var(--accent)}
/* form */
/* minmax(0,1fr): una tendina con una voce lunga non deve allargare la colonna oltre la finestra */
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px 16px}
.form .full{grid-column:1/-1}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld label{font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.fld input,.fld select,.fld textarea{padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:#fff}
/* Safari dà a tendine e campi data una larghezza minima propria: qui devono stare nella colonna */
.fld input:not([type=checkbox]):not([type=radio]):not([type=file]),.fld select,.fld textarea{width:100%;min-width:0;max-width:100%;text-overflow:ellipsis}
.fld input[type=date]{display:block;-webkit-min-logical-width:0}
.form>*,.slotrow>*,.slotrow3>*{min-width:0}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:2px solid var(--brand-soft);border-color:var(--brand)}
.sec{grid-column:1/-1;font-family:'Space Grotesk';font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brand-dk);border-bottom:2px solid var(--brand-soft);padding-bottom:5px;margin-top:6px}
.slotrow{display:grid;grid-template-columns:minmax(0,1fr) 70px;gap:8px;align-items:end}
.slotrow3{display:grid;grid-template-columns:minmax(0,1fr) 70px 90px;gap:8px;align-items:end}
/* la nota sotto la voce (prezzo cad.) non deve spingere giù le caselle accanto: spazio fisso sotto ogni riga */
.slotrow3{padding-bottom:18px}.slotrow3 input:disabled{background:#F7F9F6;cursor:not-allowed}.slotrow3>.fld:first-child{position:relative}
.slotrow3>.fld:first-child>.hint{position:absolute;left:0;right:0;top:100%;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* live compenso panel */
.calc{grid-column:1/-1;background:var(--brand-soft);border:1px solid #CFE2CA;border-radius:12px;padding:14px 16px;display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:space-between}
.calc .row{display:flex;gap:20px;flex-wrap:wrap}
.calc .it .k{font-size:11px;color:var(--brand-dk);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.calc .it .v{font-family:'Space Grotesk';font-size:20px;font-weight:700}
.calc .big .v{font-size:26px;color:var(--brand-dk)}
/* pipeline signature */
.pipe{display:flex;gap:3px;margin-top:3px}
.pipe .st{height:7px;border-radius:3px;flex:1;background:#E3E9E1}
.empty{padding:40px;text-align:center;color:var(--muted)}
.empty .big{font-size:15px;color:var(--ink);font-weight:600;margin-bottom:4px}
.hint{font-size:12px;color:var(--muted)}
.rowbtns{display:flex;gap:4px}
.miss{color:var(--accent);font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 20px;border-radius:10px;box-shadow:var(--shadow);z-index:60;font-weight:500;animation:pop .2s}
.split{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}
.att{width:96px;position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.att img{width:96px;height:72px;object-fit:cover;display:block;cursor:pointer}
.attv{width:96px;height:72px;display:flex;align-items:center;justify-content:center;font-size:30px;background:#F3F6F1;cursor:pointer}
.attname{font-size:10px;padding:3px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.attx{position:absolute;top:3px;right:3px;width:20px;height:20px;border:0;border-radius:50%;background:rgba(24,35,28,.7);color:#fff;font-size:12px;line-height:1;cursor:pointer}
.attx:hover{background:var(--accent)}
@media(max-width:1000px){
  .split{grid-template-columns:1fr}.form{grid-template-columns:minmax(0,1fr)}.two{grid-template-columns:1fr}
  .app{flex-direction:column}
  .side{width:100%;flex:none;height:auto;position:sticky;top:0;z-index:20}
  .brand{padding:11px 16px}
  .nav{display:flex;overflow-x:auto;padding:8px;gap:6px;-webkit-overflow-scrolling:touch}
  .nav button{width:auto;white-space:nowrap;margin:0;flex:0 0 auto;font-size:13px;padding:8px 12px}
  .side .foot{display:none}
  .top{padding:12px 16px}.top h1{font-size:17px}.wrap{padding:14px}
}
.barrow{display:flex;align-items:center;gap:10px;margin-bottom:7px}
.barrow .nm{width:40px;font-size:12px;color:var(--muted);font-weight:600}
.bar{flex:1;height:16px;background:#EEF2EC;border-radius:6px;overflow:hidden;display:flex}
.bar .fill{background:var(--brand);height:100%}
.bar .fill.b{background:var(--gold)}
.barrow .vv{width:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
/* accesso, utenti e proposte di modifica */
.accesso{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:var(--bg)}
.accbox{width:100%;max-width:380px;padding:26px 24px;display:flex;flex-direction:column;gap:14px}
.accbox h2{margin:0;font-size:20px}
.acclogo{width:100%;max-width:220px;align-self:center;display:block}
.accerr{background:var(--accent-soft);color:#A93A1B;border-radius:9px;padding:9px 12px;font-size:13px;font-weight:500}
.chip{display:flex;align-items:center;gap:8px;background:#F6F9F5;border:1px solid var(--line);border-radius:999px;padding:3px 4px 3px 12px;font-size:13px;white-space:nowrap}
.chip .dot{width:8px;height:8px;border-radius:50%;background:#B6BDB3;flex:0 0 8px}
.chip .dot.ok{background:var(--brand)} .chip .dot.wait{background:var(--gold)} .chip .dot.ko{background:var(--accent)}
.nbadge{margin-left:auto;background:var(--accent);color:#fff;border-radius:999px;font-size:11px;font-weight:700;padding:0 7px;line-height:18px}
.avviso{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:#FBF6E6;border:1px solid #EDDDAA;border-radius:12px;padding:11px 14px;margin-bottom:14px;font-size:13px}
.avviso.bozza{background:var(--brand-soft);border-color:#C7DCC1}

/* descrizione breve dello stato incasso, per i tooltip dei semafori */
const finStatoDesc=p=>{
  if(!p)return "";
  if(+p.finanziatoEur>0)return "finanziamento "+(p.finStato?p.finStato.toLowerCase():"in lavorazione");
  if(p.saldato==="Sì")return "saldo incassato";
  if(p.preparazione===PRONTO)return "saldo da incassare";
  return "";
};
/* i cinque passi di una pratica, come li vede chi programma le pose */
const SEM_DEF=[["amm","A","Amministrazione"],["mat","M","Materiale"],["brand","B","Brandizzazione"],["cons","S","Spedizione / ritiro"],["posa","P","Posa"]];
function Semafori({c,compatto}){
  return (<span className="sems">
    {SEM_DEF.map(([k,lett,lab])=>{
      const st=(c.sem&&c.sem[k])||"";
      const cls=st==="ok"?"sem-ok":st==="attesa"?"sem-attesa":st==="ko"?"sem-ko":"sem-na";
      const L=(k==="cons"&&c.ritiroInst)?"R":lett;
      return <span key={k} className={"sem "+cls} title={lab+": "+((c.semNote&&c.semNote[k])||"—")}
        style={compatto?{width:18,height:18,fontSize:9.5,borderRadius:5}:null}>{L}</span>;
    })}
  </span>);
}

function migrate(d){
  if(!d||typeof d!=="object")return d;
  if(d.zoneMap){const m={};Object.entries(d.zoneMap).forEach(([k,v])=>{m[k]=Array.isArray(v)?v.filter(Boolean):(v?[v]:[]);});d.zoneMap=m;}
  if(!Array.isArray(d.imports))d.imports=[];   // registro lotti di import (additivo, non tocca i dati esistenti)
  /* le due voci omaggio devono comparire nelle tendine anche sui database già salvati.
     Le versioni precedenti le chiamavano diversamente: qui si rinominano e si tolgono i doppioni. */
  if(d.tariffe&&Array.isArray(d.tariffe.clima)){
    const visti={};
    d.tariffe.clima=d.tariffe.clima.map(x=>isOmaggio(x.config)?{...x,config:omCanon(x.config),compenso:isOmaggioPosato(x.config)?400:0}:x)
      .filter(x=>{if(visti[x.config])return false;visti[x.config]=1;return true;});
    [[OM_NO,0],[OM_SI,400]].forEach(([config,compenso])=>{
      if(!d.tariffe.clima.some(x=>x.config===config))d.tariffe.clima.push({config,compenso});
    });
    /* le combo dei listini devono comparire nelle tendine anche sui database già salvati */
    DEF_COMBO.forEach(([config,compenso])=>{
      if(!d.tariffe.clima.some(x=>x.config===config))d.tariffe.clima.push({config,compenso});
    });
  }
  /* prezzi di vendita extra: tabella nuova, e voci sempre allineate a quelle di posa */
  if(d.tariffe){
    if(!Array.isArray(d.tariffe.extraVendita))d.tariffe.extraVendita=DEF_EXTRA_VEND();
    /* prima versione della tabella: aveva due colonne e nessun prezzo. Si rifà. */
    if(d.tariffe.extraVendita.some(x=>x.arqC===undefined))d.tariffe.extraVendita=DEF_EXTRA_VEND();
    /* voce ritirata: va tolta anche dai database già salvati */
    d.tariffe.extra=(d.tariffe.extra||[]).filter(x=>x.voce!=="Kit trasformazione GPL");
    d.tariffe.extraVendita=d.tariffe.extraVendita.filter(x=>x.voce!=="Kit trasformazione GPL");
    /* il ponteggio non è a listino: prezzo deciso a parte, si scrive solo se ancora vuoto */
    d.tariffe.extraVendita.forEach(x=>{
      if((x.voce==="Ponteggio"||x.voce==="Noleggio ponteggio")&&+x.oneC===500&&+x.oneT===500){x.oneC=650;x.oneT=650;}
      if((x.voce==="Ponteggio"||x.voce==="Noleggio ponteggio")&&[x.arqC,x.arqT,x.oneC,x.oneT].every(v=>v===null||v===undefined||v===""))
        {x.arqC=500;x.arqT=500;x.oneC=650;x.oneT=650;}
    });
    /* nomi degli extra allineati a contratti e moduli REV.10/2026: si rinominano le voci
       salvate (tariffe di posa e prezzi di vendita) e i riferimenti nelle pratiche, cosi'
       gli extra gia' inseriti restano collegati. Si fa una volta: i nomi nuovi non cambiano. */
    ["extra","extraVendita"].forEach(t=>(d.tariffe[t]||[]).forEach(x=>{if(RINOMINA_EXTRA[x.voce])x.voce=RINOMINA_EXTRA[x.voce];}));
    ["extra","extraVendita"].forEach(t=>{const seen={};d.tariffe[t]=(d.tariffe[t]||[]).filter(x=>seen[x.voce]?false:(seen[x.voce]=1));});
    /* piattaforme aeree come Arquati Sole: all'installatore si valuta caso per caso (la vecchia cesta a 450 non vale piu') */
    (d.tariffe.extra||[]).forEach(x=>{if(/^Piattaforma aerea/.test(x.voce)){if(+x.clima===450)x.clima=null;if(+x.termico===450)x.termico=null;}});
    /* REV.10/2026 fori: il cappotto diventa un supplemento che si somma al foro del muro (150/195, installatore 120);
       sopralluogo aggiuntivo anche sul clima (100/130). Si toccano solo i valori vecchi noti. */
    (d.tariffe.extra||[]).forEach(x=>{if(x.voce==="Supplemento cappotto termico"){if(+x.clima===190)x.clima=120;if(+x.termico===190)x.termico=120;}});
    d.tariffe.extraVendita.forEach(x=>{
      if(x.voce==="Supplemento cappotto termico"){if(+x.arqC===220)x.arqC=150;if(+x.arqT===220)x.arqT=150;if(+x.oneC===286)x.oneC=195;if(+x.oneT===286)x.oneT=195;}
      if(x.voce==="Sopralluogo"){if(x.arqC===null||x.arqC===undefined||x.arqC==="")x.arqC=100;if(x.oneC===null||x.oneC===undefined||x.oneC==="")x.oneC=130;}
    });
    /* Allegato 3 REV.10/2026: suolo pubblico da definire caso per caso (non piu' 300 fissi) */
    {const su=(d.tariffe.extra||[]).find(x=>x.voce==="Suolo pubblico");if(su){if(+su.clima===300)su.clima=null;if(+su.termico===300)su.termico=null;}}
    /* Allegato 3 REV.10/2026: il sopralluogo e' sempre un extra da 100 euro, anche sui clima */
    {const sp=(d.tariffe.extra||[]).find(x=>x.voce==="Sopralluogo");if(sp&&(sp.clima===null||sp.clima===undefined||sp.clima===""))sp.clima=100;}
    (d.pose||[]).forEach(p=>{for(let i=1;i<=5;i++){["vex","ex"].forEach(k=>{if(RINOMINA_EXTRA[p[k+i]])p[k+i]=RINOMINA_EXTRA[p[k+i]];});}});
    DEF_EXTRA.forEach(t=>{
      if(!d.tariffe.extra.some(x=>x.voce===t.voce))d.tariffe.extra.push({...t});
    });
    (d.tariffe.extra||[]).forEach(t=>{
      if(!d.tariffe.extraVendita.some(x=>x.voce===t.voce))d.tariffe.extraVendita.push({voce:t.voce,arqC:null,arqT:null,oneC:null,oneT:null});
    });
  }
  /* le pose che usavano i vecchi nomi puntano alle voci nuove */
  /* I passi del magazzino e le modalità di consegna sono stati rinominati per dire le
     cose come le dice chi lavora: le pratiche già inserite vanno tradotte, altrimenti
     restano con un valore che non esiste più nella tendina e i semafori dell'agenda
     le mostrano grigie, il via libera automatico non scatta e il saldo non viene
     chiesto. Si traduce una sola volta: i valori nuovi non vengono toccati. */
  const PREP_VECCHI={"Da brandizzare":"Preparato in magazzino","Imballato":"Brandizzato","Pronto consegna":"Pronto per consegna"};
  const CONS_VECCHIE={"Corriere":"Spedizione corriere","Consegno io":"Ritiro installatore"};
  (d.pose||[]).forEach(p=>{
    if(PREP_VECCHI[p.preparazione])p.preparazione=PREP_VECCHI[p.preparazione];
    if(CONS_VECCHIE[p.modalitaConsegna])p.modalitaConsegna=CONS_VECCHIE[p.modalitaConsegna];
    /* un valore non più riconosciuto resta nelle note invece di sparire in silenzio */
    if(p.preparazione&&PREP.indexOf(p.preparazione)<0){
      p.note=[p.note,"Preparazione precedente: "+p.preparazione].filter(Boolean).join(" · ");
      p.preparazione="";
    }
    if(p.modalitaConsegna&&CONSEGNA.indexOf(p.modalitaConsegna)<0){
      p.note=[p.note,"Consegna precedente: "+p.modalitaConsegna].filter(Boolean).join(" · ");
      p.modalitaConsegna="";
    }
  });
  (d.pose||[]).forEach(p=>{
    ["clima1","clima2","clima3","clima4"].forEach(k=>{if(p[k]&&isOmaggio(p[k]))p[k]=omCanon(p[k]);});
  });
  /* l'omaggio era un menu a parte: diventa una riga di prodotto, nel primo slot clima libero */
  (d.pose||[]).forEach(p=>{
    if(!p.omaggio)return;
    const gia=[p.clima1,p.clima2,p.clima3,p.clima4].some(x=>x===OM_NO||x===OM_SI);
    if(!gia){
      const v=String(p.omaggio);
      const riga=v.indexOf("con installazione")>-1?OM_SI:((v.indexOf("senza installazione")>-1||v==="Sì")?OM_NO:"");
      if(riga){
        const slot=["clima1","clima2","clima3","clima4"].find(k=>!p[k]);
        if(slot)p[slot]=riga;
        else p.note=[p.note,"Omaggio: "+riga].filter(Boolean).join(" · ");
      }
    }
    delete p.omaggio;
  });
  /* modello costi: additivo, i dati esistenti non vengono toccati */
  const def=DEF_COSTI();
  if(!d.costi)d.costi=def;
  else{
    Object.keys(def).forEach(k=>{if(d.costi[k]===undefined)d.costi[k]=def[k];});
    /* i listini ufficiali sostituiscono ogni struttura prezzi precedente: si conservano i costi materiali */
    if(Array.isArray(d.costi.clima)&&(d.costi.clima.some(x=>x.cod===undefined)||!d.costi.clima.some(x=>x.config===OM_SI)||!d.costi.clima.some(x=>x.config==="Combo Mono 18+18"))){
      d.costi.clima=def.clima.map(n=>{
        const old=d.costi.clima.find(x=>x.config===n.config);
        return old&&old.materiali!==""&&old.materiali!==undefined?{...n,materiali:old.materiali}:n;
      });
    }
    /* rev. 06-26: due righe combo corrette dall'ufficio. Si riallineano solo se il
       database ha ancora uno degli stati sbagliati noti (i valori stampati per errore
       sui listini vecchi, o i vuoti lasciati in attesa della correzione): una cifra
       messa a mano da chi usa il gestionale non viene toccata. */
    if(Array.isArray(d.costi.clima)){
      const vuoto=x=>x===null||x===undefined||x==="";
      const eq=(a,b)=>vuoto(b)?vuoto(a):(!vuoto(a)&&+a===+b);
      const FIX=[
        {config:"Combo Mono 24+24",
         sbagliati:[{cod:6350,lis:7950,oneCod:4700,oneLis:5900},   // come stampato prima
                    {cod:6350,lis:7950,oneCod:null,oneLis:null}],  // lasciati vuoti in attesa
         giusti:{cod:6500,lis:8150,codOm:6500,lisOm:8150,oneCod:8400,oneLis:10500,oneCodOm:8400,oneLisOm:10500}},
        {config:"Combo Dual + Mono 9/12",
         sbagliati:[{cod:9120,lis:8000,oneCod:8300,oneLis:10400},
                    {cod:null,lis:null,oneCod:8300,oneLis:10400}],
         giusti:{cod:6400,lis:8000,codOm:6400,lisOm:8000,oneCod:8300,oneLis:10400,oneCodOm:8300,oneLisOm:10400}}
      ];
      FIX.forEach(f=>{
        const r=d.costi.clima.find(x=>x.config===f.config);if(!r)return;
        if(f.sbagliati.some(v=>Object.keys(v).every(k=>eq(r[k],v[k]))))Object.assign(r,f.giusti);
      });
    }
    /* foro pietra/sasso ONE clima: torna al prezzo stampato (400) se era stato messo 455 */
    if(Array.isArray(d.tariffe&&d.tariffe.extraVendita)){
      const fp=d.tariffe.extraVendita.find(x=>x.voce==="Foro su muro in pietra / sasso"||x.voce==="Foro su parete in sasso / cemento");
      if(fp){if(+fp.oneC===455)fp.oneC=400;if(+fp.oneT===455)fp.oneT=400;}
    }
    if(!Array.isArray(d.costi.termico)||!d.costi.termico.length||d.costi.termico.some(x=>x.cod===undefined)){
      const oldT=Array.isArray(d.costi.termico)?d.costi.termico:[];
      d.costi.termico=def.termico.map(n=>{
        const old=oldT.find(x=>x.prodotto===n.prodotto);
        return old&&old.materiali!==""&&old.materiali!==undefined?{...n,materiali:old.materiali}:n;
      });
    }
  }
  /* anche nella tabella costi: rinomina le righe omaggio storiche e togli i doppioni */
  if(Array.isArray(d.costi.clima)){
    const v2={};
    d.costi.clima=d.costi.clima.map(x=>isOmaggio(x.config)?{...x,config:omCanon(x.config),materiali:400,cod:0,lis:0,codOm:0,lisOm:0,oneCod:0,oneLis:0,oneCodOm:0,oneLisOm:0}:x)
      .filter(x=>{if(v2[x.config])return false;v2[x.config]=1;return true;});
  }
  const vuoto={materiali:"",cod:"",lis:"",codOm:"",lisOm:"",oneCod:"",oneLis:"",oneCodOm:"",oneLisOm:""};
  (d.tariffe&&d.tariffe.clima||[]).forEach(t=>{
    if(!d.costi.clima.some(x=>x.config===t.config))d.costi.clima.push({config:t.config,...vuoto});
  });
  (d.tariffe&&d.tariffe.termico||[]).forEach(t=>{
    if(t.prodotto!=="Altro termico"&&!d.costi.termico.some(x=>x.prodotto===t.prodotto))d.costi.termico.push({prodotto:t.prodotto,...vuoto});
  });
  return d;
}

async function sbErrore(r){
  let t="";try{t=await r.text();}catch(e){}
  let j={};try{j=JSON.parse(t)||{};}catch(e){}
  const code=j.error_code||j.code;
  let m=j.error_description||j.msg||j.message||j.error||t||("errore "+r.status);
  if(code==="42501")m="Permesso negato: il tuo utente non può fare questa modifica.";
  const e=new Error(String(m).slice(0,200));e.status=r.status;e.code=code;return e;
}

    expires_at:j.expires_at||Math.floor(Date.now()/1000)+(j.expires_in||3600),

async function sbLogin(cfg,email,password){
  const r=await sbFetch(cfg.url+"/auth/v1/token?grant_type=password",{method:"POST",headers:{apikey:cfg.key,"Content-Type":"application/json"},body:JSON.stringify({email,password})});
  if(!r.ok){
    const e=await sbErrore(r);
    if(e.code==="email_not_confirmed")e.message="Utente non confermato: in Supabase va creato con «Auto Confirm User».";
    else if(r.status===400)e.message="Email o password non corretti.";
    else if(r.status===401||r.status===403)e.message="Chiave del progetto non valida.";
    else if(r.status===429)e.message="Troppi tentativi: riprova tra qualche minuto.";
    throw e;
  }
  const s=nuovaSessione(cfg,await r.json());salvaSessione(s);return s;
}
async function sbToken(cfg,forza){
  let s=sessione.s;
  if(!s)throw Object.assign(new Error("Sessione scaduta: rientra."),{status:401});
  const altra=leggiJSON(SKEY);   // un'altra scheda aperta può averla già rinnovata
  if(altra&&altra.user&&altra.user.id===s.user.id&&altra.refresh_token!==s.refresh_token&&altra.expires_at>=s.expires_at){s=altra;sessione.s=altra;forza=false;}
  if(!forza&&s.expires_at-60>Date.now()/1000)return s.access_token;
  if(!sessione.rinnovo)sessione.rinnovo=(async()=>{
    try{
      const r=await sbFetch(cfg.url+"/auth/v1/token?grant_type=refresh_token",{method:"POST",headers:{apikey:cfg.key,"Content-Type":"application/json"},body:JSON.stringify({refresh_token:s.refresh_token})});
      if(!r.ok){const e=await sbErrore(r);if(r.status===400||r.status===401){e.status=401;e.message="Sessione scaduta: rientra.";}throw e;}
      const n=nuovaSessione(cfg,await r.json(),s);salvaSessione(n);return n.access_token;
    }finally{sessione.rinnovo=null;}
  })();
  return sessione.rinnovo;
}
async function sbReq(cfg,path,{method="GET",body,prefer}={},riprova=true){
  const h={apikey:cfg.key,Authorization:"Bearer "+await sbToken(cfg)};
  if(body!==undefined)h["Content-Type"]="application/json";
  if(prefer)h.Prefer=prefer;
  const r=await sbFetch(cfg.url+path,{method,headers:h,body:body===undefined?undefined:JSON.stringify(body)});
  if(r.status===401&&riprova){await sbToken(cfg,true);return sbReq(cfg,path,{method,body,prefer},false);}
  if(!r.ok)throw await sbErrore(r);
  const t=await r.text();return t?JSON.parse(t):null;
}

/* ---------- proposte di modifica: differenze tra due versioni dei dati ---------- */
/* stessa sostanza anche se le chiavi sono in ordine diverso (il database le riordina) */
const canon=x=>JSON.stringify(x,(k,v)=>v&&typeof v==="object"&&!Array.isArray(v)?Object.keys(v).sort().reduce((o,kk)=>{o[kk]=v[kk];return o;},{}):v)||"";
const senzaValore=v=>v===undefined||v===null||v==="";
const uguali=(a,b)=>(senzaValore(a)&&senzaValore(b))||canon(a)===canon(b);
const isObj=x=>!!x&&typeof x==="object"&&!Array.isArray(x);
const isColl=(a,b)=>[a,b].every(x=>Array.isArray(x)&&x.every(r=>isObj(r)&&!senzaValore(r.id)));
const CAMPI_LOCALI=["files","fattFiles"];   // gli allegati stanno solo sul dispositivo di chi li ha caricati
const senzaLocali=r=>{const o={...r};CAMPI_LOCALI.forEach(k=>delete o[k]);return o;};
/* elenco di operazioni: agg/del/mod su schede con id (pratiche, clienti…), set su tutto il resto */
function diffDati(a,b){
  const ops=[];
  const visita=(x,y,path)=>{
    if(path.length&&uguali(x,y))return;
    if(path.length===1&&isColl(x,y)){
      const k=path[0],ma=new Map(x.map(r=>[r.id,r])),mb=new Map(y.map(r=>[r.id,r]));
      y.forEach(r=>{
        const o=ma.get(r.id);
        if(!o){ops.push({t:"agg",k,id:r.id,v:senzaLocali(r)});return;}
        if(JSON.stringify(o)===JSON.stringify(r))return;
        new Set([...Object.keys(o),...Object.keys(r)]).forEach(f=>{if(!CAMPI_LOCALI.includes(f)&&!uguali(o[f],r[f]))ops.push({t:"mod",k,id:r.id,f,prima:o[f],dopo:r[f]});});
      });
      x.forEach(r=>{if(!mb.has(r.id))ops.push({t:"del",k,id:r.id,prima:senzaLocali(r)});});
      return;
    }
    if(isObj(x)&&isObj(y)){new Set([...Object.keys(x),...Object.keys(y)]).forEach(k=>visita(x[k],y[k],[...path,k]));return;}
    /* tabelle senza id (tariffe, costi): stesse righe → confronto riga per riga */
    if(Array.isArray(x)&&Array.isArray(y)&&x.length===y.length&&x.every(isObj)&&y.every(isObj)){x.forEach((r,i)=>visita(r,y[i],[...path,i]));return;}
    ops.push({t:"set",path,prima:x,dopo:y});
  };
  visita(a,b,[]);
  return ops;
}
function applicaOps(db,ops){
  const d=structuredClone(db),saltate=[];
  ops.forEach(op=>{
    if(op.t==="set"){
      let o=d;op.path.slice(0,-1).forEach(k=>{if(o[k]===null||typeof o[k]!=="object")o[k]={};o=o[k];});
      const k=op.path[op.path.length-1];if(op.dopo===undefined)delete o[k];else o[k]=structuredClone(op.dopo);
      return;
    }
    if(!Array.isArray(d[op.k]))d[op.k]=[];
    const arr=d[op.k],i=arr.findIndex(r=>r.id===op.id);
    if(op.t==="agg"){if(i>=0)arr[i]={...arr[i],...structuredClone(op.v)};else arr.push(structuredClone(op.v));}
    else if(op.t==="del"){if(i>=0)arr.splice(i,1);}
    else if(op.t==="mod"){if(i<0){saltate.push(op);return;}if(op.dopo===undefined)delete arr[i][op.f];else arr[i][op.f]=structuredClone(op.dopo);}
  });
  return {db:migrate(d),saltate};
}
const valoreA=(db,path)=>path.reduce((o,k)=>o==null?undefined:o[k],db);
/* "" se il dato è ancora come quando è stata fatta la proposta, altrimenti cosa è cambiato */
function conflitto(db,op){
  if(op.t==="set"){const ora=valoreA(db,op.path);return uguali(ora,op.prima)?"":"nel frattempo è diventato «"+fmtVal(ora,db)+"»";}
  const r=(db[op.k]||[]).find(x=>x.id===op.id);
  if(op.t==="agg")return r?"esiste già: verrà aggiornata":"";
  if(op.t==="del")return r?"":"già eliminata";
  if(!r)return "la scheda è stata eliminata nel frattempo";
  return uguali(r[op.f],op.prima)?"":"nel frattempo è diventato «"+fmtVal(r[op.f],db)+"»";
}
const NOMI_COLL={pose:"Pratica",clienti:"Cliente",installatori:"Installatore",consulenti:"Consulente"};
const NOMI_SEZ={tariffe:"Tariffe",costi:"Costi e margini",zoneMap:"Zone",imports:"Registro import",clima:"clima",termico:"termico",extra:"extra posa",extraVendita:"extra vendita"};
const ETICHETTE={nContratto:"N. contratto",clienteId:"Cliente",consulente:"Consulente",installatore:"Installatore",dataApp:"Data appuntamento",
  dataVendita:"Data firma contratto",importoVendita:"Importo vendita €",listino:"Listino di vendita",pagamento:"Pagamento",caparraEur:"Caparra €",
  finRate:"Numero rate",finStato:"Esito finanziamento",finData:"Data esito finanziamento",finNote:"Note amministrazione",clima1:"Clima 1",clima2:"Clima 2",
  clima3:"Clima 3",clima4:"Clima 4",termico:"Prodotto termico",modalitaConsegna:"Modalità consegna",dataConsegna:"Data consegna",preparazione:"Merce pronta",
  finestraDa:"Finestra dal",finestraA:"Finestra al",dataPrevista:"Data posa prevista",dataInstallazione:"Data installazione",altriExtra:"Altri extra €",
  saldato:"Saldo incassato",recesso:"Recesso",motivoRecesso:"Motivo recesso",fatturaInst:"Fattura installatore €",fatturaImponibile:"Imponibile fattura €",
  addebitoStato:"Esito verifica extra",contattoPersonale:"Origine del contatto",note:"Note",noteInst:"Note per l'installatore",nome:"Nome",

  regioni:"Regioni",ruolo:"Ruolo",capoArea:"Capo area"};
const parole=k=>{const s=String(k).replace(/([a-z])([A-Z0-9])/g,"$1 $2").replace(/_/g," ").toLowerCase();return s.charAt(0).toUpperCase()+s.slice(1);};
const EXTRA_N={vex:"Extra {n} a contratto",vq:"Q.tà extra {n} a contratto",vp:"€ cliente extra {n}",ex:"Extra {n} posa",q:"Q.tà extra {n} posa"};
const etichettaCampo=f=>{if(ETICHETTE[f])return ETICHETTE[f];const m=/^(vex|vq|vp|ex|q)(\d)$/.exec(f);return m?EXTRA_N[m[1]].replace("{n}",m[2]):parole(f);};
function etichettaRec(db,k,id,v){
  const r=v||(db[k]||[]).find(x=>x.id===id)||{};
  let nome=r.nome||"";
  if(k==="pose"){const cl=(db.clienti||[]).find(c=>c.id===r.clienteId);nome=[r.nContratto&&("n. "+r.nContratto),cl&&cl.nome].filter(Boolean).join(" · ");}
  return (NOMI_COLL[k]||parole(k))+" "+(nome||"senza nome");
}
function fmtVal(v,db){
  if(senzaValore(v))return "—";
  if(typeof v==="boolean")return v?"sì":"no";
  if(typeof v==="string"){
    if(/^\d{4}-\d{2}-\d{2}$/.test(v))return fmtD(v);
    for(const k of ["clienti","installatori","consulenti"]){const r=db&&(db[k]||[]).find(x=>x.id===v);if(r)return r.nome;}
    return v.length>80?v.slice(0,80)+"…":v;
  }
  if(Array.isArray(v))return v.every(x=>!isObj(x)&&!Array.isArray(x))?v.join(", "):v.length+" righe";
  if(isObj(v))return "(dati modificati)";
  return String(v);
}
/* la scheda intera, quando la proposta la contiene (nuova o eliminata); per le modifiche si cerca nei dati */
const schedaOp=op=>op.t==="agg"?op.v:op.t==="del"?op.prima:null;
function descriviOps(ops,db){
  const voci=[],visti=new Set();
  ops.forEach(op=>{
    const key=op.t==="set"?"s:"+op.path[0]:op.k+":"+op.id;
    if(visti.has(key))return;visti.add(key);
    if(op.t==="set")voci.push(NOMI_SEZ[op.path[0]]||parole(op.path[0]));
    else voci.push((op.t==="agg"?"Nuova scheda ":op.t==="del"?"Eliminazione ":"")+etichettaRec(db,op.k,op.id,schedaOp(op)));
  });
  return voci.slice(0,3).join(", ")+(voci.length>3?" e altre "+(voci.length-3):"");
}
/* "clima › Mono 9 › Compenso": le righe delle tabelle si chiamano col loro nome, se ce l'hanno */
function etichettaPath(db,path){
  return path.slice(1).map((k,j)=>{
    if(typeof k==="number"){const r=valoreA(db,path.slice(0,j+2));return (r&&(r.config||r.prodotto||r.voce||r.nome))||("riga "+(k+1));}
    return NOMI_SEZ[k]||etichettaCampo(k);
  }).join(" › ");
}
/* una riga della tabella di confronto: [scheda, campo, prima, dopo] */
function rigaOp(op,db){
  if(op.t==="set")return [NOMI_SEZ[op.path[0]]||parole(op.path[0]),etichettaPath(db,op.path)||"—",fmtVal(op.prima,db),fmtVal(op.dopo,db)];
  const nome=etichettaRec(db,op.k,op.id,schedaOp(op));
  if(op.t==="agg")return [nome,"nuova scheda","—",Object.entries(op.v||{}).filter(([f,v])=>f!=="id"&&!senzaValore(v)&&!isObj(v)&&!Array.isArray(v)).slice(0,6).map(([f,v])=>etichettaCampo(f)+": "+fmtVal(v,db)).join(" · ")||"—"];
  if(op.t==="del")return [nome,"eliminazione","scheda presente","eliminata"];
  return [nome,etichettaCampo(op.f),fmtVal(op.prima,db),fmtVal(op.dopo,db)];
}

/* riduce le foto prima di inviarle: meno dati, piu' veloce, stessa leggibilita' */
function shrink(file,max=1600){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const s=Math.min(1,max/Math.max(img.width,img.height));
        const c=document.createElement("canvas");
        c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
        c.getContext("2d").drawImage(img,0,0,c.width,c.height);
        res({media:"image/jpeg",b64:c.toDataURL("image/jpeg",0.85).split(",")[1]});
      };
      img.onerror=()=>rej(new Error("Immagine non leggibile"));
      img.src=fr.result;
    };
    fr.onerror=()=>rej(new Error("Lettura file fallita"));
    fr.readAsDataURL(file);
  });
}
function toB64(file){
  return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result.split(",")[1]);fr.onerror=()=>rej(new Error("Lettura file fallita"));fr.readAsDataURL(file);});
}

/* schemi di estrazione: cosa chiedere per ogni tipo di documento */
/* legge una fattura installatore e ne estrae totale, numero, data e voci extra */
/* "2.400,00" -> 2400 · "2400.50" -> 2400.5 · "€ 1.234" -> 1234 */
function numIt(v){
  if(v===null||v===undefined||v==="")return "";
  if(typeof v==="number")return String(v);
  let t=String(v).replace(/[^\d.,-]/g,"").trim();
  if(!t)return "";
  const ic=t.lastIndexOf(","), ip=t.lastIndexOf(".");
  if(ic>-1&&ip>-1){                       // entrambi: l'ultimo è il decimale
    t = ic>ip ? t.replace(/\./g,"").replace(",",".") : t.replace(/,/g,"");
  }else if(ic>-1){                        // solo virgola
    t = (t.length-ic-1)===3 && t.split(",").length===2 && t.split(",")[0].length<=3
        ? t.replace(",","")               // 2,400 = migliaia
        : t.replace(",",".");             // 2400,50 = decimale
  }else if(ip>-1){                        // solo punto
    const dec=t.length-ip-1;
    if(dec===3)t=t.replace(/\./g,"");     // 2.400 = migliaia
  }
  const n=parseFloat(t);
  return isNaN(n)?"":String(n);
}

/* ---------- calcolo pose ---------- */
/* ---------- provvigione consulente — Allegato E1_04.26 ----------
   La FASCIA si legge dallo scostamento % del prezzo PRODOTTO sopra il prezzo codice.
   La PERCENTUALE si applica al prezzo prodotto scorporato dell'IVA (10% su tutta la
   linea Eco Living), cioè senza le lavorazioni extra — quelle le rifattura
   l'installatore, non sono venduto — e senza i 900 dell'omaggio installato.
   Contatto portato dal consulente: +5 punti sulla fascia.
   Venduto sotto codice: nessuna fascia automatica, serve autorizzazione e la
   percentuale va assegnata a mano sulla pratica. */
function provvCalc(p,pr,K){
  const scala=(Array.isArray(K.provvScala)&&K.provvScala.length?K.provvScala:DEF_PROVV_SCALA())
              .slice().sort((a,b)=>(+b.min)-(+a.min));
  const iva=+K.provvIvaPct||10;
  const personale=p.contattoPersonale==="Sì";
  const bonus=personale?(+K.provvIntegrazione||0):0;
  /* La base è SOLO il prezzo prodotto: le lavorazioni extra e i 900 dell'installazione
     del Mono 9000 omaggio sono posa, non venduto, e non fanno provvigione. */
  const base=Math.max(0,pr.prezzoProdotto||0)/(1+iva/100);
  const man=(p.provvPctManuale===""||p.provvPctManuale===undefined||p.provvPctManuale===null)?null:(+p.provvPctManuale||0);
  const markup=(pr.prezzoNoto&&pr.prezzoCodice>0&&pr.prezzoProdotto>0)
              ?((pr.prezzoProdotto-pr.prezzoCodice)/pr.prezzoCodice*100):null;
  const fascia=(markup===null||markup<0)?null:(scala.find(f=>markup>=(+f.min))||scala[scala.length-1]);
  let pctBase=null,fonte="";
  if(man!==null){pctBase=man;fonte="manuale";}
  else if(fascia){pctBase=+fascia.pct;fonte="scala";}
  else if(markup!==null&&markup<0)fonte="sotto";
  else fonte="incerto";
  const pct=pctBase===null?null:pctBase+bonus;
  const eur=pct===null?0:base*pct/100;
  const manca=pct!==null?"":(fonte==="sotto"
      ?"la % provvigionale da autorizzare (venduto sotto il prezzo codice)"
      :"il prezzo codice, senza il quale non so in quale fascia provvigionale cade");
  return {base,iva,markup,fascia,pctBase,bonus,pct,eur,fonte,personale,manca,
          soglia:fascia?+fascia.min:null};
}

function compute(p,db){
  const cli=db.clienti.find(c=>c.id===p.clienteId);
  const provincia=cli?cli.provincia:"";
  const comune=cli?(cli.comune||""):"";
  const zval=db.zoneMap[provincia];
  const consigliati=Array.isArray(zval)?zval.filter(Boolean):(zval?[zval]:[]);
  const consigliato=consigliati[0]||"";        // primo suggerito dalla zona
  const effInst=p.installatore||"";               // installatore scelto (auto-compilato dalla zona)
  const climaList=[p.clima1,p.clima2,p.clima3,p.clima4].filter(Boolean);
  const ambito=climaList.length?"Climatizzatore":(p.termico?"Termico":"");
  /* Per gli extra conta il mondo vero dell'impianto: se c'è un prodotto termico sono
     extra da caldaia, anche quando in pratica c'è pure il Mono 9000 in omaggio. E se
     una voce non ha prezzo nel proprio mondo si usa quello dell'altro, segnalandolo. */
  const extraTerm=!!p.termico;
  const valExtra=(r,k1,k2)=>{if(!r)return null;
    const a=r[k1],b=r[k2];
    const ok=x=>x!==null&&x!==undefined&&x!=="";
    return ok(a)?+a:(ok(b)?+b:null);};
  const tariffaExtra=v=>valExtra((db.tariffe.extra||[]).find(x=>x.voce===v),
    extraTerm?"termico":"clima", extraTerm?"clima":"termico");
  const compClima=climaList.reduce((s,cf)=>{const t=db.tariffe.clima.find(x=>x.config===cf);return s+(t?+t.compenso:0);},0);
  const tt=db.tariffe.termico.find(x=>x.prodotto===p.termico);
  const compensoStd=compClima+(tt?+tt.compenso:0);
  const slots=[[p.ex1,p.q1],[p.ex2,p.q2],[p.ex3,p.q3],[p.ex4,p.q4],[p.ex5,p.q5]];
  let extraTot=slots.reduce((s,[v,q])=>{
    if(!v)return s;
    return s+(Number(q)||1)*(tariffaExtra(v)||0);
  },0)+(Number(p.altriExtra)||0);
  const recesso=p.recesso==="Recesso";
  const motivo=recesso?(p.motivoRecesso||"Non indicato"):"";
  const compensoInst=recesso?0:compensoStd+extraTot;
  const scadRecesso=p.dataVendita?addDays(p.dataVendita,15):"";
  /* finestra di posa concordata col cliente: mese intero oppure periodo dal…al */
  const oggi=today();
  const fDa=p.finestraDa||"", fA=p.finestraA||"";
  const finestra = !fDa&&!fA ? "" :
    (p.finestraTipo==="mese" ? meseLabel(fDa.slice(0,7)) : (fmtD(fDa)+" → "+fmtD(fA)));
  const finestraMese = fDa?fDa.slice(0,7):"";
  let finestraStato="";
  if((fDa||fA)&&!p.dataInstallazione&&!recesso){
    if(fA&&oggi>fA)finestraStato="scaduta";
    else if(fDa&&oggi<fDa)finestraStato="futura";
    else finestraStato="aperta";
  }
  /* la data fissata cade fuori dal periodo promesso al cliente? */
  const fuoriFinestra=!!(p.dataPrevista&&fDa&&fA&&(p.dataPrevista<fDa||p.dataPrevista>fA));

  /* ---------- margine ---------- */
  const K=db.costi||DEF_COSTI();
  const mancano=[];            // elenco leggibile di cosa impedisce il calcolo
  const lordo=+p.importoVendita||0;
  if(!lordo)mancano.push("importo di vendita");
  const netto=lordo/(1+(+K.ivaPct||0)/100);
  /* la merce è pronta quando il magazzino l'ha dichiarata tale: un dato solo, non due */
  const mercePronta=p.preparazione===PRONTO;
  /* Quadratura dell'incasso: il cliente salda a merce pronta, mai dopo la posa.
     Con Arquati ONE una parte del lavoro la finanzia Agos e il resto lo paga lui. */
  const caparra=+p.caparraEur||0;
  const finanziato=+p.finanziatoEur||0;
  const residuoSaldo=Math.max(0,lordo-caparra-finanziato);
  const finOk=!finanziato||p.finStato==="Approvato";
  const saldato=p.saldato==="Sì"||residuoSaldo<=0;
  const incassoOk=finOk&&saldato;
  /* la merce è pronta ma i soldi non sono arrivati: è la telefonata da fare oggi */
  const saldoDaIncassare=mercePronta&&!incassoOk&&!recesso&&!p.dataInstallazione&&!!p.clienteId;

  /* VIA LIBERA: normalmente non si decide a mano. Quando la merce è pronta e l'incasso
     è completo (caparra + saldo, più il finanziamento approvato se c'è), si accende da
     solo. Il campo sulla pratica serve solo a forzarlo o a bloccarlo. */
  const okAuto=mercePronta&&incassoOk;
  const okPosa=p.okPosa==="Bloccata"?"Bloccata":((p.okPosa==="Sì"||okAuto)?"Sì":"");
  const okForzato=okPosa==="Sì"&&p.okPosa==="Sì"&&!okAuto;
  const okPosaData=okPosa!=="Sì"?"":(p.okPosaData||p.saldoData||p.finData||"");
  let fase="";
  if(!p.clienteId&&!p.nContratto)fase="";
  else if(recesso)fase="RECESSO";
  else if(p.dataInstallazione)fase="Installato";
  else if(okPosa!=="Sì")fase="In attesa OK";   // senza via libera non si programma
  else if(!effInst)fase="Da assegnare";
  else if(p.dataConsegna)fase="Consegnato";
  else if(p.preparazione===PRONTO)fase="Pronto consegna";
  else fase="Assegnato";
  /* Queste due guidano l'agenda e si leggono dai FATTI, non dalla fase: altrimenti il
     via libera amministrativo farebbe sparire dall'agenda pratiche ancora da fissare. */
  const inCorso=!!(p.clienteId||p.nContratto)&&!recesso&&!p.dataInstallazione;
  const daAssegnare=inCorso&&!effInst;
  const daPian=inCorso&&!!effInst&&!p.dataPrevista;
  /* ---------- semafori di avanzamento: le fasi separate, una per una ----------
     Servono in agenda per capire a colpo d'occhio dov'è ferma ogni pratica, senza
     aprirla. Ognuno vale "ok" (verde), "attesa" (ambra), "ko" (rosso) o "" (grigio,
     non ancora pertinente). */
  const prepIdx=PREP.indexOf(p.preparazione||"");   // -1 = non indicata
  const brandizzato=prepIdx>=PREP.indexOf("Brandizzato");
  const ritiroInst=p.modalitaConsegna==="Ritiro installatore";
  const consegnato=!!p.dataConsegna;
  const sem={
    amm: okPosa==="Sì"?"ok":(okPosa==="Bloccata"?"ko":"attesa"),
    /* preparato = la composizione è stata messa insieme in magazzino, anche se grezza */
    mat: prepIdx>=0?"ok":"",
    brand: brandizzato?"ok":(prepIdx>=0?"attesa":""),
    cons: consegnato?"ok":(mercePronta?"attesa":""),
    posa: p.dataInstallazione?"ok":(p.dataPrevista?"attesa":"")
  };
  if(recesso){sem.amm="ko";sem.mat="";sem.brand="";sem.cons="";sem.posa="";}
  const semNote={
    amm: okPosa==="Sì"?("Via libera"+(okPosaData?" del "+fmtD(okPosaData):"")+(okForzato?" (forzato)":"")):
         (okPosa==="Bloccata"?"Posa bloccata dall'amministrazione":
          (recesso?"Pratica in recesso":"In attesa del via libera"+(finStatoDesc(p)?" — "+finStatoDesc(p):""))),
    mat: prepIdx>=0?("Composizione preparata in magazzino — "+p.preparazione):"Non ancora preparato in magazzino",
    brand: brandizzato?("Brandizzato"+(prepIdx>PREP.indexOf("Brandizzato")?" — "+p.preparazione:"")):
           (prepIdx>=0?"Arrivato ma ANCORA DA BRANDIZZARE":"Brandizzazione non ancora avviata"),
    cons: consegnato?((ritiroInst?"Ritirato dall'installatore":"Spedito")+" il "+fmtD(p.dataConsegna)):
          (mercePronta?(ritiroInst?"Pronto: da ritirare o da portare all'installatore":"Pronto da spedire col corriere"):"Non ancora pronto per partire"),
    posa: p.dataInstallazione?("Installato il "+fmtD(p.dataInstallazione)):
          (p.dataPrevista?("Posa fissata per il "+fmtD(p.dataPrevista)):"Data di posa da fissare")
  };
  /* programmata pur senza via libera: è l'errore che non deve passare inosservato */
  const finStato=p.finStato||"";
  const programmataSenzaOk=!!(p.dataPrevista||p.dataInstallazione||effInst)&&okPosa!=="Sì"&&!recesso&&!!p.clienteId;


  // materiali: somma delle configurazioni clima + prodotto termico
  let materiali=0;
  climaList.forEach(cf=>{
    const r=(K.clima||[]).find(x=>x.config===cf)||(isOmaggio(cf)?(K.clima||[]).find(x=>x.config===omCanon(cf)):null);
    if(!r||r.materiali===""||r.materiali===undefined||r.materiali===null)mancano.push("costo materiali di «"+cf+"»");
    else materiali+=(+r.materiali||0);
  });
  if(p.termico&&p.termico!=="Altro termico"){
    const r=(K.termico||[]).find(x=>x.prodotto===p.termico);
    if(!r||r.materiali===""||r.materiali===undefined||r.materiali===null)mancano.push("costo materiali di «"+p.termico+"»");
    else materiali+=(+r.materiali||0);
  }
  if(!climaList.length&&!p.termico)mancano.push("nessun prodotto configurato");
  /* L'installatore NON serve per i conti: il compenso di posa esce dalle tariffe, che
     sono uguali per tutti. Senza installatore la pratica resta "Da assegnare", ma
     margine e provvigione si calcolano lo stesso. */

  /* L'omaggio è una riga di prodotto: si legge da clima1..4.
     I 400 del clima omaggio arrivano già dalla tabella materiali, e i 400 in più
     all'installatore dalla tariffa della riga «CON installazione»: qui non si somma
     nulla, si stabilisce solo quale colonna di prezzo usare. */
  const omaggioInstallato=climaList.some(isOmaggioPosato);
  const omaggioDato=climaList.some(isOmaggio);
  const omaggio=0, omaggioRicavoLordo=0, omaggioRicavo=0, omaggioPosa=0;

  const trasporto=materiali*0.01;                          // 1% come nel configuratore
  const extraMat=+p.extraMateriali||0;                     // materiale in più realmente usato su questo cantiere
  if(!p.listino)mancano.push("con quale listino è stata venduta");

  /* ---- la parte che serve davvero: separare il PRODOTTO dagli EXTRA ----
     Il consulente vende a 7.000 ma 1.000 sono lavorazioni extra: quei 1.000 non sono
     guadagno, sono soldi che poi l'installatore ci fattura. Vanno tolti dal confronto
     con codice e listino, altrimenti sembra che abbia venduto sopra codice. */
  /* Extra dichiarati sul CONTRATTO DI VENDITA, voce per voce: sono la contropartita dei
     metri e dei fori che il consulente ha promesso al cliente, e spiegano quanta parte
     del prezzo sopra codice non è margine ma lavorazione da girare all'installatore. */
  const tarDi=v=>tariffaExtra(v)||0;
  /* prezzo a cui l'extra si VENDE, dal listino della pratica, IVA 10% inclusa.
     Senza listino non si inventa niente: i due listini hanno prezzi diversi. */
  const prVendDi=v=>{if(!p.listino)return null;
    const e=(db.tariffe.extraVendita||[]).find(x=>x.voce===v);if(!e)return null;
    const one=p.listino==="Arquati ONE";
    return valExtra(e, one?(extraTerm?"oneT":"oneC"):(extraTerm?"arqT":"arqC"),
                       one?(extraTerm?"oneC":"oneT"):(extraTerm?"arqC":"arqT"));};
  const venditaExtra=[[p.vex1,p.vq1,p.vp1],[p.vex2,p.vq2,p.vp2],[p.vex3,p.vq3,p.vp3],[p.vex4,p.vq4,p.vp4],[p.vex5,p.vq5,p.vp5]]
    .filter(([v])=>!!v).map(([v,q,pr])=>{
      const qta=Number(q)||1,tar=tarDi(v),pu=prVendDi(v);
      /* prezzo sempre dal listino: niente importi scritti a mano */
      const listinoTot=pu===null?null:Math.round(qta*pu);
      return {voce:v,qta,tar,costoPosa:qta*tar,prezzoUnit:pu,listinoTot,
              importo:listinoTot||0,manuale:false,ignoto:pu===null};
    });
  const venditaExtraIgnoti=venditaExtra.filter(r=>r.ignoto).map(r=>r.voce);
  const extraVendutoTot=venditaExtra.reduce((s,r)=>s+r.importo,0);
  const extraCorpo=+p.extraPrezzoCliente||0;
  const extraCliente=venditaExtra.length?(extraVendutoTot+extraCorpo):extraCorpo;

  /* Confronto riga per riga fra quello che il consulente ha segnato e quello che
     l'installatore ha davvero posato. Quattro metri di canalina contro sei: i due metri
     di differenza, valorizzati a tariffa, sono quello che ha sottostimato. */
  const posaCompilata=slots.some(([v])=>!!v)||!!p.dataInstallazione;
  const vociConf=!posaCompilata?[]:[...new Set([...venditaExtra.map(r=>r.voce),...slots.filter(([v])=>!!v).map(([v])=>v)])];
  const confronto=vociConf.map(v=>{
    const qV=venditaExtra.filter(r=>r.voce===v).reduce((a,r)=>a+r.qta,0);
    const qI=slots.filter(([x])=>x===v).reduce((a,[,q])=>a+(Number(q)||1),0);
    const tar=tarDi(v);
    return {voce:v,qV,qI,dq:qI-qV,tar,delta:(qI-qV)*tar};
  }).filter(r=>r.dq!==0||r.qI>0);
  const confrontoOk=confronto.length>0;
  const gapQta=confronto.reduce((a,r)=>a+Math.max(0,r.delta),0);
  const recuperoQta=Math.max(0,-confronto.reduce((a,r)=>a+Math.min(0,r.delta),0));
  /* la fattura si inserisce col TOTALE come è scritto sul documento. Il costo vero è
     l'IMPONIBILE: l'IVA è detraibile, quindi neutra. In reverse charge non c'è IVA in
     fattura, quindi totale = imponibile e non si scorpora nulla. */
  const fattLordo=p.fatturaInst===""||p.fatturaInst===undefined||p.fatturaInst===null?null:(+p.fatturaInst||0);
  const regime=p.fatturaRegime||K.regimeInstDef||"Reverse charge";
  const aliq=aliquotaDi(regime);
  const fattImpManuale=p.fatturaImponibile===""||p.fatturaImponibile===undefined||p.fatturaImponibile===null?null:(+p.fatturaImponibile||0);
  const fattura=fattImpManuale!==null?fattImpManuale
              :(fattLordo!==null?fattLordo/(1+aliq/100):null);
  const extraAtteso=extraTot;
  /* scostamento vero: si può misurare solo quando la fattura è arrivata.
     Quello che il cliente paga per gli extra è IVATO, quello che fattura l'installatore
     è imponibile: si confrontano entrambi al netto, altrimenti il buco sembra minore. */
  const extraFatturato=fattura!==null?Math.max(0,fattura-compensoStd):null;
  const extraClienteNetto=extraCliente/(1+(+K.ivaPct||0)/100);
  const scostamento=extraFatturato!==null?(extraFatturato-extraClienteNetto):null;
  const tollEur=Math.max(50,extraClienteNetto*((+K.tolleranzaExtra||10)/100));
  const extraStato = extraCliente===0&&extraFatturato===null ? "" :
    (fattura===null ? "attesa" :
     (scostamento>tollEur ? "sotto" : (scostamento<-tollEur ? "sopra" : "ok")));
  /* ---------- addebito al consulente sugli extra sottostimati ----------
     Il consulente segna due metri di canalina, l'installatore ne posa cinque: quella
     differenza l'abbiamo pagata noi. Le regole E1_04.26 la trattano come ADDEBITO,
     ma solo se imputabile al consulente e dopo verifica: qui si propone l'importo e
     diventa effettivo quando lo si conferma sulla pratica. */
  const addQuota=((+K.addebitoExtraPct===0)?0:(+K.addebitoExtraPct||100))/100;
  /* due strade: i metri mancanti (analitica, nessuna tolleranza: due metri sono due metri)
     e lo scarto sulla fattura (aggregata, con tolleranza). Si propone la maggiore. */
  const addBaseFatt=(scostamento!==null&&scostamento>tollEur)?(K.addebitoOltreTolleranza?(scostamento-tollEur):scostamento):0;
  const addBaseQta=confrontoOk?gapQta:0;
  const addBase=Math.max(addBaseQta,addBaseFatt);
  const addebitoFonte=addBase<=0?"":(addBaseQta>=addBaseFatt?"quantità":"fattura");
  const addebitoProposto=Math.max(0,addBase*addQuota);
  const addMan=(p.addebitoEur===""||p.addebitoEur===undefined||p.addebitoEur===null)?null:(+p.addebitoEur||0);
  const addebitoStato=p.addebitoStato||"";
  const addebitoCalc=addebitoStato==="Non imputabile"?0:(addMan!==null?addMan:addebitoProposto);
  const addebito=addebitoStato==="Confermato"?addebitoCalc:0;

  const nettoTot=netto+omaggioRicavo;
  /* costo posa: la fattura vera quando è arrivata, altrimenti il compenso calcolato */
  const posaTot=(fattura!==null&&!recesso?fattura:compensoInst)+omaggioPosa;

  /* ---------- forbice di prezzo ----------
     il prezzo codice è il pavimento sotto cui non si vende, il listino è il
     riferimento massimo ma il consulente può superarlo.
     Le righe omaggio NON entrano nella forbice del prodotto: l'unità regalata è già
     dentro la colonna "con omaggio", e i 900 dell'installazione sono una voce a sé. */
  const LIS=p.listino||"";
  const omaggioInstallazione=omaggioInstallato?(+K.omaggioPrezzoInst||0):0;
  let pCod=0,pList=0,pNoto=0,nRighe=0;
  const prezzoManca=[];
  if(!LIS)prezzoManca.push("il listino di vendita (Arquati o Arquati ONE)");
  /* La colonna "CON OMAGGIO" vale per UN prodotto per ogni omaggio dato: è il pacchetto
     prodotto + Mono 9000 in regalo. Prima veniva applicata a tutte le righe, e su un
     contratto con due prodotti e un solo omaggio il regalo finiva contato due volte:
     prezzo codice e listino gonfiati di qualche centinaio di euro.
     L'omaggio va al prodotto principale: il termico se c'è, altrimenti il primo clima. */
  const nOmaggi=climaList.filter(isOmaggio).length;
  /* le righe di prodotto con una chiave stabile (lo slot da cui vengono) */
  const righeProd=[];
  if(p.termico&&p.termico!=="Altro termico")righeProd.push({k:"termico",nome:p.termico,row:(K.termico||[]).find(x=>x.prodotto===p.termico)});
  ["clima1","clima2","clima3","clima4"].forEach(k=>{const cf=p[k];
    if(cf&&!isOmaggio(cf))righeProd.push({k,nome:cf,row:(K.clima||[]).find(x=>x.config===cf)});});
  /* Chi porta l'omaggio? Lo dice il contratto. Sul listino Arquati è indifferente
     (tutti i Mono hanno lo stesso sovrapprezzo), su ARQUATIONE no: Mono 18 e Mono 24
     hanno un sovrapprezzo diverso da Mono 9 e 12, e cambia codice e listino. */
  /* Può portare l'omaggio solo un prodotto che ha davvero una colonna "con omaggio"
     più alta. Le COMBO sono vendute SENZA omaggio (i due listini lo scrivono): la loro
     colonna omaggio è uguale a quella normale, e prima una combo inserita per prima si
     prendeva l'omaggio gratis, abbassando il codice di 400-600 euro. */
  righeProd.forEach(r=>{const a=prezzoDi(r.row,LIS,false),b=prezzoDi(r.row,LIS,true);
    r.puoOmaggio=b.cod>a.cod||b.lis>a.lis;});
  const portatori=righeProd.filter(r=>r.puoOmaggio);
  const totaleCon=(chiave)=>{let liberi=nOmaggi,c=0,l=0;
    const ord=[...portatori.filter(r=>r.k===chiave),...portatori.filter(r=>r.k!==chiave),...righeProd.filter(r=>!r.puoOmaggio)];
    ord.forEach(r=>{const om=r.puoOmaggio&&liberi>0;if(om)liberi--;const x=prezzoDi(r.row,LIS,om);c+=x.cod;l+=x.lis;});
    return {c,l};};
  const omaggioOpzioni=(nOmaggi>0&&portatori.length>1)?portatori.map(r=>({k:r.k,nome:r.nome,...totaleCon(r.k)})):[];
  const omaggioConta=omaggioOpzioni.length>1&&new Set(omaggioOpzioni.map(o=>o.c+"|"+o.l)).size>1;
  const omaggioSu=(p.omaggioSu&&portatori.some(r=>r.k===p.omaggioSu))?p.omaggioSu:(portatori[0]||{}).k;
  /* omaggio dato ma nessun prodotto che possa portarlo: fuori listino */
  const omaggioFuoriListino=nOmaggi>portatori.length;
  let omaggiLiberi=nOmaggi;
  const ordine=[...portatori.filter(r=>r.k===omaggioSu),...portatori.filter(r=>r.k!==omaggioSu),...righeProd.filter(r=>!r.puoOmaggio)];
  ordine.forEach(r=>{nRighe++;
    const conOm=r.puoOmaggio&&omaggiLiberi>0;if(conOm)omaggiLiberi--;
    const x=prezzoDi(r.row,LIS,conOm);
    if(x.cod&&x.lis){pCod+=x.cod;pList+=x.lis;pNoto++;}
    else if(LIS)prezzoManca.push("prezzo codice/listino di «"+r.nome+"»");});
  if(!nRighe)prezzoManca.push("almeno un prodotto in Clima o Termico");
  const prezzoNoto=!!LIS&&nRighe>0&&pNoto===nRighe;   // confronto valido solo se conosco tutte le righe
  const pMin=pCod;
  /* il confronto si fa sul prezzo PRODOTTO, non sull'incassato lordo */
  const prezzoProdotto=Math.max(0,lordo-extraCliente-omaggioInstallazione);
  const posizione = !prezzoNoto||!prezzoProdotto ? "" :

        <div className="brand"><img src={LOGO} alt="Arquati Eco Living" style={{width:"100%",maxWidth:200,background:"#fff",borderRadius:10,padding:"8px 10px",display:"block"}}/></div>

            {entrato&&<div className="chip" title={(sess.user.email||"")+" · "+STATO_TXT[stato]}>
