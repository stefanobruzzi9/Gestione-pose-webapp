            {cols.map(([k])=><td key={k}><input value={Array.isArray(r[k])?r[k].join(", "):(r[k]||"")} onChange={e=>setCell(i,k,e.target.value)} placeholder={r._dup?"":"—"}/></td>)}
            <td className="hint" style={{fontSize:10.5,maxWidth:120,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{r._dup?<b style={{color:"#A93A1B"}}>già presente</b>:r._src}</td>
          </tr>))}
        </tbody></table>
      </div>
      <div style={{display:"flex",gap:10,marginTop:14,flexWrap:"wrap"}}>
        <button className="btn" onClick={conferma}>✓ Conferma e inserisci ({nSel})</button>
        {tipo==="posa"&&nSel>0&&<span className="hint" style={{alignSelf:"center"}}>Crea {nSel} {nSel===1?"pratica":"pratiche"}{nuoviClienti>0?(" e "+nuoviClienti+" "+(nuoviClienti===1?"cliente nuovo":"clienti nuovi")):" — clienti già in anagrafica"}.</span>}
        <button className="btn gh" onClick={()=>{setRows([]);setErr("");}}>Scarta tutto</button>
      </div>
    </div></div>}

    <div className="two">
      <div className="card"><h3>Import effettuati <span className="tag">{storia.length}</span></h3><div className="bd">
        <p className="hint">Ogni import è un lotto annullabile: rimuove solo i record che ha creato, mai quelli inseriti a mano.</p>
        {storia.length===0?<div className="empty"><div className="hint">Nessun import finora.</div></div>:
        <div className="tbl-wrap" style={{boxShadow:"none",border:0,marginTop:8}}>
          <table><thead><tr><th>Data</th><th>Tipo</th><th className="num">Record</th><th></th></tr></thead>
          <tbody>{storia.map(b=>(<tr key={b.batch}>
            <td className="mono">{fmtD(String(b.at).slice(0,10))}</td>
            <td>{(TIPI.find(t=>t[0]===b.tipo)||["","?"])[1]}</td>
            <td className="num">{b.n}{b.clienti?" +"+b.clienti:""}</td>
            <td className="rowbtns"><button className="btn gh sm" onClick={()=>annulla(b)}>Annulla</button></td>
          </tr>))}</tbody></table>
        </div>}
      </div></div>

      <div className="card"><h3>Configurazione lettura <span className="tag" style={{background:aiOn(ai)?"var(--brand-soft)":"#eee",color:aiOn(ai)?"var(--brand-dk)":"#999"}}>{aiOn(ai)?"attiva":"non attiva"}</span></h3><div className="bd">
        <div className="form" style={{gridTemplateColumns:"1fr"}}>
          <div className="fld"><label>Chiave API Anthropic</label><input type="password" value={ai.key} onChange={e=>setAi({...ai,key:e.target.value})} placeholder="sk-ant-api03-…"/></div>
          <div className="fld"><label>Modello</label><input value={ai.model} onChange={e=>setAi({...ai,model:e.target.value})}/></div>
        </div>
        <details style={{marginTop:10}}><summary style={{cursor:"pointer",fontWeight:600,color:"var(--brand-dk)"}}>Come ottenere la chiave (5 minuti)</summary>
          <ol className="hint" style={{lineHeight:1.7,marginTop:8}}>
            <li>Vai su <b>console.anthropic.com</b> e registrati.</li>
            <li>Sezione <b>Billing</b>: carica un piccolo credito iniziale.</li>
            <li>Sezione <b>API Keys</b> → <b>Create Key</b>, copia la chiave e incollala qui sopra.</li>
          </ol>
          <p className="hint">La chiave resta su questo dispositivo. Tienila riservata: chi la possiede può consumare il tuo credito. Se la condividi per sbaglio, revocala dalla console e creane una nuova.</p>
        </details>
      </div></div>
    </div>
  </div>);
}

,"Extra 2":p.vex2||"","Q.tà 2":p.vex2?(p.vq2||1):"","€ 2":p.vex2?(p.vp2||""):"","Extra 3":p.vex3||"","Q.tà 3":p.vex3?(p.vq3||1):"","€ 3":p.vex3?(p.vp3||""):"","Extra 4":p.vex4||"","Q.tà 4":p.vex4?(p.vq4||1):"","€ 4":p.vex4?(p.vp4||""):"","Extra 5":p.vex5||"","Q.tà 5":p.vex5?(p.vq5||1):"","€ 5":p.vex5?(p.vp5||""):"","Extra dichiarati a contratto €":Math.round(c.margine.extraCliente*100)/100,"Scarto quantità €":c.margine.gapQta?Math.round(c.margine.gapQta*100)/100:"","Base addebito":c.margine.addebitoFonte||"","Addebito extra €":c.margine.addebito?Math.round(c.margine.addebito*100)/100:"","Addebito proposto €":c.margine.addebitoProposto?Math.round(c.margine.addebitoProposto*100)/100:"","Esito addebito":c.margine.addebitoStato||(c.margine.addebitoDaValutare?"Da valutare":""),"Provvigione netta €":c.margine.provvNetta===null?"":Math.round(c.margine.provvNetta*100)/100,"Margine effettivo €":c.margine.okReale?Math.round(c.margine.eurReale*100)/100:"","Margine effettivo %":c.margine.okReale?Math.round(c.margine.pctReale*10)/10:"","Contatto personale":p.contattoPersonale==="Sì"?"Sì":"","Provv. liquidabile dal":p.dataInstallazione?addDays(p.dataInstallazione,15):"","Costo totale":Math.round(c.margine.costoTot*100)/100,"Margine €":c.margine.ok?Math.round(c.margine.eur*100)/100:"","Margine %":c.margine.ok?Math.round(c.margine.pct*10)/10:"","Dati mancanti":c.margine.mancano.join("; "),Preparazione:p.preparazione,"Modalità consegna":p.modalitaConsegna,"Data consegna":p.dataConsegna,"Periodo posa":c.finestra,"Periodo dal":p.finestraDa,"Periodo al":p.finestraA,"Stato periodo":c.finestraStato,"Data prevista":p.dataPrevista,"Data installazione":p.dataInstallazione,FASE:c.fase,"Compenso posa":c.compensoStd,"Extra":c.extraTot,"Posa extra 1":p.ex1||"","Posa q.tà 1":p.ex1?(p.q1||1):"","Posa extra 2":p.ex2||"","Posa q.tà 2":p.ex2?(p.q2||1):"","Posa extra 3":p.ex3||"","Posa q.tà 3":p.ex3?(p.q3||1):"","Posa extra 4":p.ex4||"","Posa q.tà 4":p.ex4?(p.q4||1):"","Posa extra 5":p.ex5||"","Posa q.tà 5":p.ex5?(p.q5||1):"","Compenso installatore":c.compensoInst,"Cliente saldato":p.saldato,"Da programmare":c.daPian?"SÌ":"","Link foto/video":p.link,Note:p.note}));
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(pose),"Lavori Pose");
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(db.clienti.map(({id,...r})=>r)),"Clienti");
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(db.installatori.map(({id,...r})=>r)),"Installatori");
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(db.consulenti.map(({id,...r})=>r)),"Consulenti");
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(Object.entries(db.zoneMap).map(([Provincia,v])=>({Provincia,Installatori:Array.isArray(v)?v.join(", "):(v||"")}))),"Zone");
    XLSX.writeFile(wb,"Gestione_Pose_"+today()+".xlsx");
    flash("Excel esportato");
  };
  const reset=()=>{if(condivisi("Cancellare TUTTI i dati e ripartire dagli esempi?")){localStorage.removeItem(KEY);setDb(JSON.parse(JSON.stringify(seed)));flash("Dati azzerati");}};
  const zipRef=useRef();
  const expZIP=async()=>{
    try{
      flash("Preparo il backup…");
      const zip=new JSZip();
      zip.file("data.json",JSON.stringify(db,null,2));
      const folder=zip.folder("files");
      for(const p of db.pose){for(const f of [...(p.files||[]),...(p.fattFiles||[])]){try{const b=await fileGet(f.id);if(b)folder.file(f.id+"__"+f.name,b);}catch(e){}}}
      const blob=await zip.generateAsync({type:"blob"});
      const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="arquati_backup_completo_"+today()+".zip";a.click();
      flash("Backup completo (ZIP) scaricato");
    }catch(e){alert("Errore nel backup ZIP: "+e.message);}
  };
  const impZIP=async e=>{
    const file=e.target.files[0];if(!file)return;
    if(!condivisi("Ripristinare il backup «"+file.name+"»? Sostituisce i dati attuali.")){e.target.value="";return;}
    try{
      const zip=await JSZip.loadAsync(file);
      const dj=zip.file("data.json");if(!dj){alert("ZIP non valido (manca data.json)");return;}
      const data=JSON.parse(await dj.async("string"));
      const entries=[];zip.folder("files").forEach((path,f)=>{if(!f.dir)entries.push(f);});
      for(const f of entries){const nm=f.name.replace(/^files\//,"");const id=nm.split("__")[0];const blob=await f.async("blob");try{await filePut(id,blob);}catch(er){}}
      setDb(migrate(data));flash("Backup completo importato");
    }catch(er){alert("ZIP non leggibile: "+er.message);}
    e.target.value="";
  };
  return(<div className="grid" style={{gap:16}}>
    <div className="card"><h3>Utenti e cloud <span className={"tag"+(conCloud?"":" warm")}>{conCloud?"collegato":"non attivo"}</span></h3><div className="bd">
      {!conCloud&&<>
        <p className="hint">Ora i dati sono salvati <b>solo in questo browser</b>. Collegando un database <b>Supabase</b> (gratuito) diventano condivisi e ognuno entra con la sua email e password: l'<b>amministratore</b> modifica tutto, chi è in <b>sola lettura</b> vede tutto e propone modifiche che l'amministratore approva.</p>

          <div className="fld"><label>URL del progetto Supabase</label><input value={url} onChange={e=>setUrl(e.target.value)} placeholder="https://xxxxxxxx.supabase.co"/></div>
          <div className="fld"><label>Chiave pubblica (publishable o anon)</label><input value={key} onChange={e=>setKey(e.target.value)} placeholder="sb_publishable_… oppure eyJhbGciOi…"/></div>
        </div>
        <button className="btn" style={{marginTop:12}} disabled={!url.trim()||!key.trim()} onClick={()=>onCollega(url,key)}>Collega e accedi</button>
      </>}

        <p style={{margin:"0 0 6px"}}>Sei entrato come <b>{utente.nome}</b> ({admin?"amministratore":"sola lettura"}) <span className="hint">· {email}</span></p>
        <p className="hint" style={{margin:0}}>Stato: {STATO_TXT[stato]}. {admin?"Le tue modifiche vanno sul cloud da sole dopo un paio di secondi.":"Le tue modifiche diventano proposte per l'amministratore."}</p>
        <div style={{display:"flex",gap:10,flexWrap:"wrap",marginTop:12}}>
          {admin&&<button className="btn" onClick={onSalva}>⤴ Salva ora sul cloud</button>}
          {admin&&<button className="btn gh" onClick={onRicarica}>⤵ Ricarica dal cloud</button>}
          <button className="btn gh" onClick={onEsci}>Esci</button>
          {!fisso&&admin&&<button className="btn link" onClick={onScollega}>Scollega questo dispositivo</button>}
        </div>
      </>}
      {admin&&<details style={{marginTop:14}}><summary style={{cursor:"pointer",fontWeight:600,color:"var(--brand-dk)"}}>Come si prepara il database (una volta sola, circa 10 minuti)</summary>
        <ol className="hint" style={{lineHeight:1.7,marginTop:8}}>
          <li>Su <b>supabase.com</b> crea un account gratuito e un nuovo progetto (regione Europa).</li>
          <li><b>Authentication → Users → Add user → Create new user</b>: un utente per persona, con email e password. Spunta <b>Auto Confirm User</b>.</li>
          <li><b>SQL Editor</b>: incolla lo script <b>supabase/setup.sql</b> del progetto, scrivi le email degli utenti nel punto 6 e premi <b>Run</b>. In fondo devono comparire gli utenti con il loro ruolo.</li>
          <li><b>Authentication → Sign In / Providers</b>: disattiva <b>Allow new users to sign up</b>, così nessun altro può registrarsi.</li>
          <li>Copia l'URL del progetto e la chiave pubblica (<b>publishable</b> o <b>anon</b>: pulsante <b>Connect</b> in alto, oppure Project Settings → API) e incollali qui sopra. Mai la chiave segreta.</li>
          <li>Entra come amministratore e premi <b>Carica sul cloud</b>: i dati di questo dispositivo diventano quelli condivisi.</li>
        </ol>
        <p className="hint">Per aggiungere un utente più avanti: crealo in Authentication → Users, poi nel SQL Editor esegui questo, con nome, ruolo (<b>admin</b> o <b>lettura</b>) ed email giusti:</p>
        <code className="sql">{SQL_UTENTE}</code>
        <p className="hint">Foto, video e fatture allegati restano sul dispositivo di chi li carica: non passano dal cloud.</p>
      </details>}
      {admin&&prima!==null&&<p className="hint" style={{marginTop:12}}>Su questo dispositivo c'è una copia dei dati com'erano prima del collegamento al cloud.{" "}
        <button className="btn link sm" onClick={scaricaPrima}>Scarica copia</button>
        {admin&&entrato&&<button className="btn link sm" onClick={usaPrima}>Usa questa copia</button>}</p>}
    </div></div>
    <div className="two">
    <div className="card"><h3>Salvataggio & ripristino</h3><div className="bd">
      <p className="hint"><b>Backup completo (ZIP)</b>: contiene dati <u>e</u> foto/video. È quello da usare per la copia di sicurezza e per spostarti su un altro PC/telefono.</p>
      <div style={{display:"flex",gap:10,flexWrap:"wrap",marginTop:6}}>
        <button className="btn" onClick={expZIP}>⤓ Backup completo (ZIP, con file)</button>
        {admin&&<button className="btn gh" onClick={()=>zipRef.current.click()}>⤒ Ripristina da ZIP</button>}
        <input ref={zipRef} type="file" accept=".zip,application/zip" style={{display:"none"}} onChange={impZIP}/>
      </div>
      <p className="hint" style={{marginTop:16}}>Backup rapido <b>solo dati</b> (JSON, leggero, senza foto/video):</p>
      <div style={{display:"flex",gap:10,flexWrap:"wrap",marginTop:6}}>
        <button className="btn gh" onClick={expJSON}>⤓ Solo dati (JSON)</button>
        {admin&&<button className="btn gh" onClick={()=>fileRef.current.click()}>⤒ Ripristina dati (JSON)</button>}
        <input ref={fileRef} type="file" accept="application/json" style={{display:"none"}} onChange={impJSON}/>
      </div>
      {admin&&<div style={{marginTop:18}}><button className="btn acc" onClick={reset}>Azzera tutto</button></div>}
    </div></div>
    <div className="card"><h3>Esporta in Excel</h3><div className="bd">
      <p className="hint">Genera un file .xlsx con tutti i fogli (Pose calcolate, Clienti, Installatori, Consulenti, Zone) da archiviare o condividere col commercialista.</p>
      <button className="btn" style={{marginTop:10}} onClick={expXLSX}>▤ Esporta Excel (.xlsx)</button>
    </div></div>
    </div>
  </div>);
}

/* PWA: icona generata + manifest + service worker (best effort) */
(function(){
  try{
    function icon(sz){var c=document.createElement("canvas");c.width=c.height=sz;var x=c.getContext("2d");
      x.fillStyle="#EEF2EC";x.fillRect(0,0,sz,sz);var r=sz*0.24,cx=sz/2,cy=sz/2;
      x.strokeStyle="#E4532B";x.lineWidth=sz*0.03;x.lineCap="round";
      for(var i=0;i<12;i++){var a=i*Math.PI/6;x.beginPath();x.moveTo(cx+Math.cos(a)*r*1.4,cy+Math.sin(a)*r*1.4);x.lineTo(cx+Math.cos(a)*r*1.78,cy+Math.sin(a)*r*1.78);x.stroke();}
      var g=x.createRadialGradient(cx,cy-r*0.25,r*0.15,cx,cy,r);g.addColorStop(0,"#F6B24A");g.addColorStop(1,"#E4532B");
      x.fillStyle=g;x.beginPath();x.arc(cx,cy,r,0,7);x.fill();return c.toDataURL("image/png");}
    var i192=icon(192),i512=icon(512);
    var ai=document.getElementById("appleIcon");if(ai)ai.href=i192;
    var manifest={name:"Gestione Pose · Arquati Eco Living",short_name:"Pose Arquati",start_url:".",scope:".",display:"standalone",orientation:"any",background_color:"#EEF2EC",theme_color:"#356B41",icons:[{src:i192,sizes:"192x192",type:"image/png",purpose:"any maskable"},{src:i512,sizes:"512x512",type:"image/png",purpose:"any maskable"}]};
    var ml=document.getElementById("manifestLink");if(ml)ml.href=URL.createObjectURL(new Blob([JSON.stringify(manifest)],{type:"application/manifest+json"}));
    if("serviceWorker" in navigator && location.protocol.indexOf("http")===0){
      var sw="self.addEventListener('install',function(e){self.skipWaiting();});self.addEventListener('activate',function(e){self.clients.claim();});self.addEventListener('fetch',function(e){e.respondWith(fetch(e.request).catch(function(){return caches.match(e.request);}));});";
      navigator.serviceWorker.register(URL.createObjectURL(new Blob([sw],{type:"text/javascript"}))).catch(function(){});
    }
  }catch(err){console.warn("PWA:",err);}
})();
</script>
