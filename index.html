              <b>{utente.nome}</b><span className="hint">{admin?"amministratore":"sola lettura"}</span>
              <button className="btn link sm" onClick={()=>esci()}>Esci</button>
            </div>}
          </div>
        </div>
        <div className="wrap">
          {ro&&opsBozza.length>0&&<div className="avviso bozza">
            <div><b>✎ {opsBozza.length===1?"1 modifica da inviare":opsBozza.length+" modifiche da inviare"}</b><div className="hint">{descriviOps(opsBozza,vista)}</div></div>
            <div style={{display:"flex",gap:8,flexWrap:"wrap"}}><button className="btn" onClick={inviaBozza}>Invia all'amministratore</button><button className="btn gh" onClick={annullaBozza}>Annulla</button></div>
          </div>}
          {ro&&!opsBozza.length&&<div className="avviso"><span>👁 <b>Sola lettura.</b> Puoi provare qualsiasi modifica (pratiche, clienti, telefoni, installatori, tariffe…) e vedere subito i margini: restano prove su questo dispositivo finché non le invii, e diventano effettive solo se l'amministratore le approva.</span></div>}
          {ro&&cloudVuoto&&<div className="avviso"><span>L'amministratore non ha ancora caricato i dati sul cloud.</span></div>}
          {admin&&entrato&&cloudVuoto&&!pronto&&<div className="avviso">
            <div><b>☁ Il cloud è ancora vuoto.</b><div className="hint">Carica i dati di questo dispositivo ({db.pose.length} pratiche, {db.clienti.length} clienti): diventano quelli condivisi con gli altri utenti.</div></div>
            <button className="btn" onClick={caricaSulCloud}>Carica sul cloud</button>
          </div>}
          {admin&&entrato&&nAttesa>0&&tab==="dash"&&<div className="avviso"><span><b>{nAttesa===1?"1 proposta":nAttesa+" proposte"} di modifica</b> da approvare.</span><button className="btn" onClick={()=>setTab("proposte")}>Vedi</button></div>}
          {tab==="dash"&&<Dash comp={comp} db={vista}/>}
          {tab==="proposte"&&<Approvazioni proposte={proposte} admin={admin} db={vista} onApprova={approva} onRifiuta={rifiuta}/>}
          {tab==="pose"&&<Pose comp={comp} db={vista} up={up} flash={flash} openPose={setEditP}/>}
          {tab==="agenda"&&<Agenda comp={comp} openPose={setEditP}/>}
          {tab==="clienti"&&<Clienti db={vista} comp={comp} up={up} flash={flash}/>}
          {tab==="installatori"&&<Installatori db={vista} comp={comp} up={up} flash={flash}/>}
          {tab==="zone"&&<Zone db={vista} up={up} flash={flash}/>}
          {tab==="consulenti"&&<Consulenti db={vista} comp={comp} up={up} flash={flash}/>}
          {tab==="tariffe"&&<Tariffe db={vista} up={up} flash={flash}/>}
          {tab==="margini"&&<Margini db={vista} setDb={setDati} comp={comp} openPose={setEditP} flash={flash}/>}
          {tab==="importa"&&<Importa db={vista} setDb={setDati} flash={flash}/>}
          {tab==="backup"&&<Backup db={vista} setDb={setDati} comp={comp} flash={flash} admin={admin} conCloud={conCloud} entrato={entrato} utente={utente} email={sess&&sess.user.email}
            fisso={cloudFisso()} stato={stato} onCollega={collega} onScollega={scollega} onEsci={()=>esci()} onSalva={salvaOra} onRicarica={ricarica}/>}
        </div>
      </main>
      {editP&&<PoseForm p={editP} db={vista} onChange={writePose} onClose={()=>setEditP(null)}/>}
      {toast&&<div className="toast">{toast}</div>}
    </div>
    </SoloLettura.Provider>
  );
}

/* ---------- accesso e proposte ---------- */
const STATO_TXT={"":"collegamento…",salvo:"salvataggio in corso…",ok:"dati sincronizzati",errore:"non connesso, riprovo tra poco"};
function Accesso({cfg,fisso,msg,onEntra,onScollega}){
  const [email,setEmail]=useState(()=>ls.get(UKEY)||"");
  const [pw,setPw]=useState("");
  const [err,setErr]=useState(msg||"");
  const [busy,setBusy]=useState(false);
  useEffect(()=>{if(msg)setErr(msg);},[msg]);
  const entra=async e=>{
    e.preventDefault();if(busy)return;
    setErr("");setBusy(true);
    try{const s=await sbLogin(cfg,email.trim(),pw);ls.set(UKEY,email.trim());onEntra(s);}
    catch(er){setErr(er.message||"Accesso non riuscito.");setBusy(false);}
  };
  return(<div className="accesso">
    <form className="card accbox" onSubmit={entra}>
      <img src={LOGO} alt="Arquati Eco Living" className="acclogo"/>
      <div><h2>Gestione Pose</h2><div className="hint">Entra con l'email e la password che ti ha dato l'amministratore.</div></div>
      <div className="fld"><label>Email</label><input type="email" autoComplete="username" value={email} onChange={e=>setEmail(e.target.value)} required autoFocus={!email}/></div>
      <div className="fld"><label>Password</label><input type="password" autoComplete="current-password" value={pw} onChange={e=>setPw(e.target.value)} required autoFocus={!!email}/></div>
      {err&&<div className="accerr">{err}</div>}
      <button className="btn" type="submit" disabled={busy} style={{justifyContent:"center"}}>{busy?"Accesso in corso…":"Entra"}</button>
      {!fisso&&<button type="button" className="btn link sm" onClick={onScollega}>Usa l'app senza cloud su questo dispositivo</button>}
    </form>
  </div>);
}
function Attesa({err,onRiprova,onEsci}){
  return(<div className="accesso"><div className="card accbox">
    <img src={LOGO} alt="Arquati Eco Living" className="acclogo"/>
    {err?<><div className="accerr">{err}</div>
      <div style={{display:"flex",gap:8}}><button className="btn" onClick={onRiprova}>Riprova</button><button className="btn gh" onClick={onEsci}>Esci</button></div></>
    :<div className="hint">Verifico l'utente…</div>}
  </div></div>);
}
const STATI_PROP={in_attesa:["In attesa","warm"],approvata:["Approvata",""],rifiutata:["Rifiutata","ko"]};
const dataOra=t=>{if(!t)return "";const d=new Date(t);return d.toLocaleDateString("it-IT")+" alle "+d.toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"});};
function Approvazioni({proposte,admin,db,onApprova,onRifiuta}){
  const [vedi,setVedi]=useState("in_attesa");
  const conta=s=>proposte.filter(p=>p.stato===s).length;
  const lista=proposte.filter(p=>vedi==="tutte"||p.stato===vedi);
  return(<>
    <div className="filters">
      {[["in_attesa","In attesa"],["approvata","Approvate"],["rifiutata","Rifiutate"],["tutte","Tutte"]].map(([k,l])=>(
        <button key={k} className={"btn sm"+(vedi===k?"":" gh")} onClick={()=>setVedi(k)}>{l}{k==="tutte"?"":" ("+conta(k)+")"}</button>))}
    </div>
    {lista.length===0&&<div className="card"><div className="bd hint">{vedi==="in_attesa"?(admin?"Nessuna proposta da approvare.":"Nessuna proposta in attesa."):"Niente da mostrare."}</div></div>}
    <div className="grid">{lista.map(p=>(<Proposta key={p.id} p={p} admin={admin} db={db} onApprova={onApprova} onRifiuta={onRifiuta}/>))}</div>
  </>);
}
function Proposta({p,admin,db,onApprova,onRifiuta}){
  const ops=Array.isArray(p.modifiche)?p.modifiche:[];
  const [st,cls]=STATI_PROP[p.stato]||[p.stato,""];
  const aperta=p.stato==="in_attesa";
  return(<div className="card">
    <h3><span>{p.descrizione||"Modifica"}</span><span className={"tag "+cls}>{st}</span></h3>
    <div className="bd">
      <div className="hint" style={{marginBottom:10}}>Proposta da <b>{p.autore_nome||"utente"}</b> il {dataOra(p.creata_il)}{p.deciso_il?" · "+(p.stato==="approvata"?"approvata":"rifiutata")+" il "+dataOra(p.deciso_il):""}</div>
      <div className="tdiff-wrap"><table className="tdiff"><thead><tr><th>Scheda</th><th>Campo</th><th>Prima</th><th>Dopo</th></tr></thead><tbody>
        {ops.map((op,i)=>{const [scheda,campo,prima,dopo]=rigaOp(op,db),conf=aperta&&admin?conflitto(db,op):"";
          return(<tr key={i}><td>{scheda}</td><td>{campo}</td><td className="prima">{prima}</td><td className="dopo">{dopo}{conf&&<div className="conf">⚠ {conf}</div>}</td></tr>);})}
      </tbody></table></div>
      {p.nota&&<div className="hint" style={{marginTop:10}}>Nota dell'amministratore: <b>{p.nota}</b></div>}
      {admin&&aperta&&<div style={{display:"flex",gap:10,marginTop:12,flexWrap:"wrap"}}>
        <button className="btn" onClick={()=>onApprova(p)}>✓ Approva</button>
        <button className="btn gh" onClick={()=>onRifiuta(p)}>✕ Rifiuta</button>
      </div>}
    </div>
  </div>);
}

/* ---------- Cruscotto ---------- */
function Dash({comp,db}){
  const rows=comp.map(x=>x.c);
  const attive=rows.filter(c=>c.fase&&c.fase!=="RECESSO");
  const installate=rows.filter(c=>c.fase==="Installato");
  const recessi=rows.filter(c=>c.fase==="RECESSO");
  const recPerMotivo=[...MOTIVI_REC,"Non indicato"].map(m=>{
    const r=comp.filter(({c})=>c.fase==="RECESSO"&&c.motivo===m);
    return [m,r.length,r.reduce((s,{p})=>s+(+p.importoVendita||0),0)];
  });
  const recTot=recPerMotivo.reduce((s,x)=>s+x[1],0);
  const previsto=rows.reduce((s,c)=>s+c.compensoInst,0);
  const daLiq=installate.reduce((s,c)=>s+c.compensoInst,0);
  const vendTot=comp.reduce((s,{p,c})=>s+(c.fase?(+p.importoVendita||0):0),0);
  const vendNet=comp.reduce((s,{p,c})=>s+((c.fase&&c.fase!=="RECESSO")?(+p.importoVendita||0):0),0);
  const perFase=FASI.map(f=>[f,rows.filter(c=>c.fase===f).length]);
  const daAssegnare=rows.filter(c=>c.daAssegnare).length;
  const inAttesaOk=rows.filter(c=>c.fase==="In attesa OK").length;
  const finAttesa=comp.filter(({p,c})=>c.fase&&c.fase!=="RECESSO"&&p.finStato==="In attesa").length;
  const finKo=comp.filter(({p,c})=>c.fase&&c.fase!=="RECESSO"&&p.finStato==="Respinto").length;
  const senzaOk=comp.filter(({c})=>c.programmataSenzaOk).length;
  const daIncassare=comp.filter(({c})=>c.saldoDaIncassare).length;
  const daPian=rows.filter(c=>c.daPian).length;
  const t=today();
  const prossimi=comp.filter(({p,c})=>p.dataPrevista&&!p.dataInstallazione&&p.dataPrevista>=t&&diffDays(p.dataPrevista,t)<=7).length;
  const recAperto=comp.filter(({p,c})=>c.scadRecesso&&!p.dataInstallazione&&c.fase!=="RECESSO"&&c.scadRecesso>=t).length;
  const saldati=comp.filter(({p,c})=>p.saldato==="Sì"&&!p.dataInstallazione&&c.fase!=="RECESSO").length;
  const winAperta=comp.filter(({p,c})=>c.finestraStato==="aperta"&&!p.dataPrevista).length;
  const winScaduta=comp.filter(({c})=>c.finestraStato==="scaduta").length;
  const winFutura=comp.filter(({c})=>c.finestraStato==="futura").length;
  const fuoriFin=comp.filter(({c})=>c.fuoriFinestra).length;
  const mrgVive=comp.filter(({c})=>c.fase&&c.fase!=="RECESSO");
  const mrgIncomplete=mrgVive.filter(({c})=>!c.margine.ok).length;
  const mrgBassi=mrgVive.filter(({c})=>c.margine.ok&&c.margine.pct<(+(db.costi&&db.costi.sogliaAllerta)||8)).length;
  // mesi
  const mesi=Array.from({length:12},(_,m)=>{
    const ym=`2026-${String(m+1).padStart(2,"0")}`;
    const vend=comp.filter(({p})=>p.dataVendita&&p.dataVendita.slice(0,7)===ym);
    const inst=comp.filter(({p})=>p.dataInstallazione&&p.dataInstallazione.slice(0,7)===ym);
    return {m:["Gen","Feb","Mar","Apr","Mag","Giu","Lug","Ago","Set","Ott","Nov","Dic"][m],
      pv:vend.length,vend:vend.reduce((s,{p})=>s+(+p.importoVendita||0),0),
      ni:inst.length,ci:inst.reduce((s,{c})=>s+c.compensoInst,0)};
  });
  const maxCi=Math.max(1,...mesi.map(x=>x.ci));
  const KPI=(l,v,cl)=>(<div className={"kpi "+(cl||"")}><div className="lab">{l}</div><div className="val mono">{v}</div></div>);
  return (<>
    <div className="grid kpis" style={{marginBottom:16}}>
      {KPI("Pose totali",rows.filter(c=>c.fase).length)}
      {KPI("Pose attive",attive.length)}
      {KPI("Installate",installate.length)}
      {KPI("Recessi",recessi.length,"warn")}
      {KPI("In attesa di OK posa",inAttesaOk,inAttesaOk?"warn":"")}
      {KPI("Compenso installatori previsto",eur(previsto),"euro")}
      {KPI("Da liquidare (installati)",eur(daLiq),"euro")}
      {KPI("Venduto totale",eur(vendTot),"euro")}
      {KPI("Venduto netto (no recessi)",eur(vendNet),"euro")}
    </div>
    <div className="two" style={{marginBottom:16}}>
      <div className="card"><h3>Pose per fase</h3><div className="bd">
        {perFase.map(([f,n])=>(<div key={f} style={{display:"flex",alignItems:"center",gap:10,padding:"6px 0"}}>
          <span className={"pill "+FCLASS(f)}>{f}</span><div style={{flex:1}}/><b className="mono" style={{fontSize:16}}>{n}</b></div>))}
      </div></div>
      <div className="card"><h3>Programmazione interventi</h3><div className="bd">
        {senzaOk>0&&<div className="alert" style={{marginBottom:10}}>
          <b style={{color:"#A93A1B"}}>{senzaOk} {senzaOk===1?"pratica programmata":"pratiche programmate"} senza via libera</b>
          <p className="hint" style={{margin:"3px 0 0"}}>Hanno installatore o data ma l'amministrazione non ha ancora dato l'OK.</p>
        </div>}
        {[["Merce pronta, saldo da incassare",daIncassare,"#F2D9D1"],["In attesa di OK amministrazione",inAttesaOk,"#F0C9A8"],["Finanziamenti in attesa",finAttesa,"#FFF3D6"],["Finanziamenti respinti",finKo,"#F2D9D1"]].filter(x=>x[1]>0).map(([l,n,bg])=>(
          <div key={l} style={{display:"flex",alignItems:"center",gap:10,padding:"7px 0"}}>
            <span style={{width:12,height:12,borderRadius:4,background:bg,display:"inline-block"}}/><span>{l}</span><div style={{flex:1}}/><b className="mono" style={{fontSize:16}}>{n}</b></div>))}
        {[["Da assegnare (serve installatore)",daAssegnare,"#E2E2E2"],["Da programmare (assegnate, senza data)",daPian,"#FFF3D6"],["Pose previste nei prossimi 7 gg",prossimi,"#DCEBD4"],["Periodo posa APERTO, data non fissata",winAperta,"#FCE3B8"],["Periodo posa SCADUTO senza installazione",winScaduta,"#F6C9BF"],["Data fissata fuori dal periodo promesso",fuoriFin,"#F6C9BF"],["Parcheggiati (periodo ancora futuro)",winFutura,"#E4E9F5"],["Margine sotto soglia",mrgBassi,"#F6C9BF"],["Margine non calcolabile (dati mancanti)",mrgIncomplete,"#EDEAE2"],["Recesso ancora aperto",recAperto,"#FCE9CC"],["Saldati, da installare",saldati,"#E1E9F5"]].map(([l,v,bg])=>(
          <div key={l} style={{display:"flex",alignItems:"center",gap:10,padding:"7px 0"}}>
            <span style={{width:12,height:12,borderRadius:4,background:bg,display:"inline-block"}}/><span>{l}</span><div style={{flex:1}}/><b className="mono" style={{fontSize:18}}>{v}</b></div>))}
      </div></div>
    </div>
    <div className="card" style={{marginBottom:16}}><h3>Recessi per motivo <span className="tag warm">{recTot}</span></h3><div className="bd">
      {recTot===0?<div className="empty"><div className="hint">Nessun recesso registrato. Ottimo.</div></div>:
      <div className="tbl-wrap" style={{boxShadow:"none",border:0}}>
        <table><thead><tr><th>Motivo</th><th className="num">Pratiche</th><th className="num">Venduto perso</th><th style={{width:180}}>Peso</th></tr></thead>
        <tbody>{recPerMotivo.filter(x=>x[1]>0).map(([m,n,v])=>(<tr key={m}>
          <td><span className={"mot "+MCLASS(m)}>{m}</span></td>
          <td className="num">{n}</td><td className="num eur">{eur(v)}</td>
          <td><div className="bar"><div className="fill" style={{width:(n/recTot*100)+"%"}}/></div></td></tr>))}
        </tbody></table>
      </div>}
      <p className="hint" style={{marginTop:10}}><b>Cambio idea</b> segnala un problema di chiusura o di follow-up nei 15 giorni. <b>KO finanziario</b> segnala un problema di qualifica del cliente a monte: sono due cose da correggere in modo diverso.</p>
    </div></div>
    <div className="card"><h3>Andamento 2026 <span className="hint">vendite · installazioni · compenso installato</span></h3><div className="bd">
      <div className="tbl-wrap" style={{boxShadow:"none",border:0}}><table>
        <thead><tr><th>Mese</th><th className="num">Pose vendute</th><th className="num">Venduto</th><th className="num">Installate</th><th className="num">Compenso installato</th><th style={{width:160}}></th></tr></thead>
        <tbody>{mesi.map(x=>(<tr key={x.m}><td>{x.m}</td><td className="num">{x.pv||""}</td><td className="num eur">{x.vend?eur(x.vend):""}</td><td className="num">{x.ni||""}</td><td className="num eur">{x.ci?eur(x.ci):""}</td>
          <td><div className="bar"><div className="fill" style={{width:(x.ci/maxCi*100)+"%"}}/></div></td></tr>))}
          <tr style={{fontWeight:700}}><td>Totale</td><td className="num">{mesi.reduce((s,x)=>s+x.pv,0)}</td><td className="num eur">{eur(mesi.reduce((s,x)=>s+x.vend,0))}</td><td className="num">{mesi.reduce((s,x)=>s+x.ni,0)}</td><td className="num eur">{eur(mesi.reduce((s,x)=>s+x.ci,0))}</td><td></td></tr>
        </tbody></table></div>
    </div></div>
  </>);
}

/* ---------- Agenda ---------- */
function Agenda({comp,openPose}){
  const t=today();
  const byVend=(a,b)=>(a.p.dataVendita||"9999").localeCompare(b.p.dataVendita||"9999"); // contratti piu' vecchi in cima
  const daAssegnare=comp.filter(({c})=>c.daAssegnare).sort(byVend);
  const daPianAll=comp.filter(({c})=>c.daPian);
  /* chi ha una finestra ancora futura è parcheggiato di proposito, non è in ritardo */
  const parcheggiati=daPianAll.filter(({c})=>c.finestraStato==="futura").sort((a,b)=>(a.p.finestraDa||"9999").localeCompare(b.p.finestraDa||"9999"));
  const daPian=daPianAll.filter(({c})=>c.finestraStato!=="futura").sort((a,b)=>{
    const r={scaduta:0,aperta:1,"":2};
    const d=(r[a.c.finestraStato]??2)-(r[b.c.finestraStato]??2);
    return d||byVend(a,b);
  });
  /* carico per mese: solo lavori non ancora installati, raggruppati per periodo concordato */
  const carico=(()=>{
    const m={};
    comp.forEach(({p,c})=>{
      if(p.dataInstallazione||c.fase==="RECESSO"||!c.fase)return;
      const ym=c.finestraMese||(p.dataPrevista?p.dataPrevista.slice(0,7):"");
      if(!ym)return;
      if(!m[ym])m[ym]={ym,n:0,imp:0,comp:0,daFissare:0};
      m[ym].n++;m[ym].imp+=(+p.importoVendita||0);m[ym].comp+=c.compensoInst;
      if(!p.dataPrevista)m[ym].daFissare++;
    });
    return Object.values(m).sort((a,b)=>a.ym.localeCompare(b.ym));
  })();
  const maxCar=Math.max(1,...carico.map(x=>x.n));
  const prog=comp.filter(({p,c})=>p.dataPrevista&&!p.dataInstallazione&&c.fase!=="RECESSO"&&c.effInst).sort((a,b)=>a.p.dataPrevista.localeCompare(b.p.dataPrevista));
  const eseguite=comp.filter(({c})=>c.fase==="Installato").sort((a,b)=>(b.p.dataInstallazione||"").localeCompare(a.p.dataInstallazione||""));
  const recessi=comp.filter(({c})=>c.fase==="RECESSO");
  /* quadro dei passi: quante pratiche vive sono ferme su ciascuno */
  const vive=comp.filter(({p,c})=>c.fase&&c.fase!=="RECESSO"&&!p.dataInstallazione);
  const cnt=k=>({ok:vive.filter(({c})=>c.sem[k]==="ok").length,
                 attesa:vive.filter(({c})=>c.sem[k]==="attesa").length,
                 ko:vive.filter(({c})=>c.sem[k]==="ko").length,
                 na:vive.filter(({c})=>!c.sem[k]).length});
  /* le pratiche con il via libera ma il materiale non ancora spedito: è il lavoro di magazzino */
  const daBrandizzare=vive.filter(({c})=>c.sem.amm==="ok"&&c.sem.brand==="attesa");
  const daSpedire=vive.filter(({c})=>c.sem.amm==="ok"&&c.sem.cons==="attesa");
  const Card=({title,items,dateGet,dateHdr,motivo})=>(
    <div className="card"><h3>{title} <span className="tag">{items.length}</span></h3>

          <td><span className={"pill "+FCLASS(c.fase)}>{c.fase||"—"}</span>{c.motivo&&<div style={{marginTop:3}}><span className={"mot "+MCLASS(c.motivo)}>{c.motivo}</span></div>}</td>

    </div>
    <div className="legend">{FASI.map(f=>(<span key={f}><span className={"sw "+FCLASS(f)}/>{f}</span>))}</div>
  </>);
}

              const max=Math.max(lis,pr), span=Math.max(1,max-cod);

            <p className="hint" style={{marginTop:7,marginBottom:0}}>I costi materiali si impostano nella sezione <b>Margini</b>.</p>
          </div>}
        </div>
      </div></div>
      <div className="ft"><span className="hint">{c.effInst?("Installatore: "+c.effInst):"Da assegnare — nessun installatore"} · <b>salvataggio automatico</b></span>
        <div style={{display:"flex",gap:10}}><button className="btn gh" onClick={()=>ordineLavoro(f,db,c)} title="PDF senza prezzi da mandare all'installatore">📄 Ordine di lavoro</button><button className="btn gh" onClick={()=>schedaIntervento(f,db,c)}>🖨 Stampa scheda</button><button className="btn" onClick={onClose}>Chiudi</button></div></div>
    </div>
  </div>);
}

/* ---------- CRUD generico anagrafiche ---------- */
function Crud({title,items,cols,form,onSave,onDel,extra}){
  const [edit,setEdit]=useState(null);
  const [q,setQ]=useState("");
  const norm=it=>Object.entries(it).filter(([k])=>k!=="id"&&k!=="__new").map(([,v])=>Array.isArray(v)?v.join(" "):(typeof v==="string"?v:"")).join(" ").toLowerCase();
  const shown=q.trim()?items.filter(it=>norm(it).includes(q.trim().toLowerCase())):items;
  return(<>
    <div className="filters" style={{marginBottom:12}}>
      <input placeholder={"Cerca "+title.toLowerCase()+"…"} value={q} onChange={e=>setQ(e.target.value)} style={{minWidth:260}}/>
      <span className="hint">{shown.length}{q.trim()?(" di "+items.length):""}</span>
      <div style={{flex:1}}/>
      <button className="btn" onClick={()=>setEdit({id:uid(),__new:true})}>+ Aggiungi</button>
    </div>
    <div className="tbl-wrap"><table><thead><tr>{cols.map(c=>(<th key={c.k} className={c.num?"num":""}>{c.l}</th>))}<th></th></tr></thead>
      <tbody>{shown.length===0?<tr><td colSpan={cols.length+1}><div className="empty hint">{q.trim()?"Nessun risultato per «"+q+"».":"Nessun record."}</div></td></tr>:
      shown.map(it=>(<tr key={it.id} onClick={()=>setEdit(structuredClone(it))} style={{cursor:"pointer"}}>
        {cols.map(c=>(<td key={c.k} className={c.num?"num "+(c.eur?"eur":""):""}>{c.render?c.render(it):(it[c.k]||"")}</td>))}
        <td onClick={e=>{e.stopPropagation();onDel(it.id);}}><button className="btn link">✕</button></td></tr>))}
      </tbody></table></div>
    {extra}
    {edit&&<div className="ovl" onClick={e=>{if(e.target.classList.contains("ovl"))setEdit(null);}}>
      <div className="modal" style={{maxWidth:560}}><div className="hd"><h2>{edit.__new?"Nuovo":"Modifica"} · {title}</h2><button className="x" onClick={()=>setEdit(null)}>×</button></div>
      <div className="bd">{form(edit,(k,v)=>setEdit(s=>({...s,[k]:v})))}</div>
      <div className="ft"><span/><div style={{display:"flex",gap:10}}><button className="btn gh" onClick={()=>setEdit(null)}>Annulla</button><button className="btn" onClick={()=>{onSave(edit);setEdit(null);}}>Salva</button></div></div>
      </div></div>}
  </>);
}
const Fi=(edit,set,label,k,type="text",opts=null)=>(<div className="fld" key={k}><label>{label}</label>
  {opts?<select value={edit[k]||""} onChange={e=>set(k,e.target.value)}><option value=""></option>{opts.map(o=>(<option key={o}>{o}</option>))}</select>
  :<input type={type} value={edit[k]||""} onChange={e=>set(k,e.target.value)}/>}</div>);

    onSave={x=>{up(d=>{const i=d.installatori.findIndex(c=>c.id===x.id);delete x.__new;if(i>=0)d.installatori[i]=x;else d.installatori.push(x);return d;});flash("Installatore salvato");}}
    onDel={id=>{const nome=(db.installatori.find(i=>i.id===id)||{}).nome;const np=db.pose.filter(p=>p.installatore===nome).length;const nz=Object.values(db.zoneMap).filter(v=>Array.isArray(v)?v.includes(nome):v===nome).length;const msg=(np||nz)?("Questo installatore è usato in "+np+" pratiche e "+nz+" province. Eliminarlo lascerà quei riferimenti orfani. Eliminare comunque?"):"Eliminare l'installatore?";if(!confirm(msg))return;up(d=>{d.installatori=d.installatori.filter(c=>c.id!==id);Object.keys(d.zoneMap).forEach(k=>{const v=d.zoneMap[k];if(Array.isArray(v)){const nv=v.filter(x=>x!==nome);if(nv.length)d.zoneMap[k]=nv;else delete d.zoneMap[k];}else if(v===nome)delete d.zoneMap[k];});return d;});flash("Installatore eliminato");}}/>;

/* Prospetto provvigioni: le regole dicono liquidazione DOPO 15 GG dalla data di
   installazione e invio dei prospetti entro il 10 del mese. Qui si sceglie il mese di
   installazione e si vede, consulente per consulente, cosa matura e quando si paga. */
function ProspettoProvv({db,comp}){
  const righe=useMemo(()=>comp.filter(({p,c})=>p.consulente&&c.fase&&c.fase!=="RECESSO"&&p.dataInstallazione)
    .map(({p,c})=>({p,c,pv:c.margine.provv||{},mese:p.dataInstallazione.slice(0,7),liq:addDays(p.dataInstallazione,15)}))
    .sort((a,b)=>a.p.dataInstallazione<b.p.dataInstallazione?1:-1),[comp]);
  const mesi=useMemo(()=>[...new Set(righe.map(r=>r.mese))].sort().reverse(),[righe]);
  const [mese,setMese]=useState("");
  const m=mese||mesi[0]||"";
  const sel=righe.filter(r=>r.mese===m);
  const gruppi=useMemo(()=>{const g={};sel.forEach(r=>{(g[r.p.consulente]=g[r.p.consulente]||[]).push(r);});
    return Object.keys(g).sort().map(k=>[k,g[k]]);},[sel]);
  const tot=sel.reduce((s,r)=>s+(r.pv.pct===null?0:r.pv.eur),0);
  const totMrg=sel.reduce((s,r)=>s+(r.c.margine.okReale?r.c.margine.eurReale:0),0);
  const totAdd=sel.reduce((s,r)=>s+(r.c.margine.addebitoApplicato||0),0);
  const totRes=sel.reduce((s,r)=>s+(r.c.margine.addebitoResiduo||0),0);
  const addDaVal=sel.filter(r=>r.c.margine.addebitoDaValutare).length;
  const mrgKo=sel.filter(r=>!r.c.margine.okReale).length;
  const daDef=sel.filter(r=>r.pv.pct===null).length;
  const stampa=()=>{
    const row=r=>'<tr><td>'+(r.p.nContratto||"")+'</td><td>'+(r.c.cliente||"")+'</td><td class="num">'+eur(r.pv.base||0)+'</td><td class="num">'+(r.pv.pct===null?'<span class="muted">da definire</span>':r.pv.pct+"%")+'</td><td class="num">'+(r.pv.pct===null?"—":eur(r.pv.eur))+'</td><td class="num">'+(r.c.margine.addebitoApplicato>0?("−"+eur(r.c.margine.addebitoApplicato)):"—")+'</td><td class="num"><b>'+(r.pv.pct===null?"—":eur(Math.max(0,r.pv.eur-(r.c.margine.addebitoApplicato||0))))+'</b></td><td>'+fmtD(r.liq)+'</td></tr>';
    const body=gruppi.map(([nome,rs])=>{
      const t=rs.reduce((s,r)=>s+(r.pv.pct===null?0:r.pv.eur),0);
      const a=rs.reduce((s,r)=>s+(r.c.margine.addebitoApplicato||0),0);
      return '<div class="sec">'+nome+'</div><table><thead><tr><th>Contratto</th><th>Cliente</th><th class="num">Imponibile</th><th class="num">%</th><th class="num">Provvigione</th><th class="num">Addebiti</th><th class="num">Netto</th><th>Liquidabile dal</th></tr></thead><tbody>'
        +rs.map(row).join("")+'<tr><th colspan="4">Totale '+nome+'</th><th class="num">'+eur(t)+'</th><th class="num">'+(a>0?("−"+eur(a)):"—")+'</th><th class="num">'+eur(t-a)+'</th><th></th></tr></tbody></table>';
    }).join("");
    printHTML("Prospetto provvigioni "+meseLabel(m),'<p>Installazioni del mese di <b>'+meseLabel(m)+'</b> — liquidazione 15 giorni dopo la data di installazione (Allegato E1_04.26).</p>'+body+'<div class="sec">Totale generale</div><table><tr><th>Provvigioni del mese</th><td class="num">'+eur(tot)+'</td></tr><tr><th>Addebiti</th><td class="num">'+(totAdd>0?("−"+eur(totAdd)):"—")+'</td></tr><tr><th>Netto da liquidare</th><td class="num"><b>'+eur(tot-totAdd)+'</b></td></tr></table>');
  };
  if(!mesi.length)return <div className="card" style={{marginTop:16}}><h3>Prospetto provvigioni</h3><div className="bd hint">Nessuna installazione registrata: il prospetto si popola quando le pratiche hanno una data di installazione.</div></div>;
  return (<div className="card" style={{marginTop:16}}>
    <h3>Prospetto provvigioni <span className="hint">liquidazione a 15 gg dall'installazione</span></h3>
    <div className="bd">
      <div style={{display:"flex",gap:10,alignItems:"center",flexWrap:"wrap",marginBottom:10}}>
        <select value={m} onChange={e=>setMese(e.target.value)}>{mesi.map(x=>(<option key={x} value={x}>{meseLabel(x)}</option>))}</select>
        <span className="hint">{sel.length} installazioni · provvigioni <b>{eur(tot)}</b>{totAdd>0?<> · addebiti <b style={{color:"#A93A1B"}}>−{eur(totAdd)}</b> · netto <b>{eur(tot-totAdd)}</b></>:null} · margine effettivo <b>{eur(totMrg)}</b>{mrgKo>0?" ("+mrgKo+" senza margine calcolabile)":""}</span>{addDaVal>0?<span className="ex ex-sotto">{addDaVal} addebiti da valutare</span>:null}
        {daDef>0&&<span className="pz pz-sotto">{daDef} con % da definire</span>}
        <div style={{flex:1}}/>
        <button className="btn gh" onClick={stampa}>🖨 Stampa prospetto</button>
      </div>
      <div className="tbl-wrap" style={{border:0,boxShadow:"none"}}><table>
        <thead><tr><th>Consulente</th><th>Contratto</th><th>Cliente</th><th className="num">Imponibile</th><th className="num">%</th><th className="num">Provvigione</th><th className="num">Addebiti</th><th className="num">Netto</th><th className="num">Margine effettivo</th><th>Liquidabile dal</th></tr></thead>
        <tbody>{gruppi.map(([nome,rs])=>{
          const t=rs.reduce((a,r)=>a+(r.pv.pct===null?0:r.pv.eur),0);
          return (<React.Fragment key={nome}>
            {rs.map((r,i)=>(<tr key={r.p.id}>
              <td>{i===0?<b>{nome}</b>:""}</td>
              <td>{r.p.nContratto||"—"}</td><td>{r.c.cliente}</td>
              <td className="num eur">{eur(r.pv.base||0)}</td>
              <td className="num">{r.pv.pct===null?<span className="pz pz-sotto">da definire</span>:<span>{r.pv.pct}%{r.pv.bonus?<span className="hint"> (+{r.pv.bonus})</span>:null}</span>}</td>
              <td className="num eur">{r.pv.pct===null?"—":eur(r.pv.eur)}</td>
              <td className="num eur">{r.c.margine.addebitoApplicato>0?<span style={{color:"#A93A1B",fontWeight:700}}>−{eur(r.c.margine.addebitoApplicato)}{r.c.margine.addebitoResiduo>0?<span className="hint" style={{display:"block"}}>+{eur(r.c.margine.addebitoResiduo)} a debito</span>:null}</span>:(r.c.margine.addebitoDaValutare?<span className="ex ex-sotto" title="proposto, non ancora confermato">{eur(r.c.margine.addebitoProposto)}?</span>:<span className="hint">—</span>)}</td>
              <td className="num eur"><b>{r.pv.pct===null?"—":eur(Math.max(0,r.pv.eur-(r.c.margine.addebitoApplicato||0)))}</b></td>
              <td className="num eur">{r.c.margine.okReale?<span className={"mrg mrg-"+r.c.margine.clsReale}>{eur(r.c.margine.eurReale)}</span>:<span className="hint">—</span>}</td>
              <td>{fmtD(r.liq)}{addDays(r.p.dataInstallazione,15)<=today()?<span className="pz pz-pieno" style={{marginLeft:5}}>ok</span>:null}</td>
            </tr>))}
            <tr><td></td><td colSpan={4} style={{textAlign:"right",fontWeight:700}}>Totale {nome}</td><td className="num eur">{eur(t)}</td><td className="num eur">{(()=>{const a=rs.reduce((x,r)=>x+(r.c.margine.addebitoApplicato||0),0);return a>0?<span style={{color:"#A93A1B",fontWeight:700}}>−{eur(a)}</span>:"—";})()}</td><td className="num eur"><b>{eur(t-rs.reduce((x,r)=>x+(r.c.margine.addebitoApplicato||0),0))}</b></td><td className="num eur"><b>{eur(rs.reduce((a,r)=>a+(r.c.margine.okReale?r.c.margine.eurReale:0),0))}</b></td><td></td></tr>
          </React.Fragment>);
        })}</tbody></table></div>
      <p className="hint" style={{marginTop:8}}>Gli addebiti sono le differenze sugli extra a carico del consulente, e valgono solo dopo la conferma sulla pratica: quelli col punto interrogativo sono proposti e non ancora scalati. Il margine effettivo è quello della pratica ricalcolato con la provvigione vera al netto dell'addebito, al posto della percentuale di stima. Restano fuori i recessi e le pratiche non ancora installate. Addebiti, recuperi su contratti annullati e trattenute non sono gestiti qui: vanno sottratti in fase di liquidazione.</p>
    </div>
  </div>);
}

function Consulenti({db,comp,up,flash}){
  const stat=useMemo(()=>{const m={};db.consulenti.forEach(x=>m[x.nome]={n:0,v:0,nr:0,vr:0,idea:0,ko:0,mrg:0,net:0,nm:0,sotto:0,pieno:0,extra:0,perso:0,prov:0,provLiq:0,provKo:0,mrgR:0,netR:0,nmR:0,addeb:0,addebDaVal:0});comp.forEach(({p,c})=>{const k=p.consulente;if(k&&m[k]){m[k].n++;m[k].v+=(+p.importoVendita||0);if(c.fase==="RECESSO"){m[k].nr++;m[k].vr+=(+p.importoVendita||0);if(c.motivo==="Cambio idea")m[k].idea++;if(c.motivo==="KO finanziario")m[k].ko++;}else if(c.fase&&c.margine.ok){m[k].nm++;m[k].mrg+=c.margine.eur;m[k].net+=c.margine.netto;m[k].extra+=(c.margine.sopraCodice||0);if(c.margine.okReale){m[k].nmR++;m[k].mrgR+=c.margine.eurReale;m[k].netR+=c.margine.netto;}const pv=c.margine.provv||{};if(pv.pct!==null&&pv.pct!==undefined){m[k].prov+=pv.eur;if(p.dataInstallazione&&addDays(p.dataInstallazione,15)<=today())m[k].provLiq+=pv.eur;}if(pv.pct===null)m[k].provKo++;m[k].addeb+=(c.margine.addebitoApplicato||0);if(c.margine.addebitoDaValutare)m[k].addebDaVal++;if(c.margine.posizione==="sotto")m[k].sotto++;if(c.margine.posizione==="pieno")m[k].pieno++;}}});return m;},[db,comp]);
  const pctOf=s=>(s&&s.net>0)?(s.mrg/s.net*100):null;
  const pctROf=s=>(s&&s.netR>0)?(s.mrgR/s.netR*100):null;
  return <Crud title="Consulente"
    items={db.consulenti}
    cols={[{k:"nome",l:"Consulente"},{k:"ruolo",l:"Ruolo",render:i=>(<span className="tag">{i.ruolo}</span>)},{l:"Regioni",k:"_reg",render:i=>(i.regioni||[]).join(", ")},{l:"N. pose",num:true,k:"_n",render:i=>stat[i.nome]?.n||0},{l:"Venduto",num:true,eur:true,k:"_v",render:i=>eur(stat[i.nome]?.v||0)},{l:"Recessi",num:true,k:"_r",render:i=>{const s=stat[i.nome]||{};return(<span>{s.nr||0}{(s.idea||s.ko)?<span style={{marginLeft:6}}>{s.idea?<span className="mot mot-idea" title="Cambio idea">{s.idea} idea</span>:null}{s.ko?<span className="mot mot-ko" title="KO finanziario" style={{marginLeft:3}}>{s.ko} KO</span>:null}</span>:null}</span>);}},{l:"Provvigioni €",num:true,eur:true,k:"_prov",render:i=>{const s=stat[i.nome]||{};return(<span>{eur((s.prov||0)-(s.addeb||0))}{s.addeb>0?<span className="hint" style={{display:"block"}}>{eur(s.prov)} meno {eur(s.addeb)} di addebiti</span>:null}{s.provLiq>0?<span className="hint" style={{display:"block"}}>di cui {eur(s.provLiq)} liquidabili</span>:null}{s.addebDaVal>0?<span className="ex ex-sotto" style={{marginTop:3,display:"inline-block"}} title="addebiti proposti, non confermati">{s.addebDaVal} da valutare</span>:null}{s.provKo>0?<span className="pz pz-sotto" style={{marginTop:3,display:"inline-block"}} title="fascia da definire">{s.provKo} da definire</span>:null}</span>);}},{l:"Margine effettivo €",num:true,eur:true,k:"_mrg",render:i=>{const s=stat[i.nome]||{};return(<span>{s.nmR?eur(s.mrgR):<span className="hint">—</span>}<span className="hint" style={{display:"block"}}>stima {eur(s.mrg||0)}</span></span>);}},{l:"Margine effettivo %",num:true,k:"_mp",render:i=>{const s=stat[i.nome]||{};const v=pctROf(s);const vs=pctOf(s);return(<span>{v===null?<span className="hint">—</span>:<span className={"mrg mrg-"+(v>=16?"ok":v>=8?"warn":"bad")}>{v.toFixed(1)}%</span>}{vs===null?null:<span className="hint" style={{display:"block"}}>stima {vs.toFixed(1)}%</span>}{s.nm>s.nmR?<span className="hint" style={{display:"block"}}>{s.nm-s.nmR} senza provvigione</span>:null}</span>);}},{l:"Disciplina prezzo",k:"_dz",render:i=>{const s=stat[i.nome]||{};return(<span>{s.sotto?<span className="pz pz-sotto" title="vendite sotto il minimo">{s.sotto} sotto</span>:null}{s.pieno?<span className="pz pz-pieno" style={{marginLeft:3}} title="vendite a listino pieno o oltre">{s.pieno} pieno</span>:null}{!s.sotto&&!s.pieno?<span className="hint">—</span>:null}</span>);}}]}
    form={(e,s)=>(<div className="form">{Fi(e,s,"Consulente","nome")}{Fi(e,s,"Ruolo","ruolo","text",RUOLI)}<div className="fld"><label>Capo area riferimento</label><select value={e.capoArea||""} onChange={ev=>s("capoArea",ev.target.value)}><option value=""></option>{db.consulenti.filter(x=>x.ruolo==="Capo Area").map(x=>(<option key={x.id}>{x.nome}</option>))}</select></div>{Fi(e,s,"Telefono","tel")}{Fi(e,s,"Email","email")}<div className="fld full"><label>Regioni di competenza</label><RegionSelect value={e.regioni} onChange={v=>s("regioni",v)}/></div></div>)}
    extra={<ProspettoProvv db={db} comp={comp}/>}
    onSave={x=>{up(d=>{const i=d.consulenti.findIndex(c=>c.id===x.id);delete x.__new;if(i>=0)d.consulenti[i]=x;else d.consulenti.push(x);return d;});flash("Consulente salvato");}}
    onDel={id=>{const nome=(db.consulenti.find(i=>i.id===id)||{}).nome;const n=db.pose.filter(p=>p.consulente===nome).length;if(!confirm(n?("Questo consulente è usato in "+n+" pratiche. Eliminarlo lascerà quei riferimenti orfani. Eliminare comunque?"):"Eliminare il consulente?"))return;up(d=>{d.consulenti=d.consulenti.filter(c=>c.id!==id);return d;});flash("Consulente eliminato");}}/>;
}

/* ---------- Zone ---------- */
function Zone({db,up,flash}){
  const [q,setQ]=useState("");
  const listOf=prov=>{const v=db.zoneMap[prov];return Array.isArray(v)?v.filter(Boolean):(v?[v]:[]);};
  const add=(prov,nome)=>up(d=>{const cur=Array.isArray(d.zoneMap[prov])?d.zoneMap[prov]:(d.zoneMap[prov]?[d.zoneMap[prov]]:[]);if(nome&&!cur.includes(nome))cur.push(nome);d.zoneMap[prov]=cur;return d;});
  const rem=(prov,nome)=>up(d=>{const cur=(Array.isArray(d.zoneMap[prov])?d.zoneMap[prov]:(d.zoneMap[prov]?[d.zoneMap[prov]]:[])).filter(x=>x!==nome);if(cur.length)d.zoneMap[prov]=cur;else delete d.zoneMap[prov];return d;});
  const move=(prov,ix,dir)=>up(d=>{const v=d.zoneMap[prov];const cur=Array.isArray(v)?[...v]:(v?[v]:[]);const j=ix+dir;if(j<0||j>=cur.length)return d;const t=cur[ix];cur[ix]=cur[j];cur[j]=t;d.zoneMap[prov]=cur;return d;});
  const assigned=ALL_PROV.filter(p=>listOf(p).length>0).length;
  return(<>
    <div className="filters"><input placeholder="Cerca provincia…" value={q} onChange={e=>setQ(e.target.value)}/>
      <div style={{flex:1}}/><span className="tag">{assigned}/{ALL_PROV.length} coperte</span></div>
    <div className="hint" style={{marginBottom:10}}>Puoi assegnare <b>più installatori</b> alla stessa provincia. Il primo della lista (★) è quello proposto in automatico sulle nuove pratiche: usa le frecce ↑↓ per cambiare l’ordine.</div>
    <div className="grid" style={{gap:14}}>
    {PROV.map(([reg,ps])=>{
      const rows=ps.filter(([n])=>!q||n.toLowerCase().includes(q.toLowerCase()));
      if(!rows.length)return null;
      return(<div className="card" key={reg}><h3>{reg}</h3><div className="tbl-wrap" style={{border:0,boxShadow:"none"}}>
        <table><thead><tr><th style={{width:170}}>Provincia</th><th style={{width:60}}>Sigla</th><th>Installatori</th></tr></thead>
        <tbody>{rows.map(([n,s])=>{
          const cur=listOf(n);const avail=db.installatori.filter(i=>!cur.includes(i.nome));
          return(<tr key={n}><td>{n}</td><td className="hint">{s}</td>
          <td style={{whiteSpace:"normal"}}>
            {cur.length>0&&<div style={{display:"flex",gap:5,flexWrap:"wrap",marginBottom:5}}>
              {cur.map((nm,ix)=>(<span key={nm} className="tag" style={{display:"inline-flex",gap:6,alignItems:"center"}}>{ix===0&&<b title="proposto in automatico">★</b>}{nm}{cur.length>1&&<span onClick={()=>{if(ix>0)move(n,ix,-1);}} title="sposta su" style={{cursor:ix>0?"pointer":"default",opacity:ix>0?1:.25,fontWeight:700}}>↑</span>}{cur.length>1&&<span onClick={()=>{if(ix<cur.length-1)move(n,ix,1);}} title="sposta giù" style={{cursor:ix<cur.length-1?"pointer":"default",opacity:ix<cur.length-1?1:.25,fontWeight:700}}>↓</span>}<span onClick={()=>rem(n,nm)} title="rimuovi" style={{cursor:"pointer",fontWeight:700}}>✕</span></span>))}
            </div>}
            <select value="" onChange={e=>{if(e.target.value)add(n,e.target.value);}} style={{padding:"6px 8px",border:"1px solid var(--line)",borderRadius:7,background:cur.length?"#fff":"#FDF6E9"}}>
              <option value="">{cur.length?"+ aggiungi installatore…":"— da coprire —"}</option>
              {avail.map(i=>(<option key={i.id}>{i.nome}</option>))}
            </select>
          </td></tr>);})}</tbody></table>
      </div></div>);
    })}
    </div>
  </>);
}

/* ---------- Tariffe ---------- */
function Tariffe({db,up,flash}){
  const upd=(kind,i,field,val)=>up(d=>{d.tariffe[kind][i][field]=field==="voce"||field==="config"||field==="prodotto"||field==="tipo"?val:(val===""?null:+val);return d;});
  const num=v=>v==null?"":v;
  return(<div className="grid" style={{gap:16}}>
    <div className="two">
      <div className="card"><h3>Compensi posa — Clima</h3><div className="tbl-wrap" style={{border:0,boxShadow:"none"}}><table><thead><tr><th>Configurazione</th><th className="num">Compenso €</th></tr></thead>
        <tbody>{db.tariffe.clima.map((x,i)=>(<tr key={i}><td>{x.config}</td><td className="num"><input className="mono" style={{width:90,textAlign:"right",border:"1px solid var(--line)",borderRadius:6,padding:"4px 6px"}} type="number" value={num(x.compenso)} onChange={e=>upd("clima",i,"compenso",e.target.value)}/></td></tr>))}</tbody></table></div></div>
      <div className="card"><h3>Compensi posa — Termico <span className="hint">per categoria</span></h3><div className="tbl-wrap" style={{border:0,boxShadow:"none"}}><table><thead><tr><th>Prodotto</th><th>Tipo</th><th className="num">Compenso €</th></tr></thead>
        <tbody>{db.tariffe.termico.map((x,i)=>(<tr key={i}><td>{x.prodotto}</td><td className="hint">{x.tipo}</td><td className="num"><input className="mono" style={{width:90,textAlign:"right",border:"1px solid var(--line)",borderRadius:6,padding:"4px 6px"}} type="number" value={num(x.compenso)} onChange={e=>upd("termico",i,"compenso",e.target.value)}/></td></tr>))}</tbody></table></div></div>
    </div>
    <div className="card"><h3>Lavorazioni extra <span className="hint">prezzo per mondo — vuoto = non applicabile</span></h3><div className="tbl-wrap" style={{border:0,boxShadow:"none"}}><table><thead><tr><th>Lavorazione</th><th className="num">€ Clima</th><th className="num">€ Termico</th></tr></thead>
      <tbody>{db.tariffe.extra.map((x,i)=>(<tr key={i}><td>{x.voce}</td>
        <td className="num"><input className="mono" style={{width:80,textAlign:"right",border:"1px solid var(--line)",borderRadius:6,padding:"4px 6px"}} type="number" value={num(x.clima)} onChange={e=>upd("extra",i,"clima",e.target.value)}/></td>
        <td className="num"><input className="mono" style={{width:80,textAlign:"right",border:"1px solid var(--line)",borderRadius:6,padding:"4px 6px"}} type="number" value={num(x.termico)} onChange={e=>upd("extra",i,"termico",e.target.value)}/></td></tr>))}</tbody></table></div>
      <div className="bd hint">Questi sono i <b>compensi all'installatore</b>: netti, IVA esclusa, di norma in reverse charge. Un extra vale solo dove ha un prezzo: su una posa clima le voci solo-termiche restano a 0, e viceversa.</div>
    </div>
    <div className="card"><h3>Prezzi di vendita extra <span className="hint">quanto paga il cliente — IVA 10% inclusa</span></h3><div className="tbl-wrap" style={{border:0,boxShadow:"none"}}><table>
      <thead><tr><th rowSpan={2}>Lavorazione</th><th className="num" colSpan={2}>Arquati</th><th className="num" colSpan={2}>Arquati ONE</th><th className="num" colSpan={2}>Costo posa</th></tr>
        <tr><th className="num">Clima</th><th className="num">Termico</th><th className="num">Clima</th><th className="num">Termico</th><th className="num">Clima</th><th className="num">Termico</th></tr></thead>
      <tbody>{(db.tariffe.extraVendita||[]).map((x,i)=>{const t=(db.tariffe.extra||[]).find(e=>e.voce===x.voce)||{};
        const C=(k)=>(<td className="num"><input className="mono" style={{width:74,textAlign:"right",border:"1px solid var(--line)",borderRadius:6,padding:"4px 6px"}} type="number" value={num(x[k])} onChange={e=>upd("extraVendita",i,k,e.target.value)}/></td>);
        return (<tr key={i}><td>{x.voce}</td>{C("arqC")}{C("arqT")}{C("oneC")}{C("oneT")}
        <td className="num hint">{t.clima||"—"}</td><td className="num hint">{t.termico||"—"}</td></tr>);})}</tbody></table></div>
      <div className="bd hint">Prezzi presi dai listini ufficiali rev. 04/06-26, <b>IVA 10% inclusa</b>. Cambiano con il listino e anche col mondo: la pagina accessori di caldaie e ibridi e quella dei climatizzatori hanno prezzi diversi per la stessa voce. Le due colonne di destra sono il costo di posa, netto, solo per confronto. Vuoto = voce non prevista lì: sulla pratica l'importo va scritto a mano e l'app lo segnala.</div>
    </div>
  </div>);
}

/* ---------- Margini ---------- */
function Margini({db,setDb,comp,openPose,flash}){
  const [vista,setVista]=useState("pratiche");
  const [tab2,setTab2]=useState("clima");
  const K=db.costi||DEF_COSTI();
  const setK=(k,v)=>setDb({...db,costi:{...K,[k]:v}});
  const setCampo=(tipo,key,campo,val)=>{
    const arr=(K[tipo]||[]).map(x=>((tipo==="clima"?x.config:x.prodotto)===key?{...x,[campo]:val}:x));
    setDb({...db,costi:{...K,[tipo]:arr}});
  };

  /* solo pratiche vive: i recessi non hanno margine da analizzare */
  const vive=comp.filter(({c})=>c.fase&&c.fase!=="RECESSO");
  const calcolabili=vive.filter(({c})=>c.margine.ok);
  const incomplete=vive.filter(({c})=>!c.margine.ok);
  const tot=calcolabili.reduce((a,{c})=>({net:a.net+c.margine.netto,cost:a.cost+c.margine.costoTot,mrg:a.mrg+c.margine.eur}),{net:0,cost:0,mrg:0});
  const pctMedio=tot.net>0?(tot.mrg/tot.net*100):0;

  /* quali dati mancano più spesso: dice da dove partire */
  const freq={};
  incomplete.forEach(({c})=>c.margine.mancano.forEach(m=>{
    const k=m.replace(/«[^»]*»/,"«…»");   // raggruppa per tipo di dato, non per singolo prodotto
    freq[k]=(freq[k]||0)+1;
  }));
  const mancanti=Object.entries(freq).sort((a,b)=>b[1]-a[1]);

  const righe=[...calcolabili].sort((a,b)=>a.c.margine.pct-b.c.margine.pct); // i peggiori in cima
  const sottoSoglia=calcolabili.filter(({c})=>c.margine.pct<(+K.sogliaAllerta||8)).length;
  /* posizionamento di prezzo sul portafoglio */
  const sottoCodice=vive.filter(({c})=>c.margine.posizione==="sotto");
  const scontoTot=sottoCodice.reduce((s,{c})=>s+c.margine.scontoEur,0);
  const aPieno=vive.filter(({c})=>c.margine.posizione==="pieno").length;
  const inForbice=vive.filter(({c})=>c.margine.posizione==="base").length;
  const extraTotale=vive.reduce((s,{c})=>s+(c.margine.sopraCodice>0?c.margine.sopraCodice:0),0);
  /* controllo extra: chi ha venduto con lavorazioni extra e come è andata a finire */
  const conExtra=vive.filter(({c})=>c.margine.extraCliente>0||c.margine.fattura!==null);
  const inAttesa=conExtra.filter(({c})=>c.margine.fattura===null);
  const scoperti=conExtra.filter(({c})=>c.margine.extraStato==="sotto");
  const buchiEur=scoperti.reduce((s,{c})=>s+c.margine.scostamento,0);
  const extraIncassati=conExtra.reduce((s,{c})=>s+c.margine.extraCliente,0);
  const extraPagati=conExtra.reduce((s,{c})=>s+(c.margine.extraFatturato||0),0);
  const attesaEur=inAttesa.reduce((s,{c})=>s+c.margine.extraCliente,0);
  /* per installatore: chi fattura sistematicamente più di quanto il consulente ha fatto pagare */
  const perInst=(()=>{
    const m={};
    conExtra.forEach(({p,c})=>{
      const k=c.effInst||"— non assegnato";
      if(!m[k])m[k]={inst:k,n:0,inc:0,fatt:0,scost:0,attesa:0};
      m[k].n++;m[k].inc+=c.margine.extraCliente;
      if(c.margine.fattura===null)m[k].attesa++;
      else{m[k].fatt+=c.margine.extraFatturato;m[k].scost+=c.margine.scostamento;}
    });
    return Object.values(m).sort((a,b)=>b.scost-a.scost);
  })();

  return(<div className="grid" style={{gap:16}}>
    {incomplete.length>0&&<div className="card" style={{borderColor:"#E9B3A4"}}><h3 style={{color:"#A93A1B"}}>⚠ {incomplete.length} {incomplete.length===1?"pratica":"pratiche"} senza margine calcolabile</h3><div className="bd">
      <p className="hint">Su {vive.length} pratiche attive, {calcolabili.length} hanno il margine e {incomplete.length} no. Ecco cosa manca, dal più frequente:</p>
      <div className="tbl-wrap" style={{boxShadow:"none",border:0,marginTop:8}}>
        <table><thead><tr><th>Dato mancante</th><th className="num">Pratiche</th></tr></thead>
        <tbody>{mancanti.map(([m,n])=>(<tr key={m}><td>{m}</td><td className="num"><b>{n}</b></td></tr>))}</tbody></table>
      </div>
      <p className="hint" style={{marginTop:10}}>Sotto, nella scheda <b>Pratiche incomplete</b>, trovi l'elenco: tocca una riga per aprirla e completarla.</p>
    </div></div>}

    <div className="two">
      <div className="card"><h3>Quadro margini</h3><div className="bd">
        <div className="grid kpis">
          <div className="kpi"><div className="k">Venduto netto</div><div className="v mono">{eur(tot.net)}</div></div>
          <div className="kpi"><div className="k">Costi totali</div><div className="v mono">{eur(tot.cost)}</div></div>
          <div className="kpi"><div className="k">Margine</div><div className="v mono">{eur(tot.mrg)}</div></div>
          <div className="kpi"><div className="k">Margine medio</div><div className="v mono"><span className={"mrg mrg-"+(pctMedio>=(+K.sogliaOk||16)?"ok":pctMedio>=(+K.sogliaAllerta||8)?"warn":"bad")}>{pctMedio.toFixed(1)}%</span></div></div>
        </div>
        {sottoSoglia>0&&<p className="hint" style={{marginTop:10,color:"var(--accent)",fontWeight:600}}>{sottoSoglia} {sottoSoglia===1?"pratica":"pratiche"} sotto il {K.sogliaAllerta}% di margine.</p>}
        {(sottoCodice.length||aPieno||inForbice)>0&&<div style={{marginTop:12,borderTop:"1px solid var(--line)",paddingTop:10}}>
          <div className="sec" style={{marginTop:0}}>Posizionamento di prezzo</div>
          <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:8}}>
            {sottoCodice.length>0&&<span className="pz pz-sotto">{sottoCodice.length} sotto il codice</span>}
            {inForbice>0&&<span className="pz pz-base">{inForbice} nella forbice</span>}
            {aPieno>0&&<span className="pz pz-pieno">{aPieno} a listino pieno o oltre</span>}
          </div>
          {sottoCodice.length>0&&<p className="hint" style={{color:"var(--accent)",fontWeight:600,margin:0}}>{eur(scontoTot)} venduti sotto il pavimento: è margine regalato, arriva tutto sulla riga del profitto.</p>}
          <p className="hint" style={{marginTop:6,marginBottom:0}}>Sopra il prezzo codice il portafoglio ha portato <b>{eur(extraTotale)}</b> in più. Il listino è un riferimento, non un tetto: chi vende oltre va premiato.</p>
        </div>}
        <p className="hint" style={{marginTop:10}}>Stesso modello di costo del configuratore: materiali, trasporto, posa, omaggio, provvigioni, costi generali e costo lead. Calcolato su {calcolabili.length} pratiche; recessi e pratiche incomplete restano fuori.</p>
      </div></div>

      <div className="card"><h3>Parametri</h3><div className="bd">
        <div className="form" style={{gridTemplateColumns:"1fr 1fr"}}>
          <div className="fld"><label>IVA sull'importo vendita %</label><input type="number" value={K.ivaPct} onChange={e=>setK("ivaPct",e.target.value)}/></div>
          <div className="fld"><label>Regime IVA predefinito installatori</label><select value={K.regimeInstDef} onChange={e=>setK("regimeInstDef",e.target.value)}>{REGIMI.map(([r])=>(<option key={r}>{r}</option>))}</select></div>
          <div className="fld"><label>Tolleranza scostamento extra %</label><input type="number" value={K.tolleranzaExtra} onChange={e=>setK("tolleranzaExtra",e.target.value)}/></div>
          <div className="fld"><label>Quota extra addebitata al consulente %</label><input type="number" value={K.addebitoExtraPct} onChange={e=>setK("addebitoExtraPct",e.target.value)}/></div>
          <div className="fld"><label>Addebita solo la parte oltre tolleranza</label><select value={K.addebitoOltreTolleranza?"Sì":"No"} onChange={e=>setK("addebitoOltreTolleranza",e.target.value==="Sì")}><option>No</option><option>Sì</option></select></div>
          <div className="fld"><label>Costo del clima omaggio €</label><input type="number" value={K.valoreOmaggio} onChange={e=>setK("valoreOmaggio",e.target.value)}/></div>
          <div className="fld"><label>Installazione omaggio — quota installatore €</label><input type="number" value={K.omaggioCompenso} onChange={e=>setK("omaggioCompenso",e.target.value)}/></div>
          <div className="fld"><label>Installazione Mono 9000 omaggio — prezzo al cliente €</label><input type="number" value={K.omaggioPrezzoInst} onChange={e=>setK("omaggioPrezzoInst",e.target.value)}/></div>
          <div className="fld"><label>Soglia margine buono %</label><input type="number" value={K.sogliaOk} onChange={e=>setK("sogliaOk",e.target.value)}/></div>
          <div className="fld"><label>Soglia allerta %</label><input type="number" value={K.sogliaAllerta} onChange={e=>setK("sogliaAllerta",e.target.value)}/></div>
        </div>
        <p className="hint" style={{marginTop:8}}>Il costo di posa non si imposta qui: viene preso dalla <b>fattura dell'installatore</b> quando c'è, altrimenti dal compenso calcolato a tariffa. <b>Tutti i costi sono IVA esclusa</b>: compensi posa, extra e materiali sono imponibili. L'IVA sulle fatture installatori è detraibile, quindi neutra sul margine — in reverse charge non c'è proprio. Gli unici importi ivati sono i prezzi di vendita al cliente.</p>
        <div className="sec">Costi a pratica (come nel configuratore)</div>
        <div className="form" style={{gridTemplateColumns:"1fr 1fr"}}>
          <div className="fld"><label>Provvigioni % di stima (sul netto)</label><input type="number" value={K.provvigioniPct} onChange={e=>setK("provvigioniPct",e.target.value)}/></div>
          <div className="fld"><label>Costo lead / marketing € a pratica</label><input type="number" value={K.marketing} onChange={e=>setK("marketing",e.target.value)}/></div>
          <div className="fld"><label>Costi generali € a pratica</label><input type="number" value={K.costiGenerali} onChange={e=>setK("costiGenerali",e.target.value)}/></div>
        </div>
        <p className="hint" style={{marginTop:8}}>Sono i costi che ogni pratica si porta dietro: il lead che l'ha generata, la quota di costi generali e le provvigioni. Vengono già tolti dal margine. La <b>% di stima</b> serve al margine di massima: la provvigione vera, a fasce, è quella qui sotto e la trovi nel margine effettivo in Consulenti.</p>

        <div className="sec">Scala provvigionale consulenti <span className="hint">Allegato E1_04.26</span></div>
        <div className="tbl-wrap" style={{border:0,boxShadow:"none"}}><table>
          <thead><tr><th>Da % sopra il prezzo codice</th><th className="num">% provvigionale</th></tr></thead>
          <tbody>{(K.provvScala||[]).map((r,i)=>(<tr key={i}>
            <td><input className="mono" style={{width:80,textAlign:"right",border:"1px solid var(--line)",borderRadius:6,padding:"4px 6px"}} type="number" value={r.min} onChange={e=>{const a=(K.provvScala||[]).map((x,ix)=>ix===i?{...x,min:e.target.value}:x);setK("provvScala",a);}}/> %</td>
            <td className="num"><input className="mono" style={{width:80,textAlign:"right",border:"1px solid var(--line)",borderRadius:6,padding:"4px 6px"}} type="number" value={r.pct} onChange={e=>{const a=(K.provvScala||[]).map((x,ix)=>ix===i?{...x,pct:e.target.value}:x);setK("provvScala",a);}}/> %</td>
          </tr>))}</tbody></table></div>
        <div className="form" style={{gridTemplateColumns:"1fr 1fr",marginTop:10}}>
          <div className="fld"><label>Integrazione contatti personali (punti)</label><input type="number" value={K.provvIntegrazione} onChange={e=>setK("provvIntegrazione",e.target.value)}/></div>
          <div className="fld"><label>IVA da scorporare per l'imponibile provvigioni %</label><input type="number" value={K.provvIvaPct} onChange={e=>setK("provvIvaPct",e.target.value)}/></div>
        </div>
        <p className="hint" style={{marginTop:8}}>La fascia si legge dallo scostamento del <b>prezzo prodotto</b> sopra il prezzo codice; la percentuale si applica a quel prezzo <b>scorporato dell'IVA</b>, senza lavorazioni extra né i {eur(+K.omaggioPrezzoInst||0)} dell'omaggio installato. Sotto codice non c'è fascia: serve autorizzazione e la % si scrive a mano sulla singola pratica.</p>
      </div></div>
    </div>

    <div className="card"><h3>Lavorazioni extra — incassato vs fatturato <span className="tag">{conExtra.length}</span></h3><div className="bd">
      <p className="hint">Quando il consulente vende a più del codice, spesso quella differenza sono lavorazioni extra che l'installatore poi rifattura. Qui vedi se i conti tornano.</p>
      {conExtra.length===0?<div className="empty"><div className="hint">Nessuna pratica con lavorazioni extra indicate.</div></div>:<>
        <div className="kpis" style={{marginTop:10}}>
          <div className="kpi"><div className="k">Extra incassati dai clienti</div><div className="v mono">{eur(extraIncassati)}</div></div>
          <div className="kpi"><div className="k">Extra fatturati dagli installatori</div><div className="v mono">{eur(extraPagati)}</div></div>
          <div className="kpi"><div className="k">Fatture ancora da ricevere</div><div className="v mono">{inAttesa.length}</div></div>
          <div className="kpi"><div className="k">Non coperti</div><div className="v mono" style={{color:buchiEur>0?"var(--accent)":"inherit"}}>{eur(buchiEur)}</div></div>
        </div>
        {attesaEur>0&&<p className="hint" style={{marginTop:10}}>{eur(attesaEur)} di extra incassati su {inAttesa.length} pratiche di cui non è ancora arrivata la fattura: quel margine non è ancora confermato.</p>}
        {buchiEur>0&&<p className="hint" style={{marginTop:6,color:"var(--accent)",fontWeight:600}}>{eur(buchiEur)} fatturati in più di quanto incassato su {scoperti.length} {scoperti.length===1?"pratica":"pratiche"}: margine eroso.</p>}
        <div className="tbl-wrap" style={{boxShadow:"none",border:0,marginTop:12,overflowX:"auto"}}>
          <table><thead><tr><th>Contratto</th><th>Cliente</th><th>Consulente</th><th>Installatore</th><th className="num">Venduto</th><th className="num">di cui extra</th><th className="num">Prezzo prodotto</th><th className="num">Posizione</th><th className="num">Fattura</th><th className="num">Extra fatturati</th><th className="num">Scostamento</th></tr></thead>
          <tbody>{conExtra.slice().sort((a,b)=>(b.c.margine.scostamento||-1e9)-(a.c.margine.scostamento||-1e9)).map(({p,c})=>(
            <tr key={p.id} onClick={()=>openPose(structuredClone(p))} style={{cursor:"pointer"}}>
              <td><b>{p.nContratto||"—"}</b></td><td>{c.cliente}</td><td className="hint">{p.consulente||"—"}</td><td className="hint">{c.effInst||"—"}</td>
              <td className="num eur">{eur(+p.importoVendita||0)}</td>
              <td className="num eur">{eur(c.margine.extraCliente)}</td>
              <td className="num eur">{eur(c.margine.prezzoProdotto)}</td>
              <td className="num">{c.margine.posizione?<span className={"pz pz-"+c.margine.posizione}>{c.margine.posizione==="sotto"?"sotto codice":c.margine.posizione==="pieno"?"listino+":"sopra codice"}</span>:<span className="hint">—</span>}</td>
              <td className="num eur">{c.margine.fattura===null?<span className="ex ex-attesa">attesa</span>:<><span title={"totale "+eur(c.margine.fattLordo||0)+" · imponibile "+eur(c.margine.fattura)}>{eur(c.margine.fattura)}</span>{(p.fattFiles||[]).length>0&&<span title="fattura allegata" style={{marginLeft:4}}>📎</span>}</>}</td>
              <td className="num eur">{c.margine.extraFatturato===null?"—":eur(c.margine.extraFatturato)}</td>
              <td className="num">{c.margine.scostamento===null?<span className="hint">—</span>:<span className={"ex ex-"+c.margine.extraStato}>{c.margine.scostamento>0?"+":""}{eur(c.margine.scostamento)}</span>}</td>
            </tr>))}
          </tbody></table>
        </div>
        <p className="hint" style={{marginTop:10}}>Scostamento <b>positivo</b> = l'installatore ha fatturato più di quanto hai fatto pagare al cliente. È la cifra da mostrare all'amministrazione quando chiede perché quella vendita a 7.000 non ha reso come una a 7.000 pulita.</p>
        {perInst.length>1&&<>
          <div className="sec" style={{marginTop:16}}>Per installatore</div>
          <div className="tbl-wrap" style={{boxShadow:"none",border:0}}>
            <table><thead><tr><th>Installatore</th><th className="num">Pratiche</th><th className="num">Extra incassati</th><th className="num">Extra fatturati</th><th className="num">Scostamento</th><th className="num">In attesa</th></tr></thead>
            <tbody>{perInst.map(x=>(<tr key={x.inst}>
              <td>{x.inst}</td><td className="num">{x.n}</td>
              <td className="num eur">{eur(x.inc)}</td><td className="num eur">{eur(x.fatt)}</td>
              <td className="num">{x.scost===0?<span className="hint">—</span>:<span className={"ex ex-"+(x.scost>0?"sotto":"sopra")}>{x.scost>0?"+":""}{eur(x.scost)}</span>}</td>
              <td className="num">{x.attesa||""}</td>
            </tr>))}</tbody></table>
          </div>
          <p className="hint" style={{marginTop:8}}>Se un installatore compare sempre in rosso, o rincara in fattura o i consulenti sottostimano gli extra quando lavorano con lui. In entrambi i casi è una conversazione da fare.</p>
        </>}
      </>}
    </div></div>

    <div className="card"><h3>Listini e costi materiali</h3><div className="bd">
      <p className="hint">Prezzi <b>ivati</b> dai listini ufficiali Arquati Ecoliving e ARQUATIONE. I campi in rosso sono vuoti e bloccano il calcolo del margine o del posizionamento di prezzo.</p>
      <div style={{display:"flex",gap:9,marginTop:10,marginBottom:8}}>
        <button className={"btn "+(tab2==="clima"?"":"gh")+" sm"} onClick={()=>setTab2("clima")}>Clima ({(K.clima||[]).length})</button>
        <button className={"btn "+(tab2==="termico"?"":"gh")+" sm"} onClick={()=>setTab2("termico")}>Termico ({(K.termico||[]).length})</button>
      </div>
      <div className="tbl-wrap" style={{boxShadow:"none",border:0,overflowX:"auto"}}>
        <table><thead>
          <tr><th rowSpan={2}>{tab2==="clima"?"Configurazione":"Prodotto"}</th><th className="num" rowSpan={2} style={{width:100}}>Materiali €</th>
            <th className="num" colSpan={4} style={{borderLeft:"2px solid var(--line)"}}>ARQUATI</th>
            <th className="num" colSpan={4} style={{borderLeft:"2px solid var(--line)"}}>ARQUATI ONE</th></tr>
          <tr><th className="num" style={{borderLeft:"2px solid var(--line)"}}>Codice</th><th className="num">Listino</th><th className="num">Cod. c/om.</th><th className="num">List. c/om.</th>
              <th className="num" style={{borderLeft:"2px solid var(--line)"}}>Codice</th><th className="num">Listino</th><th className="num">Cod. c/om.</th><th className="num">List. c/om.</th></tr>
        </thead>
        <tbody>{(K[tab2]||[]).map(x=>{
          const key=tab2==="clima"?x.config:x.prodotto;
          /* segnala le righe dove il listino stesso è incoerente: codice ≥ listino,
             oppure ONE non superiore ad Arquati. Sono refusi da verificare col fornitore. */
          const anom=[];
          if(+x.cod&&+x.lis&&+x.cod>=+x.lis)anom.push("Arquati: codice ≥ listino");
          if(+x.oneCod&&+x.oneLis&&+x.oneCod>=+x.oneLis)anom.push("ONE: codice ≥ listino");
          if(+x.cod&&+x.oneCod&&+x.oneCod<=+x.cod)anom.push("ONE non superiore ad Arquati");
          const cell=(campo,bordo)=>(<td className="num" style={bordo?{borderLeft:"2px solid var(--line)"}:{}}>
            <input type="number" value={x[campo]} onChange={e=>setCampo(tab2,key,campo,e.target.value)}
              style={{width:88,textAlign:"right",padding:"5px 6px",fontSize:12.5,border:"1px solid "+(x[campo]===""?"#E9B3A4":"var(--line)"),borderRadius:7,background:x[campo]===""?"#FFF7F5":"#fff"}}/></td>);
          return(<tr key={key}>
            <td style={{whiteSpace:"nowrap"}}>{key}{anom.length>0&&<div><span className="flag" title={anom.join(" · ")} style={{marginTop:3,display:"inline-block",background:"#FBE0DC",color:"#A93A1B"}}>⚠ dato da verificare</span></div>}</td>
            {cell("materiali")}
            {cell("cod",true)}{cell("lis")}{cell("codOm")}{cell("lisOm")}
            {cell("oneCod",true)}{cell("oneLis")}{cell("oneCodOm")}{cell("oneLisOm")}
          </tr>);})}
        </tbody></table>
      </div>
      <p className="hint" style={{marginTop:10}}>I <b>prezzi codice</b> sono quelli scritti nei listini dentro <span className="mono">COD.000.xxxx</span>: per un Mono 9.000 Arquati, <span className="mono">COD.000.3300</span> significa che sotto <b>3.300 €</b> non si vende. Caricati tutti da entrambi i listini, con e senza omaggio. I <b>costi materiali</b> del termico invece non li avevamo da nessuna parte: senza quelli il margine su caldaie, ibridi e scaldacqua non si calcola.</p>
    </div></div>

    <div className="card"><h3>Dettaglio pratiche</h3>
      <div className="bd" style={{paddingBottom:0}}>
        <div style={{display:"flex",gap:9}}>
          <button className={"btn "+(vista==="pratiche"?"":"gh")+" sm"} onClick={()=>setVista("pratiche")}>Con margine ({calcolabili.length})</button>
          <button className={"btn "+(vista==="incomplete"?"":"gh")+" sm"} onClick={()=>setVista("incomplete")}>Pratiche incomplete ({incomplete.length})</button>
        </div>
      </div>
      <div className="tbl-wrap" style={{boxShadow:"none",border:0}}>
        {vista==="pratiche"?
        <table><thead><tr><th>Contratto</th><th>Cliente</th><th>Prodotti</th><th className="num">Venduto netto</th><th className="num">Prezzo</th><th className="num">Costi</th><th className="num">Margine €</th><th className="num">Margine %</th></tr></thead>
        <tbody>{righe.length===0?<tr><td colSpan={8}><div className="empty"><div className="hint">Nessuna pratica con margine calcolabile.</div></div></td></tr>:
          righe.map(({p,c})=>(<tr key={p.id} onClick={()=>openPose(structuredClone(p))} style={{cursor:"pointer"}}>
            <td><b>{p.nContratto||"—"}</b>{p.listino==="Arquati ONE"&&<div><span className="pz pz-base" style={{marginTop:3,display:"inline-block"}}>ONE</span></div>}</td><td>{c.cliente}</td>
            <td className="hint">{[...c.climaList,c.termProd&&c.termProd.prodotto].filter(Boolean).join(", ")||"—"}</td>
            <td className="num eur">{eur(c.margine.netto)}</td>
            <td className="num">{c.margine.posizione?<span className={"pz pz-"+c.margine.posizione}>{c.margine.posizione==="sotto"?"sotto codice":c.margine.posizione==="pieno"?"listino+":"in forbice"}</span>:<span className="hint">—</span>}</td>
            <td className="num eur">{eur(c.margine.costoTot)}</td>
            <td className="num eur">{eur(c.margine.eur)}</td>
            <td className="num"><span className={"mrg mrg-"+c.margine.cls}>{c.margine.pct.toFixed(1)}%</span></td>
          </tr>))}
        </tbody></table>
        :
        <table><thead><tr><th>Contratto</th><th>Cliente</th><th>Fase</th><th>Cosa manca</th></tr></thead>
        <tbody>{incomplete.length===0?<tr><td colSpan={4}><div className="empty"><div className="hint">Tutte le pratiche attive hanno il margine calcolato.</div></div></td></tr>:
          incomplete.map(({p,c})=>(<tr key={p.id} onClick={()=>openPose(structuredClone(p))} style={{cursor:"pointer"}}>
            <td><b>{p.nContratto||"—"}</b></td><td>{c.cliente}</td>
            <td><span className={"pill "+FCLASS(c.fase)}>{c.fase}</span></td>
            <td>{c.margine.mancano.map((m,i)=>(<div key={i} className="hint" style={{color:"#A93A1B",fontWeight:600,fontSize:11.5}}>• {m}</div>))}</td>
          </tr>))}
        </tbody></table>}
      </div>
    </div>
  </div>);
}

/* ---------- Importa da foto ---------- */
const TIPI=[
  ["posa","Contratto di vendita","Il contratto firmato dal cliente, anche fotografato o scritto a mano. Crea la PRATICA e, se il cliente non c'è ancora in anagrafica, crea anche il CLIENTE con i suoi recapiti. Una riga per ogni contratto presente nel documento."],
  ["cliente","Solo anagrafica cliente","Visura camerale, carta d'identità o scheda cliente: crea o aggiorna solo l'anagrafica, nessuna pratica."],
  ["installatore","Installatori","Ditte installatrici."],
  ["consulente","Consulenti","Rete vendita."]
];
const COLS={
  posa:[["nContratto","N. contratto"],["cliente","Cliente"],["dataVendita","Presa contratto"],["importoVendita","Importo €"],["clima1","Clima"],["termico","Termico"],["listino","Listino"],["cliTel","Tel. cliente"],["cliComune","Comune"],["vex1","Extra 1"],["vq1","Q.tà"],["vex2","Extra 2"],["vq2","Q.tà"],["extraPrezzoCliente","di cui extra"],["finestraDa","Periodo dal"],["finestraA","Periodo al"],["consulente","Consulente"],["installatore","Installatore"],["dataPrevista","Posa prevista"],["note","Note"]],
  cliente:[["nome","Denominazione"],["referente","Referente"],["tel","Telefono"],["email","Email"],["indirizzo","Indirizzo"],["comune","Comune / Paese"],["provincia","Provincia"],["cap","CAP"],["piva","P.IVA / CF"],["note","Note"]],
  installatore:[["nome","Ragione sociale"],["referente","Referente"],["tel","Telefono"],["email","Email"],["piva","P.IVA"],["regioni","Regioni"]],
  consulente:[["nome","Nome"],["ruolo","Ruolo"],["capoArea","Capo area"],["tel","Telefono"],["email","Email"],["regioni","Regioni"]]
};
const norm=s=>String(s||"").trim().toLowerCase().replace(/\s+/g," ");

function Importa({db,setDb,flash}){
  const [ai,setAi]=useState(loadAi);
  const [tipo,setTipo]=useState("posa");
  const [files,setFiles]=useState([]);
  const [rows,setRows]=useState([]);
  const [busy,setBusy]=useState("");
  const [err,setErr]=useState("");
  const camRef=useRef(),fileRef=useRef();
  useEffect(()=>saveAi(ai),[ai]);

  const addFiles=e=>{
    const f=Array.from(e.target.files||[]);
    setFiles(x=>[...x,...f.map(file=>({file,url:file.type==="application/pdf"?"":URL.createObjectURL(file)}))]);
    e.target.value="";
  };
  const rmFile=i=>setFiles(x=>x.filter((_,k)=>k!==i));

  /* rileva se il record esiste gia': non tocchiamo mai i dati presenti, li segnaliamo */
  const dupOf=(t,r)=>{
    if(t==="posa")return r.nContratto&&db.pose.some(p=>norm(p.nContratto)===norm(r.nContratto));
    if(t==="cliente")return r.nome&&db.clienti.some(c=>norm(c.nome)===norm(r.nome));
    if(t==="installatore")return r.nome&&db.installatori.some(c=>norm(c.nome)===norm(r.nome));
    return r.nome&&db.consulenti.some(c=>norm(c.nome)===norm(r.nome));
  };

  const leggi=async()=>{
    if(!aiOn(ai)){setErr("Manca la chiave API: configurala qui sotto.");return;}
    if(!files.length){setErr("Aggiungi almeno una foto o un PDF.");return;}
    setErr("");
    const out=[];const problemi=[];
    for(let i=0;i<files.length;i++){
      setBusy("Leggo documento "+(i+1)+" di "+files.length+"…");
      try{
        const arr=await aiExtract(ai,files[i].file,tipo,db);
        arr.forEach(r=>out.push({...r,_src:files[i].file.name,_dup:dupOf(tipo,r)}));
      }catch(e){
        problemi.push("Documento "+(i+1)+": "+e.message);
      }
    }
    setBusy("");
    // i duplicati partono deselezionati: si inseriscono solo se lo decidi tu
    setRows(out.map(r=>({...r,_on:!r._dup})));
    if(problemi.length)setErr(problemi.join(" — "));
    else if(!out.length)setErr("Nessun dato riconosciuto nei documenti.");
  };

  const setCell=(i,k,v)=>setRows(rs=>rs.map((r,x)=>x===i?{...r,[k]:v}:r));
  const toggle=i=>setRows(rs=>rs.map((r,x)=>x===i?{...r,_on:!r._on}:r));

  /* quante anagrafiche nasceranno da questo import: utile saperlo PRIMA di confermare */
  const nuoviClienti=tipo!=="posa"?0:rows.filter(r=>r._on&&r.cliente&&!db.clienti.some(c=>norm(c.nome)===norm(r.cliente))).length;
  /* CONFERMA: qui e solo qui si scrive nel gestionale, sempre in aggiunta */
  const conferma=()=>{
    const sel=rows.filter(r=>r._on);
    if(!sel.length){setErr("Nessuna riga selezionata.");return;}
    const batch="imp_"+uid();
    const d=structuredClone(db);
    if(!Array.isArray(d.imports))d.imports=[];
    const meta={batch,at:new Date().toISOString(),tipo,n:sel.length,clienti:0};
    const stamp=o=>({...o,id:uid(),source:"import",batch,importedAt:today()});
    /* la voce letta vale solo se esiste davvero a tariffario: niente voci inventate */
    const vociOk=(v,dd)=>(v&&(dd.tariffe.extra||[]).some(x=>x.voce===v))?v:"";

    if(tipo==="posa"){
      sel.forEach(r=>{
        let cli=d.clienti.find(c=>norm(c.nome)===norm(r.cliente));
        if(!cli&&r.cliente){ // cliente sconosciuto: si crea con quello che il contratto dice
          const manca=["cliTel","cliIndirizzo","cliComune"].filter(k=>!r[k]).length;
          cli=stamp({nome:r.cliente,referente:r.cliReferente||"",tel:r.cliTel||"",email:r.cliEmail||"",
            indirizzo:r.cliIndirizzo||"",comune:r.cliComune||"",provincia:(r.cliProvincia||"").toUpperCase().slice(0,2),
            cap:r.cliCap||"",piva:(r.cliCF||"").toUpperCase().replace(/\s/g,""),note:manca?"Creato da import — anagrafica da completare":"Creato da import"});
          d.clienti.push(cli);meta.clienti++;
        }
        const p=emptyPose();
        d.pose.push(stamp({...p,
          nContratto:r.nContratto||"",clienteId:cli?cli.id:"",
          consulente:d.consulenti.some(c=>c.nome===r.consulente)?r.consulente:"",
          installatore:d.installatori.some(c=>c.nome===r.installatore)?r.installatore:"",
          dataVendita:r.dataVendita||"",dataApp:r.dataApp||"",
          importoVendita:r.importoVendita||"",
          clima1:r.clima1||"",clima2:r.clima2||"",clima3:r.clima3||"",clima4:r.clima4||"",
          termico:r.termico||"",dataPrevista:r.dataPrevista||"",dataInstallazione:r.dataInstallazione||"",
          listino:LISTINI.includes(r.listino)?r.listino:"",extraPrezzoCliente:r.extraPrezzoCliente||"",
          vex1:vociOk(r.vex1,d),vq1:r.vex1?(r.vq1||"1"):"",vp1:r.vex1?(r.vp1||""):"",
          vex2:vociOk(r.vex2,d),vq2:r.vex2?(r.vq2||"1"):"",vp2:r.vex2?(r.vp2||""):"",
          vex3:vociOk(r.vex3,d),vq3:r.vex3?(r.vq3||"1"):"",vp3:r.vex3?(r.vp3||""):"",
          vex4:vociOk(r.vex4,d),vq4:r.vex4?(r.vq4||"1"):"",vp4:r.vex4?(r.vp4||""):"",
          vex5:vociOk(r.vex5,d),vq5:r.vex5?(r.vq5||"1"):"",vp5:r.vex5?(r.vp5||""):"",finestraDa:r.finestraDa||"",finestraA:r.finestraA||"",
          finestraTipo:(r.finestraDa&&r.finestraA)?((r.finestraDa.slice(8)==="01"&&r.finestraA===meseEnd(r.finestraDa.slice(0,7)))?"mese":"periodo"):"",
          note:[r.note,r.installatore&&!d.installatori.some(c=>c.nome===r.installatore)?"Installatore letto: "+r.installatore:""].filter(Boolean).join(" · ")
        }));
      });
    }else{
      const arr=tipo==="cliente"?d.clienti:(tipo==="installatore"?d.installatori:d.consulenti);
      sel.forEach(r=>{
        const o={};COLS[tipo].forEach(([k])=>{o[k]=k==="regioni"?(Array.isArray(r[k])?r[k]:String(r[k]||"").split(/[,;]/).map(s=>s.trim()).filter(Boolean)):(r[k]||"");});
        arr.push(stamp(o));
      });
    }
    d.imports.push(meta);
    setDb(d);setRows([]);setFiles([]);
    flash(sel.length+" record inseriti"+(meta.clienti?" (+"+meta.clienti+" clienti nuovi)":""));
  };

  /* ANNULLA LOTTO: rimuove solo cio' che quell'import aveva aggiunto */
  const annulla=b=>{
    if(!confirm("Rimuovere i "+b.n+" record inseriti con questo import? I dati inseriti a mano non vengono toccati."))return;
    const d=structuredClone(db);
    ["clienti","installatori","consulenti","pose"].forEach(k=>{d[k]=d[k].filter(x=>x.batch!==b.batch);});
    d.imports=(d.imports||[]).filter(x=>x.batch!==b.batch);
    setDb(d);flash("Import annullato");
  };

  const cols=COLS[tipo];
  const nSel=rows.filter(r=>r._on).length;
  const storia=(db.imports||[]).slice().reverse();

  return(<div className="grid" style={{gap:16}}>
    <div className="card"><h3>1 · Che cosa stai fotografando?</h3><div className="bd">
      <div style={{display:"flex",gap:9,flexWrap:"wrap"}}>
        {TIPI.map(([k,lab,sub])=>(
          <button key={k} className={"btn "+(tipo===k?"":"gh")} onClick={()=>{setTipo(k);setRows([]);setErr("");}} title={sub}>{lab}</button>
        ))}
      </div>
      <p className="hint" style={{marginTop:10}}>{(TIPI.find(t=>t[0]===tipo)||[])[2]}</p>
      {tipo==="posa"&&<div style={{marginTop:10,background:"#F7F9F6",border:"1px solid var(--line)",borderRadius:10,padding:"10px 12px"}}>
        <b style={{fontSize:12.5}}>Da un contratto nascono due cose</b>
        <div className="hint" style={{marginTop:5,lineHeight:1.7}}>
          <div><b>1. Il cliente</b> — creato solo se il nome non esiste già in anagrafica, con recapiti e indirizzo letti dal contratto. Se esiste, la pratica si aggancia a quello e l'anagrafica non viene toccata.</div>
          <div><b>2. La pratica</b> — contratto, consulente, importo, listino, prodotti configurati e lavorazioni extra riga per riga.</div>
        </div>
        <p className="hint" style={{margin:"7px 0 0"}}>Restano da mettere a mano le cose che sul contratto non ci sono: installatore, incassi e via libera alla posa.</p>
      </div>}
    </div></div>

    <div className="card"><h3>2 · Documenti <span className="tag">{files.length}</span></h3><div className="bd">
      <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
        <button className="btn" onClick={()=>camRef.current.click()}>📷 Scatta foto</button>
        <button className="btn gh" onClick={()=>fileRef.current.click()}>🗂 Scegli file (foto o PDF)</button>
        <input ref={camRef} type="file" accept="image/*" capture="environment" multiple style={{display:"none"}} onChange={addFiles}/>
        <input ref={fileRef} type="file" accept="image/*,application/pdf" multiple style={{display:"none"}} onChange={addFiles}/>
      </div>
      {files.length>0&&<div className="thumbrow">
        {files.map((f,i)=>(<div className="th" key={i}>
          {f.url?<img src={f.url} alt=""/>:<div className="pdfbox">📄</div>}
          <div className="nm">{f.file.name}</div>
          <button className="rm" onClick={()=>rmFile(i)}>✕</button>
        </div>))}
      </div>}
      <div style={{marginTop:14,display:"flex",gap:10,alignItems:"center",flexWrap:"wrap"}}>
        <button className="btn" disabled={!!busy} onClick={leggi}>{busy?"⏳ "+busy:"✨ Leggi i documenti"}</button>

      </div>
      {err&&<p className="hint" style={{color:"var(--accent)",fontWeight:600,marginTop:10}}>{err}</p>}
      <p className="hint" style={{marginTop:12}}>Le foto vengono inviate solo per la lettura: <b>niente viene salvato nel gestionale finché non premi Conferma</b> al passo 3.</p>
    </div></div>

    {rows.length>0&&<div className="card"><h3>3 · Controlla e correggi <span className="tag">{nSel} su {rows.length} selezionate</span></h3><div className="bd">
      <p className="hint">Ogni campo è modificabile. Le righe <b style={{color:"#A93A1B"}}>già presenti</b> nel gestionale partono deselezionate, così non crei doppioni.</p>
